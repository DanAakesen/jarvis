name: Jarvis
options:
  bundleIdPrefix: com.danaakesen
  developmentLanguage: da
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  JarvisCore:
    path: Packages/JarvisCore
  MSAL:
    url: https://github.com/AzureAD/microsoft-authentication-library-for-objc
    exactVersion: 2.17.0
targets:
  Jarvis:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Jarvis
        excludes:
          - "Broadcast/**"
      - path: Shared
    dependencies:
      - package: JarvisCore
        product: JarvisCore
      - package: MSAL
        product: MSAL
      - target: JarvisBroadcast
        embed: true
      - target: JarvisVoiceActivity
        embed: true
      - target: JarvisWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danaakesen.jarvis
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_FILE: Jarvis/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Jarvis/Jarvis.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  JarvisBroadcast:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Jarvis/Broadcast
      - path: Shared/VoiceScreenShareContract.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danaakesen.jarvis.broadcast
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_FILE: Jarvis/Broadcast/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Jarvis/Broadcast/JarvisBroadcast.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Jarvis/Broadcast/ReplayKitStop.h
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
  JarvisUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: JarvisUITests
    dependencies:
      - target: Jarvis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danaakesen.jarvis.uitests
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"
  JarvisVoiceActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: VoiceActivity
      - path: Shared
      - path: Jarvis/JarvisOrbView.swift
      - path: Jarvis/JarvisDesignSystem.swift
    dependencies:
      - package: JarvisCore
        product: JarvisCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danaakesen.jarvis.voiceactivity
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: VoiceActivity/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
  JarvisWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Widgets
      - path: Shared/FactoryTaskActivityAttributes.swift
      - path: Shared/FactoryTaskActivitySurface.swift
    dependencies:
      - package: JarvisCore
        product: JarvisCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danaakesen.jarvis.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
schemes:
  Jarvis:
    build:
      targets:
        Jarvis: all
    test:
      targets:
        - JarvisUITests
