<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis flows</title>
<style>
  :root {
    --proven-bg: #166534; --proven-fg: #ffffff; --proven-line: #166534;
    --docs-bg: #bbf7d0;   --docs-fg: #14532d;   --docs-line: #22a35a;
    --assumed-bg: #fde68a; --assumed-fg: #713f12; --assumed-line: #b45309;
    --unknown-bg: #fecaca; --unknown-fg: #7f1d1d; --unknown-line: #dc2626;
    --context-bg: #e5e7eb; --context-fg: #374151; --context-line: #6b7280;
    --page: #f4f5f7; --surface: #ffffff; --lane-a: #ffffff; --lane-b: #f8f9fb;
    --text: #1f2937; --muted: #5b6472; --rule: #dde1e6; --focus: #2563eb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); background: var(--page); }
  .page { width: 100%; margin: 0; padding: 16px 20px 24px; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .intro { margin: 0 0 12px; color: var(--muted); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin: 0 0 14px; }
  .stat { border-radius: 10px; padding: 10px 14px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .stat .label { display: block; font-weight: 650; }
  .stat .metrics { display: flex; gap: 22px; margin-top: 2px; }
  .stat .metric { display: flex; flex-direction: column; }
  .stat .value { font-size: 28px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat .unit { font-size: 12px; opacity: .85; }
  .stat .where { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 6px; font-size: 12px; }
  .stat .where-title { font-weight: 600; margin-right: 2px; }
  .where-link { appearance: none; font: inherit; font-weight: 600; font-variant-numeric: tabular-nums; cursor: pointer;
                padding: 0 6px; border-radius: 999px; border: 1px solid var(--unknown-line); background: #fff; color: var(--unknown-fg); }
  .where-link:hover { background: #fff1f1; }
  .where-link:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }

  .tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--rule); }
  .tab { appearance: none; border: 0; background: transparent; padding: 8px 12px; font: inherit; color: var(--muted);
         cursor: pointer; white-space: nowrap; border-radius: 8px 8px 0 0; }
  .tab:hover { color: var(--text); background: #eceef1; }
  .tab[aria-selected="true"] { background: var(--surface); color: var(--text); font-weight: 600; }
  .tab .num { display: inline-block; min-width: 1.6em; font-variant-numeric: tabular-nums; }
  .tab.has-unknown { box-shadow: inset 0 0 0 2px var(--unknown-line); }
  .tab-flag { width: 22px; height: 14px; border-radius: 4px 4px 0 0; box-shadow: inset 0 0 0 2px var(--unknown-line); flex: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .tab:focus-visible, .pager button:focus-visible, .node:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .legend { display: grid; gap: 6px; padding: 10px 2px; font-size: 12.5px; }
  .legend-row { display: grid; grid-template-columns: 88px 1fr; align-items: center; }
  .legend-items { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
  .legend-title { font-weight: 700; color: var(--muted); }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-item b { font-weight: 600; }
  .legend-item span.def { color: var(--muted); }
  .swatch { width: 30px; height: 14px; border-radius: 3px; flex: none; }

  .panel { background: var(--surface); border-radius: 10px; padding: 14px 14px 12px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .panel h2 { font-size: 17px; margin: 0 0 2px; }
  .panel .summary { margin: 0 0 4px; }
  .counts { margin: 0 0 10px; display: flex; flex-wrap: wrap; gap: 4px 22px; font-size: 12.5px; }
  .count-group { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .count-title { font-weight: 700; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-weight: 600; font-size: 12px; }

  .diagram-scroll { overflow-x: auto; border-radius: 8px; }
  .diagram { position: relative; display: grid; min-width: min-content; }
  .lane-bg { grid-column: 1 / -1; }
  .lane-bg.even { background: var(--lane-a); }
  .lane-bg.odd { background: var(--lane-b); }
  .lane-head { grid-column: 1; position: sticky; left: 0; z-index: 3; padding: 8px 12px;
               display: flex; flex-direction: column; justify-content: center; box-shadow: 1px 0 0 var(--rule); }
  .lane-head.even { background: var(--lane-a); }
  .lane-head.odd { background: var(--lane-b); }
  .lane-name { font-weight: 600; }
  .lane-tech { font-size: 12px; color: var(--muted); line-height: 1.3; }

  .node { z-index: 2; align-self: center; justify-self: center; width: calc(100% - 48px); max-width: 320px; min-height: 56px;
          margin: 7px 0; border-radius: 8px; padding: 5px 9px 6px; text-align: left; font: inherit; cursor: pointer;
          border: 1px solid transparent; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .node .badge { display: block; font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; opacity: .9; }
  .node .ref { font-size: 11px; letter-spacing: 0; font-variant-numeric: tabular-nums; margin-right: 6px; }
  .node .title { display: block; font-weight: 650; font-size: 13px; line-height: 1.25; margin-top: 1px; }
  .node .detail { display: block; font-size: 11.5px; line-height: 1.3; margin-top: 2px; }
  .node.selected { box-shadow: 0 0 0 3px var(--text); }
  .proven  { background: var(--proven-bg);  color: var(--proven-fg); }
  .docs    { background: var(--docs-bg);    color: var(--docs-fg); }
  .assumed { background: var(--assumed-bg); color: var(--assumed-fg); }
  .unknown { background: var(--unknown-bg); color: var(--unknown-fg); }
  .context { background: var(--context-bg); color: var(--context-fg); }
  .node.context { border: 1px dashed #9aa1ab; box-shadow: none; }

  .overview .node { width: calc(100% - 18px); max-width: none; min-height: 0; margin: 6px 0; padding: 3px 6px 4px; border-radius: 6px; }
  .overview .node .badge { font-size: 8.5px; letter-spacing: .03em; }
  .overview .node .ref { font-size: 9.5px; margin-right: 4px; }
  .overview .node .title { font-size: 11px; font-weight: 600; line-height: 1.2; }
  .overview .node .detail { display: none; }
  .overview .node.selected { box-shadow: 0 0 0 2px var(--text); }
  .overview .lane-head { padding: 6px 10px; }
  .overview .lane-name { font-size: 12.5px; }
  .overview .lane-tech { font-size: 10.5px; }
  .lane-head.corner { background: var(--surface); color: var(--muted); }
  .seg-head { z-index: 2; appearance: none; border: 0; margin: 4px 5px; padding: 3px 8px; border-radius: 6px; background: #eef0f3;
              color: var(--text); font: inherit; font-size: 12px; font-weight: 650; text-align: left; cursor: pointer;
              display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
  .seg-head:hover { background: #e2e5ea; }
  .seg-head.has-unknown { box-shadow: inset 0 0 0 2px var(--unknown-line); }
  .seg-head .num { color: var(--muted); font-variant-numeric: tabular-nums; }
  .seg-note { font-weight: 400; font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .seg-line { z-index: 0; justify-self: start; width: 0; border-left: 1px dashed #c3c8d0; pointer-events: none; }
  .zoom { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 10px; font-size: 12.5px; }
  .zoom-label { font-weight: 700; color: var(--muted); margin-right: 2px; }
  .zoom button, .open-tab { appearance: none; border: 1px solid var(--rule); background: var(--surface); color: var(--text); font: inherit;
                            padding: 2px 10px; border-radius: 999px; cursor: pointer; }
  .zoom button:hover, .open-tab:hover { background: #eceef1; }
  .zoom button[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: #fff; }
  .open-tab { margin-top: 4px; }
  .zoom button:focus-visible, .seg-head:focus-visible, .open-tab:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  svg.edges { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 1; overflow: visible; }

  .details { margin-top: 10px; padding: 8px 12px; background: var(--lane-b); border-radius: 8px; min-height: 44px; }
  .details h3 { margin: 0 0 4px; font-size: 15px; }
  .details p { margin: 2px 0; }
  .details .hint { color: var(--muted); }
  .details a { color: #1d4ed8; }

  .pager { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; }
  .pager button { appearance: none; border: 1px solid var(--rule); background: var(--surface); color: var(--text); font: inherit;
                  padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  .pager button:hover { background: #eceef1; }
  .pager button[hidden] { display: none; }

  @media (prefers-reduced-motion: no-preference) { .tab, .pager button { transition: background-color .12s; } }
</style>
</head>
<body>
<div class="page">
  <h1>Jarvis flows</h1>
  <p class="intro">Status on 4 October 2026 from <a href="../PRODUCT.md">PRODUCT.md</a>, <a href="architecture.md">architecture.md</a>, <a href="decisions.md">decisions.md</a>, the <a href="reference/coding-sandbox-prototype/REPORT.md">coding-sandbox report</a> and the <a href="reference/voice-prototype/REPORT.md">voice report</a>. Each tab picks up where the previous one ends. Boxes are numbered left to right, then top to bottom. Select a box to see its evidence and connections.</p>
  <div class="stats" id="stats" role="list" aria-label="Boxes and connections per status across all flows"></div>
  <div class="tabs" role="tablist" aria-label="Flows" id="tabs"></div>
  <div id="panels"></div>
</div>

<script>
const J = "decisions.md";
const R = "reference/coding-sandbox-prototype/REPORT.md";
const VR = "reference/voice-prototype/REPORT.md";
const DOC = {
  hosted: "https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/hosted-agents",
  sessions: "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/manage-hosted-sessions",
  voice: "https://learn.microsoft.com/en-us/azure/foundry/how-to/voice-first-with-hosted-agent",
  lang: "https://learn.microsoft.com/en-us/azure/ai-services/speech-service/language-support",
  ghApp: "https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/generating-an-installation-access-token-for-a-github-app",
  ghMerge: "https://docs.github.com/en/rest/pulls/pulls#merge-a-pull-request",
  ghTriggers: "https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows",
  ghOidc: "https://docs.github.com/en/actions/security-for-github-actions/security-hardening-your-deployments/configuring-openid-connect-in-azure",
  ghWebhooks: "https://docs.github.com/en/webhooks/webhook-events-and-payloads",
  acaScale: "https://learn.microsoft.com/en-us/azure/container-apps/scale-app",

  codex: "https://github.com/openai/codex/blob/main/codex-rs/login/src/auth/manager.rs",
};

const STATUS = {
  proven:  { label: "Proven (prototype or offline)", short: "Proven", def: "prototype or offline tests", lineDef: "tested in prototype or offline", dash: "", width: 2.6, evidence: "Prototype run or offline tests.", href: R },
  docs:    { label: "Confirmed by docs",   short: "Docs",    def: "vendor docs, not run",  lineDef: "standard code or vendor docs, not run",      dash: "",    width: 2.6, evidence: "Vendor documentation; not run by us." },
  assumed: { label: "Assumed",             short: "Assumed", def: "not built yet",         lineDef: "relies on platform behavior not seen yet",   dash: "7 5", width: 2.2, evidence: "Design assumption; not built or tested yet.", href: J },
  unknown: { label: "Unknown",             short: "Unknown", def: "open or untested",      lineDef: "no known way yet",                           dash: "2 4", width: 2.2, evidence: "Open question; not tested.", href: J },
  context: { label: "From an earlier step", short: "Continues", def: "start of this tab", dash: "4 4", width: 1.6, evidence: "Continues from an earlier tab." },
};
const RISK_KEYS = ["proven", "docs", "assumed", "unknown"];

const LANES = {
  user:     { name: "Dan",              tech: "Browser · microphone" },
  board:    { name: "Board",            tech: "React + TypeScript + Vite · Static Web Apps" },
  voice:    { name: "Voice",            tech: "Voice Live · Ryan HD (EN) · Harper (DA)" },
  jarvis:   { name: "Jarvis agent",     tech: "Foundry hosted agent · voice bridge" },
  model:    { name: "Model",            tech: "gpt-5.6-luna · gpt-realtime-2.1" },
  entra:    { name: "Microsoft Entra",  tech: "Tenant-specific OAuth 2.0 / OIDC" },
  graph:    { name: "Microsoft Graph",  tech: "OneDrive · Microsoft Search" },
  backend:  { name: "Backend",          tech: "Node.js · Container Apps" },
  data:     { name: "SQL data",         tech: "Azure SQL · tasks, settings, events" },
  teams:    { name: "Microsoft Teams",  tech: "Teams personal chat · Adaptive Cards" },
  speech:   { name: "Azure Speech",     tech: "Speech F0 · text-to-speech" },
  blob:     { name: "Blob Storage",     tech: "Private logs · artifacts · task events" },
  vault:    { name: "Secrets",          tech: "Key Vault" },
  foundry:  { name: "Sandbox platform", tech: "Foundry Hosted Agents" },
  runner:   { name: "Runner",           tech: "Python ACP adapter" },
  agent:    { name: "Coding agent",     tech: "Copilot CLI · Codex (codex-acp)" },
  github:   { name: "GitHub",           tech: "Repository · pull requests · checks" },
  actions:  { name: "GitHub Actions",   tech: "Workflows · full build and tests · OIDC deploy" },
  insights: { name: "Telemetry",        tech: "Application Insights · budget" },
  ops:      { name: "Operator",         tech: "PowerShell · Azure CLI" },
};
const LANE_ORDER = Object.keys(LANES);

const FLOWS = [
  {
    name: "Request",
    summary: "Dan configures projects and asks for work on the board or by voice. The Projects page lists, edits, and archives managed projects, lists installed repositories for one-click registration, and shows New projects defaults in Settings. Jarvis can register existing repositories or create and scaffold new ones using those defaults; the sandbox can ask a clarification question through Needs attention. Running counts come from the task API and last-release data remains unavailable until release reads are connected. Chat and voice go to Jarvis; browser voice uses the authenticated backend relay.",
    nodes: [
      { id: "start", lane: "user", col: 1, s: "context", badge: "Start", t: "Dan wants a change", d: "For example: add dark mode to Jarvis.", ev: "Start of the user flow." },
      { id: "card", lane: "board", col: 2, s: "assumed", t: "Add a card", d: "Project, agent and task text.", ev: "Board requirement in PRODUCT.md; the board is not built yet." },
      { id: "create", lane: "backend", col: 3, s: "assumed", t: "Create task", d: "Board buttons call backend functions directly.", ev: "architecture.md: one backend with shared functions for board, voice and Windows." },
      { id: "project-settings", lane: "board", col: 2, s: "proven", t: "Manage project settings", d: "List, edit, and archive managed projects; register installed repositories in place; New projects defaults live in Settings.", ev: "P1-10/P3-11 and P3-13 Vitest and Chromium checks cover project management, repository display/refresh, one-click registration and the absence of a Projects create form at 390/1280 px. Live Entra, GitHub App, and Azure SQL behavior remain unverified." },
      { id: "project-api", lane: "backend", col: 3, s: "proven", t: "Projects and repository APIs", d: "Authenticated project CRUD and installed-repository listing/registration routes validate requests; Jarvis creates and registers projects through backend tools.", ev: "P1-03/P3-12/P3-13 Fastify tests cover project CRUD, repository listing and cache refresh, New projects defaults, tech detection, `manage_repository` and `create_project`. Live GitHub, Key Vault, Entra, and Azure SQL behavior remain unverified." },
      { id: "project-store", lane: "data", col: 4, s: "proven", t: "Read and write projects", d: "Parameterized SQL; archive sets active = 0. P1-14 bounds connection and read-only resume retries to 90 seconds without replaying executed writes.", ev: "P1-03 SQL Server-container tests cover CRUD. P1-14 fake-time SQL tests cover resume recovery; authenticated in-memory status drives the shared Waking Jarvis… message, inspected in Chromium at 390/1440 px. Live Azure auto-resume remains unverified." },
      { id: "new-project-request", lane: "jarvis", col: 2, s: "proven", t: "Name and describe a project", d: "Jarvis calls create_project with only the requested name and description.", ev: "P3-12 tool contract validates these inputs and reads the message ID from the backend request." },
      { id: "new-project-tool", lane: "backend", col: 4, s: "proven", t: "Create repository securely", d: "Backend reads jarvis-repo-admin from Key Vault, creates the configured repository and never sends the token to a sandbox.", ev: "P3-12 offline tests assert the secret is absent from task prompt, events, tool-call records and tool result. Live GitHub/Key Vault access remains unverified." },
      { id: "new-project-repo", lane: "github", col: 5, s: "proven", t: "Create configured repository", d: "GitHub creates the repo with configured owner, visibility, and default branch.", ev: "P3-12 backend contract tests cover the GitHub request. Live repository creation remains unverified." },
      { id: "new-project-register", lane: "data", col: 6, s: "proven", t: "Register project and scaffold task", d: "Apply New projects defaults and link the chat-origin task to the calling message.", ev: "P3-12 tests cover configured project values, message linkage and task creation without a schema change; live Azure SQL remains unverified." },
      { id: "new-project-scaffold", lane: "runner", col: 8, s: "proven", t: "Scaffold in the sandbox", d: "Clone templates with the normal Git credential helper; run cpinit via PowerShell 7; fill PRODUCT.md/PLAN.md and add P3-09 workflows.", ev: "P3-12 runner marker tests and Runner CI image smoke check cover offline protocol and pwsh availability. Private template access and a live PR remain unverified." },
      { id: "new-project-attention", lane: "backend", col: 9, s: "proven", t: "Ask when details are missing", d: "A bounded question in the explicit marker moves the task to Needs attention.", ev: "P3-12 runner and heartbeat tests cover the terminal status and recorded question." },
      { id: "new-project-pr", lane: "github", col: 10, s: "proven", t: "Open the scaffold PR", d: "The coding agent opens a PR against the configured default branch.", ev: "The task prompt requires the PR; live repository creation and scaffold acceptance are the coordinator's post-merge check." },
      { id: "chat", lane: "board", col: 4, s: "assumed", t: "Type to Jarvis", d: "Chat box on the board.", ev: "Design assumption: the board can also send free text to the Jarvis agent." },
      { id: "speak", lane: "voice", col: 2, s: "proven", t: "Speak Danish", d: "The browser authenticates to `/voice/da`, waits for session readiness and a silent `/diag` warm-up, then opens the microphone; speech start stops playback and relay closure reconnects.", ev: "P5-04 focused web tests cover warm-up ordering, interruption, reconnect, and next-session language selection. Real microphone/speaker behavior and live round-trip are unverified." },
      { id: "relay", lane: "backend", col: 3, s: "unknown", t: "Relay to Voice Live", d: "Backend authenticates the browser and forwards WebSocket messages to the provisioned Danish voice agent.", ev: "Local tests verify the `/voice/da` endpoint and bidirectional forwarding against a mock upstream. The workflow provisions MAI Transcribe (`da`, phrase list) and Harper (`da-DK`); live provisioning, Azure interoperability, and browser round-trip remain unverified pending P5-04 and Azure access." },
      { id: "stt", lane: "voice", col: 4, s: "proven", t: "Danish speech to text", d: "MAI Transcribe, language da: 0–1.8 % word errors.", ev: "Voice prototype V2: MAI Transcribe heard English names in Danish correctly; Azure Speech da-DK had 22–25 % word errors; no language set was unusable.", href: VR },
      { id: "vq", lane: "voice", col: 5, s: "proven", t: "Voice quality and cost", d: "2.7–3.9 s to first audio; ≈4 DKK per 30-minute day.", ev: "Voice prototype V6–V7: interruption detected in 0.6 s; cost estimated from measured usage at list prices; billed meters to confirm with infra/cost.ps1.", href: VR },
      { id: "jin", lane: "jarvis", col: 6, s: "proven", t: "Jarvis agent gets the text", d: "Voice Live bridges to a hosted agent (preview).", ev: "Voice prototype V1: voice agent → hosted agent over Bridge Protocol 1.0 (invocations_ws).", href: VR },
    ],
    edges: [
      ["start", "card", "docs", "click"], ["start", "project-settings", "docs", "project settings"], ["project-settings", "project-api", "docs", "API request"],
      ["project-api", "project-store", "docs", "SQL"], ["start", "speak", "unknown", "speak", { off: 32 }], ["start", "chat", "docs", "type"],
      ["start", "new-project-request", "docs", "name + description"], ["new-project-request", "new-project-tool", "docs", "tool call"],
      ["new-project-tool", "new-project-repo", "docs", "GitHub API"], ["new-project-repo", "new-project-register", "docs", "repo created"],

      ["card", "create", "docs", "create task"], ["speak", "relay", "unknown", "audio"],
      ["relay", "stt", "unknown", "audio"],
      ["stt", "jin", "proven", "text"], ["chat", "jin", "docs", "text", { off: 32 }],
    ],
  },
  {
    name: "Sign in",
    summary: "MSAL requests the delegated Jarvis API scope; the backend verifies Dan and returns only his display name.",
    nodes: [
      { id: "start", lane: "user", col: 1, s: "context", t: "Dan opens Jarvis", d: "Use the browser with the configured backend." },
      { id: "button", lane: "board", col: 2, s: "docs", t: "Choose Microsoft sign-in", d: "Unavailable until a backend URL is configured.", ev: "P0-09: the one-column home page provides pending, disabled, and error states." },
      { id: "msal", lane: "board", col: 3, s: "docs", t: "MSAL requests the API scope", d: "Tenant-specific popup; browser cache uses session storage.", ev: "P0-09: local tests check the requested scope and access-token forwarding; no live account was used." },
      { id: "entra", lane: "entra", col: 4, s: "docs", t: "Return delegated API token", d: "`access_as_user` for `jarvis-api`.", ev: "MSAL and bootstrap configuration are implemented; real Entra consent/sign-in is unverified without Azure access." },
      { id: "me", lane: "backend", col: 5, s: "docs", t: "GET /me", d: "Browser sends the access token as a bearer credential.", ev: "P0-09 tests the authenticated route using a signed local fixture token." },
      { id: "verify", lane: "backend", col: 6, s: "docs", t: "Allow Dan; refuse others", d: "Verify signature, tenant, audience, delegated scope, and allow-listed object ID.", ev: "P0-08's RS256/JWKS tests and P0-09's /me test prove another object ID receives 403 offline." },
      { id: "result", lane: "board", col: 7, s: "docs", t: "Open the shell or refuse", d: "Only a successful `/me` response opens the app shell with the bounded name; 401/403 shows a refusal.", ev: "P0-09 browser tests cover successful name display and refusal. P1-07 tests keep area navigation, settings and every shell page behind that response and keep the session while navigating. Live tenant behavior remains unverified." },

const SVG_NS = "http://www.w3.org/2000/svg";
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function buildLegend() {
  const legend = el("div", "legend");
  legend.setAttribute("role", "group"); legend.setAttribute("aria-label", "Legend");
  const item = (sample, title, def) => {
    const entry = el("div", "legend-item");
    const label = el("span"); label.append(el("b", null, title), " ", el("span", "def", def));
    entry.append(sample, label);
    return entry;
  };
  const row = (title, entries) => {
    const r = el("div", "legend-row");
    r.setAttribute("role", "group"); r.setAttribute("aria-label", title);
    const items = el("div", "legend-items"); items.append(...entries);
    r.append(el("span", "legend-title", title), items);
    legend.append(r);
  };
  row("Boxes", [
    ...[...RISK_KEYS, "context"].map(key => {
      const sw = el("span", `swatch ${key}`);
      if (key === "context") sw.style.border = "1px dashed #9aa1ab";
      return item(sw, STATUS[key].label, STATUS[key].def);
    }),
    item(el("span", "tab-flag"), "Red tab outline", "tab has unknowns"),
  ]);
  row("Connections", RISK_KEYS.map(key => item(lineSample(key), STATUS[key].label, STATUS[key].lineDef)));
  return legend;
}

function goTo(n, nodeId) {
  select(n, true);
  const box = document.querySelector(`#panel-${n} [data-node="${nodeId}"]`);
  box.click(); box.focus({ preventScroll: true });
  box.scrollIntoView({ block: "nearest", inline: "nearest" });
}

function buildStats() {
  const stats = document.getElementById("stats");
  const nodes = FLOWS.flatMap(flow => flow.nodes).filter(node => RISK_KEYS.includes(node.s));
  const edges = FLOWS.flatMap((flow, i) => flow.edges.map(e => ({ n: i + 1, flow, e })));
  const share = (part, all) => `${Math.round(part / all * 100)}%`;
  for (const key of RISK_KEYS) {
    const boxes = nodes.filter(node => node.s === key);
    const lines = edges.filter(x => x.e[2] === key);
    const card = el("div", `stat ${key}`);
    card.setAttribute("role", "listitem");
    const metric = (value, [one, many], all) => {
      const m = el("span", "metric");
      m.append(el("span", "value", String(value)), el("span", "unit", `${value === 1 ? one : many} · ${share(value, all)}`));
      return m;
    };
    const metrics = el("div", "metrics");
    metrics.append(metric(boxes.length, ["box", "boxes"], nodes.length), metric(lines.length, ["connection", "connections"], edges.length));
    card.append(el("span", "label", STATUS[key].label), metrics);
    if (key === "unknown" && (boxes.length || lines.length)) {
      const where = el("div", "where");
      where.append(el("span", "where-title", "Where:"));
      for (const node of boxes) {
        const link = el("button", "where-link", node.ref);
        link.type = "button"; link.title = node.t;
        link.setAttribute("aria-label", `${node.ref} ${node.t}`);
        link.addEventListener("click", () => goTo(node.tab, node.id));
        where.append(link);
      }
      for (const { n, flow, e } of lines) {
        const from = flow.nodes.find(x => x.id === e[0]), to = flow.nodes.find(x => x.id === e[1]);
        const link = el("button", "where-link", `${from.ref}→${to.ref}`);
        link.type = "button"; link.title = `${from.t} → ${to.t}`;
        link.addEventListener("click", () => goTo(n, from.id));
        where.append(link);
      }
      card.append(where);
    }
    stats.append(card);
  }
}

function lineSample(key) {
  const s = STATUS[key];
  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("width", "30"); svg.setAttribute("height", "10"); svg.setAttribute("aria-hidden", "true");
  const line = document.createElementNS(SVG_NS, "line");
  line.setAttribute("x1", "1"); line.setAttribute("y1", "5"); line.setAttribute("x2", "29"); line.setAttribute("y2", "5");
  line.setAttribute("style", `stroke: var(--${key}-line); stroke-width: ${s.width}; ${s.dash ? `stroke-dasharray: ${s.dash};` : ""} stroke-linecap: round;`);
  svg.append(line);
  return svg;
}

const byPosition = (a, b) => a.col - b.col || LANE_ORDER.indexOf(a.lane) - LANE_ORDER.indexOf(b.lane);
const OV = { head: 120, col: 100, gap: 18, offScale: 0.5 };
let current = 0;
let zoomMode = 1;

function assignRefs() {
  FLOWS.forEach((flow, i) => {
    const n = i + 1;
    flow.ordered = [...flow.nodes].sort(byPosition);
    flow.ordered.forEach((node, k) => { node.ref = `${n}.${k + 1}`; node.tab = n; });
  });
}

function buildOverview() {
  const nodes = [], edges = [], segments = [];
  let offset = 0;
  FLOWS.forEach((flow, i) => {
    const n = i + 1;
    const key = id => `${n}:${id}`;
    const ctx = n > 1 ? flow.nodes.find(x => x.s === "context") : null;
    const kept = flow.nodes.filter(x => x !== ctx);
    const first = Math.min(...kept.map(x => x.col)), last = Math.max(...kept.map(x => x.col));
    for (const x of kept) nodes.push({ ...x, id: key(x.id), srcId: x.id, col: offset + x.col - first + 1 });
    for (const [from, to, s, label, opt] of flow.edges) {
      if (ctx && from === ctx.id) {
        for (const [fn, fid] of ctx.from || []) edges.push([`${fn}:${fid}`, key(to), s, label, { gutter: true }]);
      } else edges.push([key(from), key(to), s, label, opt]);
    }
    segments.push({
      n, name: flow.name, start: offset + 1, end: offset + last - first + 1,
      note: ctx && !ctx.from ? ctx.t : "", ctx: ctx ? ctx.t : "",
      unknown: kept.some(x => x.s === "unknown") || flow.edges.some(e => e[2] === "unknown"),
    });
    offset += last - first + 1;
  });
  return {
    name: "Complete flow", overview: true, offScale: OV.offScale, nodes, edges, segments, cols: offset,
    ordered: [...nodes].sort(byPosition),
    summary: "All flows in one swimlane, in tab order. Arrows between segments show where each flow picks up. Select a box for details, or a segment title to open its tab.",
  };
}

function buildTabs() {
  const tabs = document.getElementById("tabs");
  const panels = document.getElementById("panels");
  VIEWS.forEach((view, n) => {
    const tab = el("button", "tab");
    tab.type = "button"; tab.id = `tab-${n}`; tab.setAttribute("role", "tab");
    tab.setAttribute("aria-controls", `panel-${n}`); tab.setAttribute("aria-selected", "false"); tab.tabIndex = -1;
    tab.append(el("span", "num", String(n)), view.name);
    const unknownBoxes = view.nodes.filter(node => node.s === "unknown").length;
    const unknownLines = view.edges.filter(e => e[2] === "unknown").length;
    if (unknownBoxes + unknownLines) {
      tab.classList.add("has-unknown");
      const parts = [];
      if (unknownBoxes) parts.push(`${unknownBoxes} unknown ${unknownBoxes === 1 ? "box" : "boxes"}`);
      if (unknownLines) parts.push(`${unknownLines} unknown ${unknownLines === 1 ? "connection" : "connections"}`);
      tab.title = parts.join(", ");
      tab.append(el("span", "sr-only", ` (${tab.title})`));
    }
    tab.addEventListener("click", () => select(n, true));
    tab.addEventListener("keydown", onTabKey);
    tabs.append(tab);
    panels.append(buildPanel(view, n));
  });
}

function onTabKey(e) {
  const at = Number(e.currentTarget.id.split("-")[1]);
  const len = VIEWS.length;
  let next = null;
  if (e.key === "ArrowRight") next = (at + 1) % len;
  else if (e.key === "ArrowLeft") next = (at + len - 1) % len;
  else if (e.key === "Home") next = 0;
  else if (e.key === "End") next = len - 1;
  if (next !== null) { e.preventDefault(); select(next, true); document.getElementById(`tab-${next}`).focus(); }
}

function buildZoomBar() {
  const bar = el("div", "zoom");
  bar.setAttribute("role", "group"); bar.setAttribute("aria-label", "Zoom");
  bar.append(el("span", "zoom-label", "Zoom"));
  for (const [label, value] of [["Whole flow", "fit"], ["50%", 0.5], ["75%", 0.75], ["100%", 1]]) {
    const b = el("button", null, label);
    b.type = "button"; b.dataset.zoom = String(value); b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => setZoom(value));
    bar.append(b);
  }
  return bar;
}

function setZoom(mode) {
  zoomMode = mode;
  const panel = document.getElementById("panel-0");
  const scroll = panel.querySelector(".diagram-scroll");
  const diagram = panel.querySelector(".diagram");
  const natural = OV.head + VIEWS[0].cols * OV.col;
  const z = mode === "fit" ? Math.min(1, Math.max(0.1, (scroll.clientWidth - 2) / natural)) : mode;
  diagram.style.zoom = String(z);
  panel.querySelectorAll(".zoom button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.zoom === String(mode))));
  if (current === 0) requestAnimationFrame(() => drawEdges(0));
}

function buildPanel(view, n) {
  const ov = Boolean(view.overview);
  const panel = el("section", ov ? "panel overview" : "panel");
  panel.id = `panel-${n}`; panel.setAttribute("role", "tabpanel"); panel.setAttribute("aria-labelledby", `tab-${n}`); panel.hidden = true;
  panel.append(el("h2", null, `${n} · ${view.name}`), el("p", "summary", view.summary));

  if (ov) panel.append(buildZoomBar());
  else {
    const counts = el("div", "counts");
    const countGroup = (title, items) => {
      const g = el("p", "count-group");
      g.append(el("span", "count-title", title));
      for (const key of RISK_KEYS) g.append(el("span", `chip ${key}`, `${STATUS[key].short} ${items.filter(x => x === key).length}`));
      counts.append(g);
    };
    countGroup("Boxes", view.nodes.map(node => node.s));
    countGroup("Connections", view.edges.map(e => e[2]));
    panel.append(counts);
  }

  const lanes = LANE_ORDER.filter(lane => view.nodes.some(node => node.lane === lane));
  const cols = Math.max(...view.nodes.map(node => node.col));
  const top = ov ? 1 : 0;
  const scroll = el("div", "diagram-scroll");
  const diagram = el("div", "diagram");
  if (ov) {
    diagram.style.gridTemplateColumns = `${OV.head}px repeat(${cols}, ${OV.col}px)`;
    diagram.style.gridTemplateRows = `32px repeat(${lanes.length}, minmax(54px, auto))`;
  } else {
    diagram.style.gridTemplateColumns = `156px repeat(${cols}, minmax(172px, 1fr))`;
    diagram.style.gridTemplateRows = `repeat(${lanes.length}, minmax(84px, auto))`;
  }
  diagram.setAttribute("role", "group");
  diagram.setAttribute("aria-label", `${view.name} swimlane diagram`);

  lanes.forEach((lane, row) => {
    const parity = row % 2 ? "odd" : "even";
    const bg = el("div", `lane-bg ${parity}`); bg.style.gridRow = String(row + 1 + top); bg.dataset.lane = lane;
    const head = el("div", `lane-head ${parity}`); head.style.gridRow = String(row + 1 + top);
    head.append(el("span", "lane-name", LANES[lane].name), el("span", "lane-tech", LANES[lane].tech));
    diagram.append(bg, head);
  });

  if (ov) {
    const corner = el("div", "lane-head corner");
    corner.style.gridRow = "1";
    corner.append(el("span", "lane-name", "Flow"));
    diagram.append(corner);
    for (const seg of view.segments) {
      const head = el("button", `seg-head${seg.unknown ? " has-unknown" : ""}`);
      head.type = "button";
      head.style.gridRow = "1"; head.style.gridColumn = `${seg.start + 1} / ${seg.end + 2}`;
      head.append(el("span", "num", String(seg.n)), el("span", "seg-name", seg.name));
      if (seg.note) head.append(el("span", "seg-note", seg.note));
      head.title = `Open tab ${seg.n}${seg.ctx ? ` (${seg.ctx})` : ""}${seg.unknown ? " · has unknowns" : ""}`;
      head.addEventListener("click", () => select(seg.n, true));
      diagram.append(head);
      if (seg.n > 1) {
        const line = el("div", "seg-line");
        line.style.gridRow = "1 / -1"; line.style.gridColumn = String(seg.start + 1);
        diagram.append(line);
      }
    }
  }

  const details = el("div", "details");
  details.setAttribute("aria-live", "polite");
  details.append(el("p", "hint", "Select a box to see its evidence and connections."));

  for (const node of view.ordered) {
    const box = el("button", `node ${node.s}`);
    box.type = "button";
    box.dataset.node = node.id;
    box.style.gridRow = String(lanes.indexOf(node.lane) + 1 + top);
    box.style.gridColumn = String(node.col + 1);
    const badge = el("span", "badge");
    badge.append(el("span", "ref", node.ref), node.badge || STATUS[node.s].short);
    box.append(badge, el("span", "title", node.t));
    if (node.d) box.append(el("span", "detail", node.d));
    box.setAttribute("aria-label", `${node.ref} ${node.t}. ${STATUS[node.s].label}. ${LANES[node.lane].name}.`);
    box.addEventListener("click", () => showDetails(view, node, panel, details));
    diagram.append(box);
  }

  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("class", "edges"); svg.setAttribute("aria-hidden", "true");
  diagram.append(svg);
  scroll.append(diagram);
  panel.append(scroll, buildLegend(), details);

  const pager = el("div", "pager");
  const last = VIEWS.length - 1;
  const prev = el("button", null, n > 0 ? `← ${n - 1} ${VIEWS[n - 1].name}` : "");
  prev.type = "button"; prev.hidden = n === 0; prev.addEventListener("click", () => select(n - 1, true));
  const next = el("button", null, n < last ? `${n + 1} ${VIEWS[n + 1].name} →` : "");
  next.type = "button"; next.hidden = n === last; next.addEventListener("click", () => select(n + 1, true));
  pager.append(prev, next);
  panel.append(pager);
  return panel;
}

function showDetails(view, node, panel, details) {
  panel.querySelectorAll(".node.selected").forEach(b => b.classList.remove("selected"));
  panel.querySelector(`[data-node="${node.id}"]`).classList.add("selected");
  const s = STATUS[node.s];
  details.replaceChildren();
  details.append(el("h3", null, `${node.ref} ${node.t}`));
  const meta = el("p"); meta.append(el("span", `chip ${node.s}`, s.label), ` ${LANES[node.lane].name} · ${LANES[node.lane].tech}`);
  details.append(meta);
  if (node.d) details.append(el("p", null, node.d));
  const ev = el("p"); ev.append(el("b", null, "Evidence: "), node.ev || s.evidence);
  const href = node.href || s.href;
  if (href) { ev.append(" "); const a = el("a", null, "Open source"); a.href = href; a.target = "_blank"; a.rel = "noopener"; ev.append(a); }
  details.append(ev);
  const title = id => { const x = view.nodes.find(y => y.id === id); return `${x.ref} ${x.t}`; };
  const describe = (e, other) => `${title(other)}${e[3] ? ` (${e[3]})` : ""} — ${STATUS[e[2]].short}`;
  const incoming = view.edges.filter(e => e[1] === node.id).map(e => describe(e, e[0]));
  const outgoing = view.edges.filter(e => e[0] === node.id).map(e => describe(e, e[1]));
  if (incoming.length) { const p = el("p"); p.append(el("b", null, "Comes from: "), incoming.join("; ")); details.append(p); }
  if (outgoing.length) { const p = el("p"); p.append(el("b", null, "Leads to: "), outgoing.join("; ")); details.append(p); }
  if (view.overview) {
    const open = el("button", "open-tab", `Open in tab ${node.tab} · ${FLOWS[node.tab - 1].name}`);
    open.type = "button";
    open.addEventListener("click", () => goTo(node.tab, node.srcId));
    details.append(open);
  }
}

function route(a, b, opt = {}) {
  const off = opt.off ?? 16;
  const acx = a.x + a.w / 2, acy = a.y + a.h / 2, bcx = b.x + b.w / 2, bcy = b.y + b.h / 2;
  if (b.x >= a.x + a.w - 2) {
    const x1 = a.x + a.w, x2 = b.x;
    if (Math.abs(acy - bcy) < 1) return `M${x1} ${acy} H${x2}`;
    const xm = Math.max(x1 + 8, x2 - off);
    return `M${x1} ${acy} H${xm} V${bcy} H${x2}`;
  }
  if (b.x + b.w <= a.x + 2) {
    const x1 = a.x, x2 = b.x + b.w;
    if (Math.abs(acy - bcy) < 1) return `M${x1} ${acy} H${x2}`;
    const xm = Math.min(x1 - 8, x2 + off);
    return `M${x1} ${acy} H${xm} V${bcy} H${x2}`;
  }
  const down = bcy > acy;
  const y1 = down ? a.y + a.h : a.y, y2 = down ? b.y : b.y + b.h;
  if (Math.abs(acx - bcx) < 1) return `M${acx} ${y1} V${y2}`;
  const ym = (y1 + y2) / 2;
  return `M${acx} ${y1} V${ym} H${bcx} V${y2}`;
}

// Long links between overview segments run in the column gaps and along the target lane's top edge, so they never pass behind boxes.
function routeGutter(a, b, laneTop, gap) {
  const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2;
  const xa = x1 + gap / 2, xb = x2 - gap / 2;
  if (xb - xa < 4) return Math.abs(y1 - y2) < 1 ? `M${x1} ${y1} H${x2}` : `M${x1} ${y1} H${xa} V${y2} H${x2}`;
  const gy = laneTop + 3;
  return `M${x1} ${y1} H${xa} V${gy} H${xb} V${y2} H${x2}`;
}

function drawEdges(n) {
  const view = VIEWS[n];
  const panel = document.getElementById(`panel-${n}`);
  const diagram = panel.querySelector(".diagram");
  const svg = diagram.querySelector("svg.edges");
  const z = parseFloat(diagram.style.zoom) || 1;
  const base = diagram.getBoundingClientRect();
  const rel = elm => { const r = elm.getBoundingClientRect(); return { x: (r.left - base.left) / z, y: (r.top - base.top) / z, w: r.width / z, h: r.height / z }; };
  svg.setAttribute("width", String(base.width / z));
  svg.setAttribute("height", String(base.height / z));
  svg.replaceChildren();
  const defs = document.createElementNS(SVG_NS, "defs");
  for (const key of Object.keys(STATUS)) {
    const marker = document.createElementNS(SVG_NS, "marker");
    marker.setAttribute("id", `arrow-${n}-${key}`);
    marker.setAttribute("viewBox", "0 0 10 10"); marker.setAttribute("refX", "9"); marker.setAttribute("refY", "5");
    marker.setAttribute("markerUnits", "userSpaceOnUse");
    marker.setAttribute("markerWidth", "10"); marker.setAttribute("markerHeight", "10"); marker.setAttribute("orient", "auto");
    const tip = document.createElementNS(SVG_NS, "path");
    tip.setAttribute("d", "M0,0 L10,5 L0,10 z"); tip.setAttribute("style", `fill: var(--${key}-line)`);
    marker.append(tip); defs.append(marker);
  }
  svg.append(defs);
  for (const [from, to, status, , opt = {}] of view.edges) {
    const a = diagram.querySelector(`[data-node="${from}"]`);
    const b = diagram.querySelector(`[data-node="${to}"]`);
    if (!a || !b) continue;
    let d;
    if (opt.gutter) {
      const lane = view.nodes.find(x => x.id === to).lane;
      d = routeGutter(rel(a), rel(b), rel(diagram.querySelector(`.lane-bg[data-lane="${lane}"]`)).y, OV.gap);
    } else {
      d = route(rel(a), rel(b), { off: (opt.off ?? 16) * (view.offScale ?? 1) });
    }
    const s = STATUS[status];
    const path = document.createElementNS(SVG_NS, "path");
    path.setAttribute("d", d);
    path.setAttribute("fill", "none");
    path.setAttribute("style", `stroke: var(--${status}-line); stroke-width: ${s.width}; ${s.dash ? `stroke-dasharray: ${s.dash};` : ""} stroke-linecap: round; stroke-linejoin: round;`);
    path.setAttribute("marker-end", `url(#arrow-${n}-${status})`);
    svg.append(path);
  }
}

function select(n, updateHash) {
  current = n;
  VIEWS.forEach((_, k) => {
    const tab = document.getElementById(`tab-${k}`);
    tab.setAttribute("aria-selected", String(k === n));
    tab.tabIndex = k === n ? 0 : -1;
    document.getElementById(`panel-${k}`).hidden = k !== n;
  });
  document.getElementById(`tab-${n}`).scrollIntoView({ block: "nearest", inline: "nearest" });
  if (updateHash) history.replaceState(null, "", `#flow-${n}`);
  if (n === 0 && zoomMode === "fit") requestAnimationFrame(() => setZoom("fit"));
  else requestAnimationFrame(() => drawEdges(n));
}

function redraw() {
  if (current === 0 && zoomMode === "fit") setZoom("fit");
  else drawEdges(current);
}

assignRefs();
const VIEWS = [buildOverview(), ...FLOWS];
buildTabs();
buildStats();
setZoom(1);
const fromHash = Number((location.hash.match(/flow-(\d+)/) || [])[1]);
select(Number.isInteger(fromHash) && fromHash >= 0 && fromHash < VIEWS.length ? fromHash : 0, false);
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(redraw, 80); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);
</script>
</body>
