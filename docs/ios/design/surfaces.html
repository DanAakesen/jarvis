<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Jarvis for iPhone · system surfaces</title>
<style>
/* Tokens match the concept board (ios-lab), which copies the brand colours from apps/web/src/styles.css. */
:root {
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
  color-scheme: light;
  --page: #f6f0e6;
  --text: #17202a;
  --text-muted: #5c564f;
  --accent: #14768d;
  --accent-text: #fff;
  --record-stop: #e5383b;
  --orb-listening: #2aa4c2;
  --orb-thinking: #e8a23a;
  --orb-in-a: rgb(10 46 62 / 88%);
  --orb-in-b: rgb(10 46 62 / 72%);
  --ambient:
    radial-gradient(60% 36% at 12% 10%, rgb(20 118 141 / 24%), transparent 70%),
    radial-gradient(54% 34% at 94% 20%, rgb(232 162 58 / 30%), transparent 70%),
    radial-gradient(70% 38% at 24% 98%, rgb(45 179 93 / 18%), transparent 70%),
    radial-gradient(54% 30% at 92% 80%, rgb(47 128 237 / 16%), transparent 70%);
  --sep: rgb(60 50 30 / 16%);
  --g-fill: rgb(255 255 255 / 30%);
  --g-fill-bar: rgb(255 255 255 / 44%);
  --g-sat: 1.7;
  --g-shadow: 0 10px 30px rgb(60 45 20 / 16%), 0 1px 3px rgb(60 45 20 / 12%);
  --g-solid: #efe8dc;
  --rim-hi: rgb(255 255 255 / 100%);
  --rim-mid: rgb(255 255 255 / 60%);
  --rim-lo: rgb(70 55 30 / 14%);
  --sheen: rgb(255 255 255 / 50%);
  --board-bg: #e4ddd0;
  --board-bar: #f1ebe0;
  --board-text: #17202a;
  --board-muted: #4f4a44;
  --board-rule: #c9bfae;
  --focus: #14768d;
}
:root[data-theme="dark"], .force-dark {
  color-scheme: dark;
  --page: #07090f;
  --text: #f3fff9;
  --text-muted: #c0ccd2;
  --accent: #52dcfa;
  --accent-text: #04161d;
  --orb-listening: #52dcfa;
  --orb-thinking: #ffb45c;
  --orb-in-a: rgb(8 40 56 / 62%);
  --orb-in-b: rgb(6 30 44 / 46%);
  --ambient:
    radial-gradient(60% 36% at 12% 10%, rgb(82 220 250 / 30%), transparent 70%),
    radial-gradient(54% 34% at 94% 20%, rgb(255 180 92 / 26%), transparent 70%),
    radial-gradient(70% 38% at 24% 98%, rgb(61 220 132 / 16%), transparent 70%),
    radial-gradient(54% 30% at 92% 80%, rgb(59 139 255 / 20%), transparent 70%);
  --sep: rgb(226 246 255 / 14%);
  --g-fill: rgb(255 255 255 / 7%);
  --g-fill-bar: rgb(16 22 30 / 36%);
  --g-shadow: 0 12px 34px rgb(0 0 0 / 42%), 0 1px 3px rgb(0 0 0 / 30%);
  --g-solid: #161c24;
  --rim-hi: rgb(255 255 255 / 85%);
  --rim-mid: rgb(255 255 255 / 34%);
  --rim-lo: rgb(255 255 255 / 5%);
  --sheen: rgb(255 255 255 / 13%);
}
:root[data-theme="dark"] {
  --board-bg: #03060a;
  --board-bar: #0b1118;
  --board-text: #f3fff9;
  --board-muted: #b7c4ca;
  --board-rule: rgb(226 246 255 / 14%);
  --focus: #8be9ff;
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--board-bg); color: var(--board-text); font: 15px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Board chrome */
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 12px 20px; background: var(--board-bar); border-bottom: 1px solid var(--board-rule); }
.head h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -.2px; }
.head p { flex: 1 1 340px; margin: 0; color: var(--board-muted); font-size: 13px; }
.seg { display: inline-flex; padding: 2px; border: 1px solid var(--board-rule); border-radius: 10px; background: color-mix(in srgb, var(--board-text) 5%, transparent); }
.seg label { position: relative; display: block; }
.seg input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
.seg span { display: grid; place-items: center; min-height: 28px; padding: 0 12px; border-radius: 8px; color: var(--board-muted); font-size: 12px; font-weight: 600; }
.seg input:checked + span { background: var(--board-text); color: var(--board-bg); }
.seg input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (pointer: coarse) { .seg span { min-height: 44px; } }

.gallery { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 40px 30px; padding: 26px 20px 56px; }
.fig { --s: .68; --fw: 393px; --fh: 852px; width: calc(var(--fw) * var(--s)); margin: 0; }
.fig.land { --fw: 852px; --fh: 393px; }
.fig.card { --fh: 452px; }
.fig.sheet { --fh: 660px; }
.frame { position: relative; width: calc(var(--fw) * var(--s)); height: calc(var(--fh) * var(--s)); }
.fig figcaption { margin-top: 12px; }
.fig h2 { margin: 0 0 3px; font-size: 14px; font-weight: 650; }
.fig p { margin: 0; color: var(--board-muted); font-size: 13px; line-height: 1.45; }
.fig p + p { margin-top: 5px; }

/* Screen illustrations (393 x 852 points, scaled down) */
.screen {
  position: absolute; left: 0; top: 0; width: var(--fw); height: var(--fh); overflow: hidden; isolation: isolate;
  transform: scale(var(--s)); transform-origin: 0 0; border-radius: 56px;
  background: var(--page); color: var(--text); font: 17px/1.3 var(--font-body); -webkit-font-smoothing: antialiased;
  box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--board-text) 14%, transparent);
}
.screen::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--ambient); }
.screen.card { border-radius: 34px; }
.screen.wide { border-radius: 46px; }
.screen.pure { background: #000; }
.island { position: absolute; z-index: 50; top: 11px; left: 50%; width: 126px; height: 37px; margin-left: -63px; border-radius: 19px; background: #000; }
.home { position: absolute; z-index: 51; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--text); opacity: .55; }
.sbar { position: absolute; z-index: 45; top: 0; left: 0; right: 0; height: 59px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px 0 50px; font-size: 17px; font-weight: 600; }
.batt { position: relative; width: 27px; height: 13px; border-radius: 4px; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text) 45%, transparent); }
.batt::before { content: ""; position: absolute; inset: 2px 7px 2px 2px; border-radius: 2px; background: var(--text); }
.ic { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

/* Liquid glass, frosted base (same recipe as the board) */
.glass { position: relative; background: var(--g-fill); box-shadow: var(--g-shadow); -webkit-backdrop-filter: blur(16px) saturate(var(--g-sat)); backdrop-filter: blur(16px) saturate(var(--g-sat)); }
.glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(120% 160% at 8% -20%, var(--sheen), transparent 55%); }
.glass::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
  background: conic-gradient(from 215deg, var(--rim-hi), var(--rim-lo) 26%, transparent 48%, var(--rim-mid) 72%, var(--rim-hi));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}
.bar-fill { background: var(--g-fill-bar); }
@media (prefers-reduced-transparency: reduce) { .glass { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--g-solid); } }

/* Orb (small renditions of the real orb) */
.mo {
  --c: var(--orb-listening); --d: 40px; position: relative; flex: none; display: block; width: var(--d); height: var(--d); overflow: hidden; border-radius: 50%;
  background: radial-gradient(circle at 50% 46%, var(--orb-in-b), var(--orb-in-a) 82%);
  box-shadow: inset 0 0 0 max(1px, calc(var(--d) / 28)) color-mix(in srgb, var(--c) 82%, transparent), inset 0 0 calc(var(--d) * .3) color-mix(in srgb, var(--c) 34%, transparent);
}
.mo::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(ellipse 44% 28% at 31% 19%, rgb(255 255 255 / 42%), transparent 72%); }
.mo[data-state="thinking"], .mo[data-state="speaking"] { --c: var(--orb-thinking); }
.mo[data-state="lost"] { --c: #8d98a1; opacity: .8; }
.halo { position: relative; display: grid; place-items: center; flex: none; }
.halo::before { content: ""; position: absolute; inset: -22%; border-radius: 50%; filter: blur(12px); background: radial-gradient(circle, color-mix(in srgb, var(--c, var(--orb-listening)) 44%, transparent) 0, color-mix(in srgb, var(--c, var(--orb-listening)) 14%, transparent) 48%, transparent 70%); }
.halo[data-state="lost"]::before { opacity: .35; }
.fil { position: absolute; inset: 0; width: 100%; height: 100%; fill: none; stroke: color-mix(in srgb, var(--c) 34%, transparent); stroke-width: .9; animation: turn 60s linear infinite; }
@keyframes turn { to { transform: rotate(360deg); } }

/* Live waveform */
.wave { --tone: var(--orb-listening); display: flex; align-items: center; justify-content: space-between; height: 30px; }
.wave i { display: block; width: 4px; height: 30px; border-radius: 2px; background: var(--tone); transform: scaleY(var(--h)); animation: wv 1.6s ease-in-out infinite; animation-delay: calc(var(--n) * -.13s); }
.bars { --tone: var(--orb-listening); display: flex; align-items: center; gap: 2.5px; height: 18px; }
.bars i { display: block; width: 3px; height: 18px; border-radius: 2px; background: var(--tone); transform: scaleY(var(--h)); animation: wv 1.4s ease-in-out infinite; animation-delay: calc(var(--n) * -.23s); }
@keyframes wv { 0%, 100% { transform: scaleY(var(--h)); } 50% { transform: scaleY(calc(var(--h) * .45 + .1)); } }
@media (prefers-reduced-motion: reduce) { .wave i, .bars i, .fil { animation: none; } }

/* Live Activity, notification, buttons */
.la { position: absolute; left: 16px; right: 16px; bottom: 150px; display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 28px; background: var(--g-fill-bar); }
.la-top { display: flex; align-items: center; gap: 12px; }
.la-txt { display: flex; flex: 1; flex-direction: column; min-width: 0; line-height: 1.2; }
.la-txt b { font-size: 17px; font-weight: 650; }
.la-txt span { margin-top: 2px; font-size: 13px; color: var(--text-muted); }
.la-time { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.la-btns { display: flex; gap: 10px; }
.la-btn { display: flex; flex: 1; align-items: center; justify-content: center; gap: 8px; height: 46px; border-radius: 23px; font-size: 16px; font-weight: 600; }
.la-btn.end { background: color-mix(in srgb, var(--record-stop) 80%, transparent); color: #fff; }
.app-ico { display: grid; place-items: center; flex: none; width: 46px; height: 46px; border-radius: 12px; background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
.track { height: 8px; overflow: hidden; border-radius: 4px; background: color-mix(in srgb, var(--text) 16%, transparent); }
.track i { display: block; height: 100%; border-radius: 4px; background: var(--orb-thinking); }
.ls-date { position: absolute; top: 96px; left: 0; right: 0; text-align: center; font-size: 20px; font-weight: 600; opacity: .88; }
.ls-time { position: absolute; top: 122px; left: 0; right: 0; text-align: center; font-size: 100px; font-weight: 700; letter-spacing: -3px; line-height: 1.05; }
.ls-ctl { position: absolute; bottom: 56px; display: grid; place-items: center; width: 54px; height: 54px; border-radius: 50%; }
.ls-ctl.l { left: 44px; }
.ls-ctl.r { right: 44px; }
.ls-ctl .ic { width: 24px; height: 24px; }
.stack { position: absolute; left: 16px; right: 16px; bottom: 140px; display: flex; flex-direction: column; gap: 10px; }
.stack .la { position: relative; left: auto; right: auto; bottom: auto; }
.note { display: grid; grid-template-columns: 38px 1fr auto; column-gap: 12px; padding: 14px 16px 0; border-radius: 28px; background: var(--g-fill-bar); }
.note b { align-self: center; font-size: 16px; font-weight: 650; }
.note-when { align-self: center; font-size: 13px; color: var(--text-muted); }
.note-body { grid-column: 2 / 4; margin: 2px 0 12px; font-size: 15px; line-height: 1.3; }
.note-acts { grid-column: 1 / 4; margin: 0 -16px; }
.note-acts span { display: block; padding: 12px 16px; border-top: 1px solid var(--sep); font-size: 16px; font-weight: 500; color: var(--accent); }

/* Dynamic Island states */
.isl-demo { display: flex; flex-direction: column; align-items: center; gap: 34px; padding: 34px 16px; background: linear-gradient(165deg, #1b2733, #090d12); }
.isl-demo::before { display: none; }
.isl-row { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
.isl-lab { font-size: 13px; color: var(--text-muted); text-align: center; }
.isl-c { display: flex; align-items: center; justify-content: space-between; width: 232px; height: 37px; padding: 0 14px; border-radius: 19px; background: #000; }
.isl-pair { display: flex; align-items: center; gap: 8px; }
.isl-p { display: flex; align-items: center; justify-content: flex-end; width: 126px; height: 37px; padding: 0 14px; border-radius: 19px; background: #000; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--orb-thinking); }
.isl-m { display: grid; place-items: center; width: 37px; height: 37px; border-radius: 50%; background: #000; }
.isl-x { display: flex; flex-direction: column; gap: 12px; width: 361px; padding: 18px; border-radius: 46px; background: #000; }
.isl-x .la-btn { background: rgb(255 255 255 / 14%); height: 44px; }
.isl-x .la-btn.end { background: var(--record-stop); }

/* Widgets and controls sheet */
.sheet { display: flex; flex-direction: column; gap: 18px; padding: 22px 20px; }
.sheet-sec { display: flex; flex-direction: column; gap: 8px; }
.sec-label { font-size: 13px; color: var(--text-muted); }
.wrow { display: flex; gap: 16px; }
.wg { position: relative; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; padding: 16px; border-radius: 30px; background: var(--g-fill-bar); }
.wg.sm { width: 158px; height: 158px; }
.wg.md { width: 332px; height: 158px; }
.wg strong { font-size: 15px; font-weight: 650; line-height: 1.2; }
.wg small { display: block; margin-top: 2px; font-size: 13px; color: var(--text-muted); line-height: 1.25; }
.wg .big { font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: -2px; }
.wrow.lsw { align-items: center; gap: 14px; }
.cw { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; background: var(--g-fill-bar); }
.cw svg.ring { position: absolute; width: 64px; height: 64px; transform: rotate(-90deg); fill: none; stroke-width: 5; }
.cw { position: relative; }
.rw { display: flex; flex-direction: column; justify-content: center; width: 158px; height: 64px; padding: 0 14px; border-radius: 18px; background: var(--g-fill-bar); }
.rw strong { font-size: 14px; font-weight: 650; }
.rw small { font-size: 12px; color: var(--text-muted); }
.inline-w { font-size: 14px; font-weight: 600; white-space: nowrap; }
.ctl { display: flex; flex-direction: column; justify-content: space-between; width: 158px; height: 74px; padding: 12px 14px; border-radius: 22px; background: var(--g-fill-bar); }
.ctl span { font-size: 14px; font-weight: 600; }
.ctl .ic { color: var(--accent); }

/* StandBy */
.sb { display: grid; grid-template-columns: 1fr 1.25fr; align-items: center; height: 100%; padding: 0 56px; }
.sb-orb { display: grid; place-items: center; }
.sb-txt { display: flex; flex-direction: column; gap: 6px; }
.sb-name { font-size: 22px; font-weight: 600; color: var(--text-muted); }
.sb-state { font-size: 60px; font-weight: 700; letter-spacing: -1.5px; line-height: 1.05; }
.sb-timer { font-size: 36px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--text-muted); }

/* Sign-in and connection lost */
.centre { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 80px 36px 90px; text-align: center; }
.centre h3 { margin: 18px 0 0; font-size: 34px; font-weight: 700; letter-spacing: -.8px; }
.centre p { max-width: 300px; margin: 0; font-size: 17px; color: var(--text-muted); }
.si-btn { display: grid; place-items: center; width: 100%; max-width: 320px; height: 54px; margin-top: 18px; border-radius: 27px; font-size: 17px; font-weight: 650; background: color-mix(in srgb, var(--accent) 78%, transparent); color: var(--accent-text); }
.centre p.fine { margin-top: 4px; font-size: 14px; }
.si-ico { display: grid; place-items: center; width: 92px; height: 92px; border-radius: 50%; background: var(--g-fill-bar); color: var(--accent); }
.si-ico .ic { width: 44px; height: 44px; stroke-width: 1.5; }
.si-alt { margin-top: 10px; padding: 8px 16px; font-size: 17px; font-weight: 600; color: var(--accent); }
.centre.up { padding-bottom: 240px; }
.nav-title { position: absolute; top: 59px; left: 0; right: 0; height: 44px; display: grid; place-items: center; font-size: 17px; font-weight: 600; }
.rc-pill { position: absolute; top: 116px; left: 50%; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; transform: translateX(-50%); border-radius: 20px; font-size: 15px; font-weight: 600; white-space: nowrap; background: var(--g-fill-bar); }
.rc-btns { display: flex; gap: 10px; width: 100%; max-width: 320px; margin-top: 18px; }
</style>
</head>

<header class="head">
  <h1>Jarvis for iPhone: system surfaces</h1>
  <p>Concept illustrations of what Jarvis shows outside the app. Sample content only; every surface is a proposal for review.</p>
  <div class="seg" role="radiogroup" aria-label="Theme">
    <label><input type="radio" name="theme" value="dark" checked><span>Dark</span></label>
    <label><input type="radio" name="theme" value="light"><span>Light</span></label>
  </div>
</header>

<main class="gallery">

  <figure class="fig">
    <div class="frame" role="img" aria-label="Concept: iPhone Lock Screen with a Jarvis Live Activity during a hands-free session. It shows the on-the-move state, a live waveform, a 12 minute timer, and Mute and End buttons.">
      <div class="screen" aria-hidden="true">
        <i class="island"></i>
        <div class="sbar"><span></span><span class="batt"></span></div>
        <div class="ls-date">Thursday 29 October</div>
        <div class="ls-time">17:42</div>
        <div class="la glass">
          <div class="la-top">
            <span class="halo" style="--c: var(--orb-listening)"><span class="mo" data-state="listening" style="--d:46px"></span></span>
            <div class="la-txt"><b>Jarvis</b><span>On the move · listening</span></div>
            <span class="la-time">12:04</span>
          </div>
          <div class="wave" data-n="26"></div>
          <div class="la-btns">

<script>
const H = [.35, .5, .7, .55, .9, .6, .4, .8, 1, .7, .45, .6, .85, .5, .35, .65, .9, .55, .4, .3, .5, .75, .6, .4, .55, .35];
document.querySelectorAll('[data-n]').forEach((el) => {
  for (let i = 0; i < Number(el.dataset.n); i += 1) {
    const bar = document.createElement('i');
    bar.style.setProperty('--h', H[i % H.length]);
    bar.style.setProperty('--n', i);
    el.append(bar);
  }
});
document.querySelectorAll('input[name="theme"]').forEach((input) => {
  input.addEventListener('change', () => { document.documentElement.dataset.theme = input.value; });
});
</script>
