<!doctype html>
<html lang="da" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Jarvis for iPhone · Workspaces</title>
<style>
/* Tokens are copied from index.html (which copies apps/web/src/styles.css). Merge: lift the .w* rules and the #view-workspaces markup into index.html as a screen next to Notes. */
:root {
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
  color-scheme: light;
  --ink-solid: #000; --highlight-solid: #fff;
  --page: #f6f0e6; --text: #17202a; --text-muted: #5c564f; --rule: #d8cfc2;
  --focus: #14768d; --accent: #14768d; --accent-text: #fff;
  --danger: #b3261e; --warn: #8a5a00; --success: #14697e;
  --orb-thinking: #e8a23a;
  --ambient:
    radial-gradient(60% 36% at 12% 10%, rgb(20 118 141 / 24%), transparent 70%),
    radial-gradient(54% 34% at 94% 20%, rgb(232 162 58 / 30%), transparent 70%),
    radial-gradient(70% 38% at 24% 98%, rgb(45 179 93 / 18%), transparent 70%),
    radial-gradient(54% 30% at 92% 80%, rgb(47 128 237 / 16%), transparent 70%);
  --fill-group: rgb(255 255 255 / 70%); --sep: rgb(60 50 30 / 16%);
  --g-fill: rgb(255 255 255 / 30%); --g-fill-bar: rgb(255 255 255 / 44%); --g-sat: 1.7;
  --g-shadow: 0 10px 30px rgb(60 45 20 / 16%), 0 1px 3px rgb(60 45 20 / 12%);
  --g-solid: #efe8dc;
  --rim-hi: rgb(255 255 255 / 100%); --rim-mid: rgb(255 255 255 / 60%); --rim-lo: rgb(70 55 30 / 14%); --sheen: rgb(255 255 255 / 50%);
  --board-bg: #e4ddd0; --board-bar: #f1ebe0; --board-text: #17202a; --board-muted: #4f4a44; --board-rule: #c9bfae;
  --k-research: var(--accent); --k-app: var(--orb-thinking); --k-image: rgb(45 179 93); --k-graph: rgb(47 128 237);
  --n-row: color-mix(in srgb, var(--highlight-solid) 70%, var(--page));
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #07090f; --text: #f3fff9; --text-muted: #c0ccd2; --rule: rgb(226 246 255 / 16%);
  --focus: #8be9ff; --accent: #52dcfa; --accent-text: #04161d;
  --danger: #ff9b94; --warn: #ffc46b; --success: #a8eefc; --orb-thinking: #ffb45c;
  --ambient:
    radial-gradient(60% 36% at 12% 10%, rgb(82 220 250 / 30%), transparent 70%),
    radial-gradient(54% 34% at 94% 20%, rgb(255 180 92 / 26%), transparent 70%),
    radial-gradient(70% 38% at 24% 98%, rgb(61 220 132 / 16%), transparent 70%),
    radial-gradient(54% 30% at 92% 80%, rgb(59 139 255 / 20%), transparent 70%);
  --fill-group: rgb(255 255 255 / 8%); --sep: rgb(226 246 255 / 14%);
  --g-fill: rgb(255 255 255 / 7%); --g-fill-bar: rgb(16 22 30 / 36%);
  --g-shadow: 0 12px 34px rgb(0 0 0 / 42%), 0 1px 3px rgb(0 0 0 / 30%);
  --g-solid: #161c24;
  --rim-hi: rgb(255 255 255 / 85%); --rim-mid: rgb(255 255 255 / 34%); --rim-lo: rgb(255 255 255 / 5%); --sheen: rgb(255 255 255 / 13%);
  --board-bg: #03060a; --board-bar: #0b1118; --board-text: #f3fff9; --board-muted: #b7c4ca; --board-rule: rgb(226 246 255 / 14%);
  --k-image: rgb(61 220 132); --k-graph: rgb(110 168 255);
  --n-row: color-mix(in srgb, var(--highlight-solid) 8%, var(--page));
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; background: var(--board-bg); color: var(--board-text); font: 15px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ic { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

/* Board bar (outside the phone) */
.board-bar { display: flex; align-items: center; gap: 14px; min-height: 44px; padding: 0 12px; background: var(--board-bar); border-bottom: 1px solid var(--board-rule); }
.board-bar strong { font-size: 15px; }
.board-bar .grp { display: inline-flex; align-items: center; gap: 2px; }
.board-bar .grp button { min-height: 32px; padding: 0 10px; border: 0; background: none; color: var(--board-muted); font-weight: 600; cursor: pointer; border-radius: 8px; }
.board-bar .grp button[aria-pressed="true"] { color: var(--board-text); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 6px; }
.board-bar select { min-height: 32px; border: 1px solid var(--board-rule); border-radius: 8px; background: var(--board-bg); color: var(--board-text); padding: 0 8px; }
.board-bar .sp { flex: 1; }

/* Device and phone */
.stage { flex: 1; min-height: 0; display: flex; overflow: auto; padding: 8px; }
.stage[data-zoom="fit"] { overflow: hidden; }
[data-bare] .board-bar { display: none; }
[data-bare] .stage { padding: 0; }
[data-bare="screen"] .device { padding: 0; width: var(--w); height: var(--h); border-radius: 0; background: none; box-shadow: none; }
[data-bare="screen"] .side { display: none; }
[data-bare="screen"] .phone { border-radius: 0; }
.device-wrap { margin: auto; flex: none; position: relative; }
.device { position: absolute; left: 0; top: 0; transform-origin: 0 0; width: calc(var(--w) + 24px); height: calc(var(--h) + 24px); padding: 12px; border-radius: 68px; background: linear-gradient(150deg, #3b4048, #171a1f 45%, #0b0d11); box-shadow: inset 0 0 0 1.5px #5b616b, 0 28px 70px rgb(0 0 0 / 34%); --w: 440px; --h: 956px; --safe-top: 62px; --island-top: 14px; }
.side { position: absolute; width: 4px; border-radius: 2px; background: #2a2e35; }
.side.s1 { left: -3px; top: 118px; height: 30px; } .side.s2 { left: -3px; top: 176px; height: 58px; } .side.s3 { left: -3px; top: 246px; height: 58px; } .side.s4 { right: -3px; top: 214px; height: 92px; }
.phone { --nav-h: 44px; --dock-bottom: 22px; --ease: cubic-bezier(.32, .72, 0, 1); position: relative; isolation: isolate; overflow: hidden; width: var(--w); height: var(--h); border-radius: 56px; background: var(--page); color: var(--text); font-family: var(--font-body); font-size: 17px; line-height: 1.3; }
.phone::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--ambient); pointer-events: none; }
.island { position: absolute; z-index: 50; top: var(--island-top); left: 0; right: 0; margin: 0 auto; width: 126px; height: 37px; border-radius: 19px; background: var(--ink-solid); pointer-events: none; }
.home { position: absolute; z-index: 51; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--text); opacity: .55; pointer-events: none; }
.statusbar { position: absolute; z-index: 45; top: 0; left: 0; right: 0; height: var(--safe-top); display: flex; align-items: center; justify-content: space-between; padding: 0 30px 0 50px; font-size: 17px; font-weight: 600; pointer-events: none; }
.statusbar .sys { display: flex; align-items: center; gap: 6px; }

/* Liquid glass, frosted base */
.glass { position: relative; background: var(--g-fill); box-shadow: var(--g-shadow); -webkit-backdrop-filter: blur(var(--frost-blur, 14px)) saturate(var(--g-sat)); backdrop-filter: blur(var(--frost-blur, 14px)) saturate(var(--g-sat)); }
.glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(120% 160% at 8% -20%, var(--sheen), transparent 55%); }
.glass::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none; background: conic-gradient(from 215deg, var(--rim-hi), var(--rim-lo) 26%, transparent 48%, var(--rim-mid) 72%, var(--rim-hi)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
@media (prefers-reduced-transparency: reduce) { .glass { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--g-solid); } }

/* Workspaces screen */
.edge-t { position: absolute; z-index: 3; top: 0; left: 0; right: 0; height: calc(var(--safe-top) + var(--nav-h) + 30px); opacity: var(--edge, 0); pointer-events: none; background: linear-gradient(to bottom, var(--g-fill-bar) 62%, transparent); -webkit-backdrop-filter: blur(18px) saturate(var(--g-sat)); backdrop-filter: blur(18px) saturate(var(--g-sat)); -webkit-mask-image: linear-gradient(#000 66%, transparent); mask-image: linear-gradient(#000 66%, transparent); transition: opacity .2s ease; }
.whead { position: absolute; z-index: 6; top: var(--safe-top); left: 0; right: 0; height: var(--nav-h); display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 20px; pointer-events: none; }
.whead h1 { margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; }
.wref { pointer-events: auto; display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; color: var(--text); cursor: pointer; --frost-blur: 14px; transition: transform .3s var(--ease); }
.wref:active:not(:disabled) { transform: scale(.93); }
.wref .ic { width: 22px; height: 22px; stroke-width: 1.8; }
.wref[data-spin] .ic { animation: wspin .9s linear infinite; }
@keyframes wspin { to { transform: rotate(360deg); } }
.wscroll { position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; padding: calc(var(--safe-top) + var(--nav-h) + 6px) 0 190px; }
.wscroll::-webkit-scrollbar { display: none; }
.wchips { display: flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 12px; overflow-x: auto; scrollbar-width: none; }
.wchips::-webkit-scrollbar { display: none; }
.wchip { flex: none; min-height: 40px; padding: 0 12px; border: 0; background: none; color: var(--text-muted); font: 500 16px/1 var(--font-body); cursor: pointer; transition: color .2s ease; -webkit-tap-highlight-color: transparent; }
.wchip[aria-pressed="true"] { color: var(--accent); font-weight: 700; }
.wchip:focus-visible { outline: none; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; text-decoration-color: var(--focus); }
.wbanner { display: flex; align-items: center; gap: 10px; margin: 8px 16px; padding: 10px 14px; border-radius: 20px; background: color-mix(in srgb, var(--warn) 16%, transparent); font-size: 15px; }
.wbanner .ic { width: 20px; height: 20px; color: var(--warn); }
.wsec { display: flex; align-items: center; min-height: 44px; margin: 14px 20px 2px; font-size: 20px; line-height: 25px; font-weight: 700; }
.wsec .ic { width: 16px; height: 16px; margin-right: 8px; color: var(--accent); stroke-width: 2.2; }
.wlist { margin: 0; padding: 0; list-style: none; }
.wsw { position: relative; overflow: hidden; touch-action: pan-y; }
.wsw-act { position: absolute; top: 0; bottom: 0; display: flex; opacity: 0; transition: opacity 0s .35s; }
.wsw:is([data-drag], [data-o="l"], [data-o="r"]) .wsw-act { opacity: 1; transition-delay: 0s; }
.wsw-act.l { left: 0; width: 92px; }
.wsw-act.r { right: 0; width: 184px; }
.wsw-act button { flex: 1; display: grid; place-content: center; justify-items: center; gap: 4px; border: 0; color: #fff; font: 600 13px/1 var(--font-body); cursor: pointer; }
.wsw-act .ic { width: 22px; height: 22px; }
.wsw-act .a-pin { background: color-mix(in srgb, var(--accent) 88%, #000); color: var(--accent-text); }
.wsw-act .a-ren { background: color-mix(in srgb, var(--text-muted) 70%, #000); }
.wsw-act .a-del { background: color-mix(in srgb, var(--danger) 88%, #000); }
.wsw-row { position: relative; display: flex; align-items: center; min-height: 72px; padding: 0 4px 0 20px; transform: translate3d(var(--dx, 0px), 0, 0); transition: transform .35s var(--ease); }
.wsw[data-drag] .wsw-row { transition: none; }
.wsw:is([data-drag], [data-o="l"], [data-o="r"]) .wsw-row { background: var(--n-row); }
.wsw + .wsw .wsw-row::before { content: ""; position: absolute; top: 0; left: 72px; right: 0; height: .5px; background: var(--sep); }
.wopen { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; padding: 10px 0; border: 0; background: none; text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.wopen:focus-visible { outline: none; }
.wopen:focus-visible .wt, .wopen:active .wt { color: var(--accent); }
.wopen:focus-visible .wt { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.wk { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 13px; color: var(--kc); background: color-mix(in srgb, var(--kc) 16%, transparent); }
.wk[data-k="research"] { --kc: var(--k-research); } .wk[data-k="html_app"] { --kc: var(--k-app); } .wk[data-k="image"] { --kc: var(--k-image); } .wk[data-k="knowledge_graph"] { --kc: var(--k-graph); }
.wk .ic { width: 24px; height: 24px; stroke-width: 1.6; }
.wx { flex: 1; min-width: 0; display: grid; gap: 2px; }
.wt { font-weight: 600; font-size: 17px; line-height: 22px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: color .15s ease; }
.wmeta { display: flex; gap: 8px; min-width: 0; color: var(--text-muted); font-size: 15px; line-height: 20px; }
.wmeta time { flex: none; font-variant-numeric: tabular-nums; }
.wmeta span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wmeta mark, .wt mark { background: color-mix(in srgb, var(--accent) 32%, transparent); color: inherit; border-radius: 3px; }
.wst { flex: none; display: grid; place-items: center; width: 24px; color: var(--accent); }
.wst .ic { width: 18px; height: 18px; stroke-width: 2.2; }
.wst .ic.spin { animation: wspin .8s linear infinite; }
.wmore { flex: none; display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--text-muted); cursor: pointer; }
.wmore:active { color: var(--accent); }
.wmore .ic { width: 22px; height: 22px; stroke-width: 2.2; }
.wsw[data-off] .wopen { opacity: .55; }
.wnote { display: flex; align-items: center; gap: 8px; margin: -4px 20px 8px 78px; color: var(--danger); font-size: 15px; }
.wtxt { min-height: 44px; padding: 0 10px; border: 0; background: none; color: var(--accent); font: 400 17px/1.2 var(--font-body); cursor: pointer; }
.wtxt:active { opacity: .5; }
.wtxt.b { font-weight: 600; }
.wtxt.d { color: var(--danger); }
.wskel { display: grid; margin: 8px 0; }
.wskel div { display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 0 20px; }
.wskel i { display: block; border-radius: 13px; background: linear-gradient(100deg, var(--fill-group) 30%, color-mix(in srgb, var(--text) 12%, transparent) 50%, var(--fill-group) 70%) 0 0 / 220% 100%; animation: wshim 1.4s linear infinite; }
.wskel i:first-child { width: 44px; height: 44px; flex: none; }
.wskel span { flex: 1; display: grid; gap: 8px; }
.wskel span i { height: 14px; border-radius: 7px; width: 70%; }
.wskel span i + i { width: 46%; height: 12px; }
@keyframes wshim { to { background-position: -220% 0; } }
.wstate { display: grid; justify-items: center; gap: 12px; padding: 72px 32px; text-align: center; }
.wstate .ic { width: 44px; height: 44px; color: var(--text-muted); stroke-width: 1.4; }
.wstate p { margin: 0; font-size: 17px; font-weight: 600; }
.wbtn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px; color: var(--text); font: 600 16px/1.2 var(--font-body); cursor: pointer; --frost-blur: 12px; transition: transform .2s var(--ease); }
.wbtn:active { transform: scale(.96); }

/* Bottom search, same material and height as Notes */
.wbar { position: absolute; z-index: 6; left: 16px; right: 16px; bottom: var(--dock-bottom); }
.wsearch { display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 0 0 16px; border-radius: 999px; color: var(--text-muted); --frost-blur: 16px; }
.wsearch .ic { width: 22px; height: 22px; }
.wsearch input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; color: var(--text); font: 400 17px/1.2 var(--font-body); outline: none; }
.wsearch input::placeholder { color: var(--text-muted); }
.wsearch input::-webkit-search-cancel-button { display: none; }
.wsearch .wclr { display: grid; place-items: center; width: 44px; height: 44px; border: 0; background: none; color: var(--text-muted); cursor: pointer; }
.wsearch .wclr .ic { width: 18px; height: 18px; stroke-width: 2.2; }
.wsearch:focus-within { color: var(--accent); }
.wtoast { position: absolute; z-index: 8; left: 50%; bottom: calc(var(--dock-bottom) + 66px); transform: translateX(-50%); max-width: calc(100% - 40px); padding: 11px 18px; border-radius: 999px; font-size: 15px; font-weight: 600; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; animation: wpop .3s var(--ease); }
.wtoast[data-tone="error"] { color: var(--danger); }
@keyframes wpop { from { opacity: 0; transform: translate(-50%, 10px); } }

/* Row menu, rename alert, remove sheet */
.wscrim { position: absolute; z-index: 9; inset: 0; background: rgb(0 0 0 / 28%); }
.wmenu { position: absolute; z-index: 10; width: 232px; padding: 6px; border-radius: 22px; --frost-blur: 22px; transform-origin: 100% 0; animation: wmen .25s var(--ease); }
.wmenu[data-up] { transform-origin: 100% 100%; }
@keyframes wmen { from { opacity: 0; transform: scale(.92); } }
.wmenu button { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 0 14px; border: 0; border-radius: 16px; background: none; color: var(--text); font: 400 17px/1.2 var(--font-body); text-align: left; cursor: pointer; }
.wmenu button:disabled { opacity: .4; cursor: default; }
.wmenu button:focus-visible { outline: none; color: var(--accent); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.wmenu button + button::before { content: ""; position: absolute; top: 0; left: 14px; right: 14px; height: .5px; background: var(--sep); }
.wmenu .ic { width: 22px; height: 22px; stroke-width: 1.7; }
.wmenu .del { color: var(--danger); }
.wdlg { position: absolute; z-index: 11; left: 28px; right: 28px; top: 34%; padding: 22px 18px 10px; border-radius: 30px; --frost-blur: 24px; text-align: center; animation: wmen .28s var(--ease); }
.wdlg h2 { position: relative; z-index: 1; margin: 0 0 14px; font-size: 17px; line-height: 22px; font-weight: 600; }
.wdlg input { position: relative; z-index: 1; width: 100%; height: 44px; padding: 0 14px; border: 0; border-radius: 14px; background: color-mix(in srgb, var(--text) 9%, transparent); color: var(--text); font: 400 17px/1.2 var(--font-body); outline: none; }
.wdlg input:focus-visible { outline: 2px solid var(--focus); }
.wdlg .row { position: relative; z-index: 1; display: flex; justify-content: center; gap: 4px; margin-top: 10px; }
.wdlg .row .wtxt { flex: 1; }
.wsheet { position: absolute; z-index: 11; left: 12px; right: 12px; bottom: 28px; padding: 14px 8px 8px; border-radius: 34px; --frost-blur: 24px; text-align: center; animation: wsl .4s var(--ease); }
.wsheet h2 { position: relative; z-index: 1; margin: 0 0 6px; padding: 0 12px; font-size: 15px; line-height: 20px; font-weight: 600; color: var(--text-muted); }
.wsheet button { position: relative; z-index: 1; display: block; width: 100%; min-height: 54px; border: 0; border-radius: 22px; background: none; font: 400 20px/1.2 var(--font-body); color: var(--accent); cursor: pointer; }
.wsheet button.d { color: var(--danger); }
.wsheet button.b { font-weight: 600; }
.wsheet button:focus-visible { outline: none; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }
@keyframes wsl { from { transform: translateY(40px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .wref[data-spin] .ic, .wst .ic.spin { animation: none !important; }
}
</style>

    { id: 'knowledge_graph:10', kind: 'knowledge_graph', da: ['Læsekort', 'Bøger og temaer på tværs'], en: ['Reading map', 'Books and themes across'], at: 20000, pinned: false },

  const stage = $('#stage'), wrap = $('#device-wrap'), device = $('#device'), phone = $('#phone');
  const scroll = $('#wscroll'), body = $('#wbody'), chips = $('#wchips'), banner = $('#wbanner'), live = $('#wlive');
  const q = $('#wq'), clr = $('#wclr'), ref = $('#wref'), toastEl = $('#wtoast'), scrim = $('#wscrim'), menuEl = $('#wmenu');

    if (st === 'offline') S.offline = true;
    if (st === 'noresults') { S.q = S.lang === 'en' ? 'zzz' : 'zzz'; q.value = S.q; }
    if (st === 'search') { S.q = S.lang === 'en' ? 'report' : 'rapport'; q.value = S.q; if (S.lang === 'en') S.q = 'plan'; if (S.lang === 'da') S.q = 'plan'; q.value = S.q; }
    if (st === 'opened') S.opened = 'html_app:6';
    if (st === 'rowerror') S.note = { id: 'image:4', text: t('openFail') };
    if (st === 'menu') S.menu = 'image:4';
    if (st === 'rename') { S.dlg = 'rename'; S.dlgId = 'research:3'; }
    if (st === 'confirm') { S.dlg = 'confirm'; S.dlgId = 'research:3'; }
    scroll.scrollTop = 0;
    render();
    if (st === 'menu') renderMenu();
    const url = new URL(location.href); url.searchParams.set('state', st); history.replaceState(null, '', url);
    $('#st').value = st;
  }

  /* Events */
  body.addEventListener('click', e => {
    if (suppress) { e.preventDefault(); e.stopPropagation(); return; }
    const li = e.target.closest('.wsw');
    if (e.target.closest('[data-retry]') && li) { const id = li.dataset.id; S.note = null; openItem(id); return; }
    if (e.target.closest('[data-retry]')) { reload(() => { if (S.st === 'error') S.st = 'default'; }); return; }
    if (e.target.closest('[data-clear]')) { S.q = ''; S.kind = ''; q.value = ''; render(); q.focus(); return; }
    const act = e.target.closest('[data-act]');
    if (act && li) { const id = li.dataset.id, a = act.dataset.act; lastFocus = $('.wmore', li); if (a === 'pin') { pinItem(id); } else if (a === 'rename') openDlg('rename', id); else openDlg('confirm', id); return; }
    const more = e.target.closest('[data-more]');
    if (more && li) { lastFocus = more; S.menu = S.menu === li.dataset.id ? '' : li.dataset.id; renderMenu(); if (S.menu) { const f = $('button:not(:disabled)', menuEl); if (f) f.focus(); } return; }
    const op = e.target.closest('[data-open]');
    if (op && li) { if (li.dataset.o) { li.dataset.o = ''; li.style.removeProperty('--dx'); return; } openItem(li.dataset.id); }
  });
  chips.addEventListener('click', e => { const b = e.target.closest('.wchip'); if (!b) return; S.kind = b.dataset.kind; render(); const nb = $('.wchip[data-kind="' + S.kind + '"]'); if (nb) nb.focus(); });
  q.addEventListener('input', () => { S.q = q.value; render(); });
  clr.addEventListener('click', () => { S.q = ''; q.value = ''; render(); q.focus(); });
  ref.addEventListener('click', () => { reload(() => { if (S.st === 'error' || S.st === 'loading') S.st = 'default'; }); });
  menuEl.addEventListener('click', e => {
    const b = e.target.closest('[data-m]'); if (!b || b.disabled) return;
    const id = S.menu;
    if (b.dataset.m === 'pin') { S.menu = ''; pinItem(id); renderMenu(); renderDialogs(); if (lastFocus) lastFocus.focus(); } else openDlg(b.dataset.m === 'rename' ? 'rename' : 'confirm', id);
  });
  scrim.addEventListener('click', () => closeAll());
  $('#wrename-c').addEventListener('click', () => closeAll());
  $('#wrename-s').addEventListener('click', saveRename);
  renI.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveRename(); } });
  $('#wconfirm-y').addEventListener('click', () => removeItem(S.dlgId));
  $('#wconfirm-n').addEventListener('click', () => closeAll());
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && (S.menu || S.dlg)) { e.preventDefault(); closeAll(); } });
  scroll.addEventListener('scroll', () => { phone.style.setProperty('--edge', Math.min(1, scroll.scrollTop / 24)); closeSwipe(); }, { passive: true });

  /* Swipe: left reveals Rename and Remove, right reveals Pin */
  let drag = null, suppress = false;
  const AL = 92, AR = 184;
  function closeSwipe(except) { $$('.wsw[data-o]').forEach(li => { if (li !== except && li.dataset.o) { li.dataset.o = ''; li.style.removeProperty('--dx'); li.querySelectorAll('.wsw-act').forEach(a => { a.inert = true; }); } }); }
  body.addEventListener('pointerdown', e => {
    if (S.dlg || S.offline || e.button > 0) return;
    const r = e.target.closest('.wsw-row'); if (!r || e.target.closest('.wmore')) return;
    const li = r.parentElement; closeSwipe(li);
    drag = { r, li, x: e.clientX, y: e.clientY, k: scaleK(), on: false, base: li.dataset.o === 'l' ? AL : li.dataset.o === 'r' ? -AR : 0, v: 0 };
  });
  window.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = (e.clientX - drag.x) / drag.k, dy = (e.clientY - drag.y) / drag.k;
    if (!drag.on) { if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { drag.on = true; drag.li.dataset.drag = ''; drag.li.querySelectorAll('.wsw-act').forEach(a => { a.inert = false; }); } else return; }
    drag.v = Math.max(-AR, Math.min(AL, drag.base + dx)); drag.li.style.setProperty('--dx', drag.v + 'px');
  });
  window.addEventListener('pointerup', () => {
    if (!drag) return; const d = drag; drag = null; if (!d.on) return;
    delete d.li.dataset.drag;
    const o = d.v < -AR / 2 ? 'r' : d.v > AL / 2 ? 'l' : '';
    d.li.dataset.o = o; d.li.style.setProperty('--dx', o === 'r' ? -AR + 'px' : o === 'l' ? AL + 'px' : '0px');
    if (!o) d.li.querySelectorAll('.wsw-act').forEach(a => { a.inert = true; });
    suppress = true; setTimeout(() => { suppress = false; }, 60);
  });

  /* Board bar */
  const sel = $('#st');
  STATES.forEach(s => sel.add(new Option(s, s)));
  sel.addEventListener('change', () => applyState(sel.value));
  function syncBar() {
    $$('[data-theme].grp button, .grp button[data-theme]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === S.theme)));
    $$('.grp button[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === S.lang)));
    $$('.grp button[data-zoom]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.zoom === S.zoom)));
  }
  $$('.grp button[data-theme]').forEach(b => b.addEventListener('click', () => { S.theme = b.dataset.theme; syncBar(); render(); }));
  $$('.grp button[data-lang]').forEach(b => b.addEventListener('click', () => { S.lang = b.dataset.lang; syncBar(); renI.dataset.for = ''; render(); }));
  $$('.grp button[data-zoom]').forEach(b => b.addEventListener('click', () => { S.zoom = b.dataset.zoom; syncBar(); fit(); }));
  function fit() {
    const pad = S.bare === 'screen' ? 0 : 24, fw = 440 + pad, fh = 956 + pad;
    stage.dataset.zoom = S.zoom;
    const box = stage.getBoundingClientRect(), cs = getComputedStyle(stage), slack = S.bare ? 0 : 1;
    const aw = box.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - slack, ah = box.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - slack;
    const k = Math.max(0.25, S.zoom === 'fit' ? Math.min(1, aw / fw, ah / fh) : 1);
    wrap.style.width = fw * k + 'px'; wrap.style.height = fh * k + 'px'; device.style.transform = 'scale(' + k + ')';
    if (S.menu) renderMenu();
  }
  new ResizeObserver(fit).observe(stage);
  if (S.bare) document.documentElement.dataset.bare = S.bare;
  syncBar(); fit();
  applyState(S.st, true);
})();
</script>
</body>
