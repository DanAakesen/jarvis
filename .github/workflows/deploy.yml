# Production deploy for main. Exact-tree CI precedes Azure access. Immutable
# receipts retain compatible applied components even when acceptance failed.
# Readiness and live conversation acceptance remain separate required results.
# The concurrency
# group is shared with Runner deploy: one deploy at a time, queued in order,
# never cancelled. Azure access uses the bootstrap OIDC identity (main only).
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - 'docs/features.md'
  workflow_dispatch:
    inputs:
      provision_managed_chat:
        description: Provision and verify the separate managed chat comparison
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: jarvis-production-deploy
  cancel-in-progress: false
  queue: max

env:
  SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  RESOURCE_GROUP: rg-jarvis
  INFRA_DEPLOYMENT: jarvis-infra
  ENTRA_JARVIS_AGENT_OBJECT_ID: ${{ vars.ENTRA_JARVIS_AGENT_OBJECT_ID }}
  GITHUB_APP_ID: ${{ vars.JARVIS_GITHUB_APP_ID }}
  JARVIS_PC_BRIDGE_CLIENT_ID: ${{ vars.JARVIS_PC_BRIDGE_CLIENT_ID }}
  JARVIS_GOOGLE_TIME_ZONE: ${{ vars.JARVIS_GOOGLE_TIME_ZONE }}
  JARVIS_VAULT_MIRROR_ENABLED: ${{ vars.JARVIS_VAULT_MIRROR_ENABLED }}
  JARVIS_VAULT_MIRROR_WRITE_BACK: ${{ vars.JARVIS_VAULT_MIRROR_WRITE_BACK }}
  JARVIS_VAULT_MIRROR_MAX_CHANGED: ${{ vars.JARVIS_VAULT_MIRROR_MAX_CHANGED }}
  JARVIS_VAULT_MIRROR_MAX_DELETES: ${{ vars.JARVIS_VAULT_MIRROR_MAX_DELETES }}

jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    outputs:
      infra: ${{ steps.plan.outputs.infra }}
      backend: ${{ steps.plan.outputs.backend }}
      web: ${{ steps.plan.outputs.web }}
      agent: ${{ steps.plan.outputs.agent }}
      superseded: ${{ steps.plan.outputs.superseded }}
      attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Require exact qualification and select compatible applied inputs
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CONFIGURATION: ${{ toJSON(vars) }}
        run: python .github/scripts/release_state.py plan
      - name: Authenticate only after exact qualification for sensitive input readback
        if: steps.inputs.outputs.infra == 'false' && steps.inputs.outputs.superseded != 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify sensitive inputs in memory before reusing infrastructure
        id: plan
        env:
          JARVIS_BUDGET_CONTACT_EMAILS: ${{ secrets.JARVIS_BUDGET_CONTACT_EMAILS }}
        run: python .github/scripts/release_state.py select
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plan-${{ github.run_attempt }}
          path: release-plan.json
          if-no-files-found: error
          retention-days: 30

  infra:
    name: Infrastructure (Bicep)
    needs: plan
    if: needs.plan.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      attempt: ${{ github.run_attempt }}
    env:
      JARVIS_BUDGET_CONTACT_EMAILS: ${{ secrets.JARVIS_BUDGET_CONTACT_EMAILS }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Read-only backend log activation preflight
        run: python .github/scripts/backend_log_preflight.py
      - name: Deploy Bicep, keeping the running backend image
        run: bash .github/scripts/deploy_bicep.sh "$RUNNER_TEMP/infra-outputs.json"

  backend:
    name: Backend (ACR and Container Apps)
    needs: [plan, infra]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.backend == 'true' && needs.infra.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      attempt: ${{ github.run_attempt }}
      image: ${{ steps.apply.outputs.image }}
      revision: ${{ steps.apply.outputs.revision }}
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      JARVIS_BUDGET_CONTACT_EMAILS: ${{ secrets.JARVIS_BUDGET_CONTACT_EMAILS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Load infrastructure outputs
        run: |
          az deployment group show --name "$INFRA_DEPLOYMENT" --resource-group "$RESOURCE_GROUP" --subscription "$SUBSCRIPTION_ID" --query properties.outputs --output json --only-show-errors >"$RUNNER_TEMP/infra-outputs.json"
          {
            echo "REGISTRY=$(jq -er .containerRegistryName.value "$RUNNER_TEMP/infra-outputs.json")"
            echo "REGISTRY_HOST=$(jq -er .containerRegistryLoginServer.value "$RUNNER_TEMP/infra-outputs.json")"
            echo "BACKEND_APP=$(jq -r '.backendAppName.value // ""' "$RUNNER_TEMP/infra-outputs.json")"
          } >>"$GITHUB_ENV"
      - name: Build the backend image in ACR
        run: |
          az acr build --registry "$REGISTRY" --image "jarvis-backend:$IMAGE_TAG" --file apps/backend/Dockerfile --platform linux/amd64 --subscription "$SUBSCRIPTION_ID" --build-arg "JARVIS_DEPLOYED_COMMIT=$GITHUB_SHA" --only-show-errors .
          digest=$(az acr manifest show-metadata --registry "$REGISTRY" --name "jarvis-backend:$IMAGE_TAG" --subscription "$SUBSCRIPTION_ID" --query digest --output tsv --only-show-errors)
          [[ "$digest" == sha256:* ]] || { echo "::error::ACR image has no manifest digest"; exit 1; }
          echo "IMAGE=$REGISTRY_HOST/jarvis-backend@$digest" >>"$GITHUB_ENV"
      - name: Deploy the image to Container Apps
        id: apply
        run: |
          if [[ -n "$BACKEND_APP" ]]; then
            az containerapp update --name "$BACKEND_APP" --resource-group "$RESOURCE_GROUP" --subscription "$SUBSCRIPTION_ID" --image "$IMAGE" --output none --only-show-errors
          else
            # First deploy: the backend app is created by Bicep once its image exists.
            bash .github/scripts/deploy_bicep.sh "$RUNNER_TEMP/infra-outputs.json" "$IMAGE"
            BACKEND_APP=$(jq -er .backendAppName.value "$RUNNER_TEMP/infra-outputs.json")
          fi
          # The previous revision serves until the new one passes its /health probes.
          for attempt in $(seq 1 30); do
            az containerapp show --name "$BACKEND_APP" --resource-group "$RESOURCE_GROUP" --subscription "$SUBSCRIPTION_ID" --output json --only-show-errors >"$RUNNER_TEMP/backend-app.json"
            latest=$(jq -r '.properties.latestRevisionName // ""' "$RUNNER_TEMP/backend-app.json")
            ready=$(jq -r '.properties.latestReadyRevisionName // ""' "$RUNNER_TEMP/backend-app.json")
            image=$(jq -r '.properties.template.containers[0].image // ""' "$RUNNER_TEMP/backend-app.json")
            if [[ "$image" == "$IMAGE" && -n "$latest" && "$latest" == "$ready" ]]; then
              echo "image=$IMAGE" >>"$GITHUB_OUTPUT"
              echo "revision=$latest" >>"$GITHUB_OUTPUT"
              echo "Revision $latest is ready with the new image."
              exit 0
            fi
            echo "Waiting for revision $latest to become ready (attempt $attempt/30)."
            sleep 30
          done
          echo "::error::The new backend revision did not become ready in 15 minutes; the previous revision keeps serving."
          exit 1

  agent:
    name: Jarvis agent (ACR and Foundry)
    needs: [plan, infra, backend]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.agent == 'true' && needs.infra.result != 'failure' && needs.backend.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      attempt: ${{ github.run_attempt }}
      image: ${{ steps.hosted-agent.outputs.image }}
      version: ${{ steps.hosted-agent.outputs.version }}
      backend-revision: ${{ steps.identity.outputs.revision }}
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Load infrastructure outputs
        run: |
          az deployment group show --name "$INFRA_DEPLOYMENT" --resource-group "$RESOURCE_GROUP" --subscription "$SUBSCRIPTION_ID" --query properties.outputs --output json --only-show-errors >"$RUNNER_TEMP/infra-outputs.json"
          {
            echo "REGISTRY=$(jq -er .containerRegistryName.value "$RUNNER_TEMP/infra-outputs.json")"
            echo "REGISTRY_HOST=$(jq -er .containerRegistryLoginServer.value "$RUNNER_TEMP/infra-outputs.json")"
            echo "BACKEND_APP=$(jq -er .backendAppName.value "$RUNNER_TEMP/infra-outputs.json")"
            echo "BACKEND_URL=https://$(jq -er .backendFqdn.value "$RUNNER_TEMP/infra-outputs.json")"
            echo "FOUNDRY_ADMIN=$(jq -er .foundryAdminEndpoint.value "$RUNNER_TEMP/infra-outputs.json")"
            echo "FOUNDRY_ACCOUNT=$(jq -er .foundryAccountName.value "$RUNNER_TEMP/infra-outputs.json")"
            echo "FOUNDRY_PROJECT=$(jq -er .foundryProjectName.value "$RUNNER_TEMP/infra-outputs.json")"
          } >>"$GITHUB_ENV"
      - name: Grant the deploy identity access to the Foundry project
        run: |
          deploy_principal=$(jq -er .deploy.servicePrincipalId infra/bootstrap.output.json)
          project_id="/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.CognitiveServices/accounts/$FOUNDRY_ACCOUNT/projects/$FOUNDRY_PROJECT"
          project_identity=$(az resource show --ids "$project_id" --api-version 2025-04-01-preview --query identity.principalId --output tsv --subscription "$SUBSCRIPTION_ID" --only-show-errors)
          [[ -n "$project_identity" ]] || { echo "::error::Foundry project has no managed identity."; exit 1; }
          ensure_role() {
            local principal="$1" role="$2" scope="$3"
            local count
            count=$(az role assignment list --scope "$scope" --fill-principal-name false --output json --subscription "$SUBSCRIPTION_ID" --only-show-errors |
              jq --arg principal "$principal" --arg role "$role" --arg scope "$scope" '[.[] | select((.principalId | ascii_downcase) == ($principal | ascii_downcase) and .roleDefinitionName == $role and ((.scope | ascii_downcase) == ($scope | ascii_downcase)))] | length')
            if [[ "$count" == 0 ]]; then
              az role assignment create --assignee-object-id "$principal" --assignee-principal-type ServicePrincipal --role "$role" --scope "$scope" --subscription "$SUBSCRIPTION_ID" --output none --only-show-errors
            fi
          }
          account_id="/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.CognitiveServices/accounts/$FOUNDRY_ACCOUNT"
          ensure_role "$deploy_principal" "Foundry Project Manager" "$project_id"
          ensure_role "$deploy_principal" "Foundry User" "$project_id"
          ensure_role "$project_identity" "Foundry User" "$account_id"
      - name: Build the Jarvis agent image in ACR
        run: |
          az acr build --registry "$REGISTRY" --image "jarvis-agent:$IMAGE_TAG" --file agents/jarvis/Dockerfile --platform linux/amd64 --subscription "$SUBSCRIPTION_ID" --only-show-errors agents/jarvis
          digest=$(az acr manifest show-metadata --registry "$REGISTRY" --name "jarvis-agent:$IMAGE_TAG" --subscription "$SUBSCRIPTION_ID" --query digest --output tsv --only-show-errors)
          [[ "$digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "::error::ACR agent image has no valid digest."; exit 1; }
          echo "AGENT_IMAGE=$REGISTRY_HOST/jarvis-agent@$digest" >>"$GITHUB_ENV"
      - name: Create and activate the Foundry hosted-agent version
        id: hosted-agent
        run: |
          connections="$FOUNDRY_ADMIN/connections?api-version=v1"
          for attempt in $(seq 1 20); do
            if az rest --method get --url "$connections" --resource https://ai.azure.com/ --output none --only-show-errors 2>/dev/null; then
              break
            fi
            if [[ "$attempt" == 20 ]]; then
              echo "::error::The Foundry project is not ready for agent deployment."
              exit 1
            fi
            sleep 15
          done
          # Voice Live needs voiceLiveCompatible metadata and the invocations_ws protocol on a Bridge target (L99).
          definition=$(jq -cn --arg image "$AGENT_IMAGE" --arg backend "$BACKEND_URL" '{
            metadata: {voiceLiveCompatible: "true", bridgeProtocolVersion: "1.0"},
            definition: {
              kind: "hosted",
              cpu: "1",
              memory: "2Gi",
              container_configuration: {image: $image},
              protocol_versions: [{protocol: "invocations", version: "2.0.0"}, {protocol: "invocations_ws", version: "1.0.0"}],
              environment_variables: {
                AZURE_AI_MODEL_DEPLOYMENT_NAME: "gpt-5.6-luna",
                JARVIS_BACKEND_URL: $backend
              },
              session_configuration: {idle_timeout_seconds: 3600}
            }
          }')
          versions="$FOUNDRY_ADMIN/agents/jarvis/versions"
          az rest --method post --url "$versions?api-version=v1" --resource https://ai.azure.com/ --headers Content-Type=application/json --body "$definition" --output json --only-show-errors >"$RUNNER_TEMP/agent-version-created.json"
          version=$(jq -er '.version | tostring' "$RUNNER_TEMP/agent-version-created.json")
          version_url="$versions/$version?api-version=v1"
          for attempt in $(seq 1 90); do
            az rest --method get --url "$version_url" --resource https://ai.azure.com/ --output json --only-show-errors >"$RUNNER_TEMP/agent-version.json"
            status=$(jq -r '.status // ""' "$RUNNER_TEMP/agent-version.json")
            if [[ "$status" == active ]]; then
              break
            fi
            if [[ "$status" == failed || "$attempt" == 90 ]]; then
              echo "::error::Foundry agent version $version failed or did not become active."
              exit 1
            fi
            sleep 10
          done
          patch=$(jq -cn --arg version "$version" '{
            agent_endpoint: {
              version_selector: {version_selection_rules: [{agent_version: $version, traffic_percentage: 100, type: "FixedRatio"}]},
              protocol_configuration: {invocations: {}, invocations_ws: {}}
            }
          }')
          az rest --method patch --url "$FOUNDRY_ADMIN/agents/jarvis?api-version=v1" --resource https://ai.azure.com/ --headers Content-Type=application/merge-patch+json --body "$patch" --output none --only-show-errors
          az rest --method get --url "$FOUNDRY_ADMIN/agents/jarvis?api-version=v1" --resource https://ai.azure.com/ --output json --only-show-errors >"$RUNNER_TEMP/agent.json"
          principal=$(jq -r '.instance_identity.principal_id // empty' "$RUNNER_TEMP/agent.json")
          if [[ -z "$principal" ]]; then
            principal=$(jq -r '.instance_identity.principal_id // empty' "$RUNNER_TEMP/agent-version.json")
          fi
          [[ "$principal" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || { echo "::error::Foundry agent has no valid instance identity."; exit 1; }
          echo "AGENT_PRINCIPAL=$principal" >>"$GITHUB_ENV"
          {
            echo "version=$version"
            echo "image=$AGENT_IMAGE"
            echo "principal=$principal"
          } >>"$GITHUB_OUTPUT"
      - name: Allow this identity in the backend
        id: identity
        run: |
          az containerapp update --name "$BACKEND_APP" --resource-group "$RESOURCE_GROUP" --subscription "$SUBSCRIPTION_ID" --set-env-vars "ENTRA_JARVIS_AGENT_OBJECT_ID=$AGENT_PRINCIPAL" "JARVIS_CHAT_AGENT_NAME=jarvis" --output none --only-show-errors
          for attempt in $(seq 1 30); do
            az containerapp show --name "$BACKEND_APP" --resource-group "$RESOURCE_GROUP" --subscription "$SUBSCRIPTION_ID" --output json --only-show-errors >"$RUNNER_TEMP/backend-app.json"
            latest=$(jq -r '.properties.latestRevisionName // ""' "$RUNNER_TEMP/backend-app.json")
            ready=$(jq -r '.properties.latestReadyRevisionName // ""' "$RUNNER_TEMP/backend-app.json")
            if [[ -n "$latest" && "$latest" == "$ready" ]] && curl --fail --silent --show-error --max-time 20 "$BACKEND_URL/health"; then
              echo "revision=$latest" >>"$GITHUB_OUTPUT"
              echo
              echo "Backend revision $latest is healthy with the hosted-agent identity configured."
              exit 0
            fi
            echo "Waiting for backend revision $latest to become healthy (attempt $attempt/30)."
            sleep 30
          done
          echo "::error::Backend did not become healthy after configuring the hosted-agent identity."
          exit 1
      - name: Deployment summary
        if: always()
        env:
          VERSION: ${{ steps.hosted-agent.outputs.version }}
          PRINCIPAL: ${{ steps.hosted-agent.outputs.principal }}
        run: |
          {
            echo "### Jarvis agent"
            echo
            echo "- Foundry hosted-agent version: \`${VERSION:-not created}\`"
            echo "- Instance identity principal ID: \`${PRINCIPAL:-not available}\`"
            echo "- Backend URL: \`$BACKEND_URL\`"
            echo
            if [[ -n "$PRINCIPAL" ]]; then
              echo "Run \`./infra/bootstrap.ps1 -JarvisAgentPrincipalId '$PRINCIPAL'\` once to assign \`Jarvis.Tools\` and persist \`ENTRA_JARVIS_AGENT_OBJECT_ID\` for future Bicep deployments."
            fi
            echo "Factory tool calls and \`/me\` authorization still require live verification after bootstrap."
          } >>"$GITHUB_STEP_SUMMARY"

  web:
    name: Web (Static Web Apps)
    needs: [plan, infra, backend]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.web == 'true' && needs.infra.result != 'failure' && needs.backend.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      attempt: ${{ github.run_attempt }}
      bundle: ${{ steps.bundle.outputs.digest }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm
        run: npm install --global npm@10.9.9
      - run: npm ci
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Load infrastructure outputs
        run: |
          az deployment group show --name "$INFRA_DEPLOYMENT" --resource-group "$RESOURCE_GROUP" --subscription "$SUBSCRIPTION_ID" --query properties.outputs --output json --only-show-errors >"$RUNNER_TEMP/infra-outputs.json"
          fqdn=$(jq -r '.backendFqdn.value // ""' "$RUNNER_TEMP/infra-outputs.json")
          [[ -n "$fqdn" ]] || { echo "::error::No backend URL: the backend has not been deployed yet."; exit 1; }
          {
            echo "VITE_BACKEND_URL=https://$fqdn"
            echo "VITE_PUSH_ENABLED=true"
            echo "VITE_PROACTIVE_ENABLED=true"
            echo "STATIC_WEB_APP=$(jq -er .staticWebAppName.value "$RUNNER_TEMP/infra-outputs.json")"
            echo "STATIC_WEB_APP_HOST=$(jq -er .staticWebAppHostname.value "$RUNNER_TEMP/infra-outputs.json")"
          } >>"$GITHUB_ENV"
      - name: Build the web app against the production backend
        env:
          # Web half of the Daily switch; the backend half is JARVIS_DAILY_ENABLED in infra/main.bicep. To turn Daily off, revert the whole change or set both to false and update daily/default-off.test.ts in the same commit.
          VITE_DAILY_ENABLED: 'true'
        run: npm run build --workspace @jarvis/web
      - name: Identify the exact production bundle
        id: bundle
        run: |
          digest=$(find apps/web/dist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - name: Get the Static Web Apps deployment token
        id: swa
        run: |
          token=$(az staticwebapp secrets list --name "$STATIC_WEB_APP" --resource-group "$RESOURCE_GROUP" --subscription "$SUBSCRIPTION_ID" --query properties.apiKey --output tsv --only-show-errors)
          echo "::add-mask::$token"
          echo "token=$token" >>"$GITHUB_OUTPUT"
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: apps/web/dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true
      - name: Check the deployed web app and a deep link
        run: |
          for path in / /settings; do
            for _ in $(seq 1 20); do
              if curl --fail --silent --show-error --max-time 20 "https://$STATIC_WEB_APP_HOST$path" | grep -q '<div id="root">'; then
                echo "https://$STATIC_WEB_APP_HOST$path serves the app."
                continue 2
              fi
              sleep 15
            done
            echo "::error::https://$STATIC_WEB_APP_HOST$path did not serve the app."
            exit 1
          done

  smoke:
    name: Deterministic runtime readiness
    needs: [plan, infra, backend, web, agent]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.superseded != 'true' && (needs.infra.result == 'success' || needs.infra.result == 'skipped') && (needs.backend.result == 'success' || needs.backend.result == 'skipped') && (needs.web.result == 'success' || needs.web.result == 'skipped') && (needs.agent.result == 'success' || needs.agent.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Load infrastructure outputs
        run: |
          az deployment group show --name "$INFRA_DEPLOYMENT" --resource-group "$RESOURCE_GROUP" --subscription "$SUBSCRIPTION_ID" --query properties.outputs --output json --only-show-errors >"$RUNNER_TEMP/infra-outputs.json"
          echo "BACKEND_FQDN=$(jq -er .backendFqdn.value "$RUNNER_TEMP/infra-outputs.json")" >>"$GITHUB_ENV"
          echo "STATIC_WEB_APP_HOST=$(jq -er .staticWebAppHostname.value "$RUNNER_TEMP/infra-outputs.json")" >>"$GITHUB_ENV"
      - name: Backend /health (startup applied pending migrations with managed identity)
        run: |
          # The backend listens only after its managed-identity SQL connection and migrations succeed.
          for _ in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 20 "https://$BACKEND_FQDN/health"; then
              echo
              echo "Backend /health returned 200."
              exit 0
            fi
            sleep 30
          done
          echo "::error::Backend /health did not return 200 in 10 minutes."
          exit 1
      - name: Foundry administration and runtime hosts answer for the project
        if: needs.plan.outputs.infra == 'true'
        run: python .github/scripts/deploy_smoke.py --subscription "$SUBSCRIPTION_ID" --resource-group "$RESOURCE_GROUP" --outputs "$RUNNER_TEMP/infra-outputs.json" --principal "$(jq -er .deploy.servicePrincipalId infra/bootstrap.output.json)"
      - name: Check retained or newly applied web readiness
        run: |
          for path in / /settings; do
            curl --fail --silent --show-error --max-time 20 "https://$STATIC_WEB_APP_HOST$path" | grep -q '<div id="root">'
          done

  managed-chat-comparison:
    name: Manual managed chat comparison
    needs: [plan, infra, backend, agent, smoke]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.provision_managed_chat == true && needs.plan.result == 'success' && needs.plan.outputs.superseded != 'true' && needs.smoke.result == 'success' && (needs.infra.result == 'success' || needs.infra.result == 'skipped') && (needs.backend.result == 'success' || needs.backend.result == 'skipped') && (needs.agent.result == 'success' || needs.agent.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Provision and verify the explicitly requested comparison
        run: bash .github/scripts/provision_managed_chat_handoff.sh

  acceptance:
    name: Live conversation acceptance
    needs: [plan, smoke]
    if: ${{ !cancelled() && needs.plan.outputs.superseded != 'true' && needs.smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Load backend endpoint
        run: |
          fqdn=$(az deployment group show --name "$INFRA_DEPLOYMENT" --resource-group "$RESOURCE_GROUP" --subscription "$SUBSCRIPTION_ID" --query properties.outputs.backendFqdn.value --output tsv --only-show-errors)
          [[ -n "$fqdn" ]]
          echo "BACKEND_FQDN=$fqdn" >>"$GITHUB_ENV"
      - name: Run backend smoke checks
        run: |
          set -euo pipefail
          if ! token=$(az account get-access-token --resource https://management.azure.com/ --subscription "$SUBSCRIPTION_ID" --query accessToken --output tsv --only-show-errors 2>"$RUNNER_TEMP/status-smoke-token.err"); then
            echo "::error::Could not obtain the deployment identity token for backend smoke checks."
            exit 1
          fi
          [[ -n "$token" ]] || { echo "::error::The deployment identity returned no token."; exit 1; }
          echo "::add-mask::$token"
          response="$RUNNER_TEMP/status-smoke.json"
          if ! curl --fail --silent --show-error --max-time 250 \
            --oauth2-bearer "$token" \
            "https://$BACKEND_FQDN/status/smoke" --output "$response"; then
            unset token
            echo "::error::The backend smoke endpoint did not return a successful response."
            exit 1
          fi
          unset token
          if ! jq -e '
            .entries as $entries |
            ($entries | type == "array" and length >= 6) and
            (["foundry.embeddings", "github_app", "google", "pc_bridge", "research", "vault"] - [$entries[].id] | length == 0) and
            all($entries[]; .status == "ok" or .status == "degraded" or .status == "down" or .status == "unknown")
          ' "$response" >/dev/null; then
            echo "::error::The backend returned an invalid smoke report."
            exit 1
          fi
          # Validate the complete fixed check set before logging any identifiers.
          python .github/scripts/smoke_reasons.py "$response" --evidence acceptance-evidence.json
          if ! python .github/scripts/backend_log_probe_verdicts.py "$response"; then
            echo "::warning::Backend log authorization observations unavailable; no activation performed."
          fi
          {
            echo "### Backend smoke checks"
            echo
            jq -r '.entries[] | "- `\(.id)`: **\(.status)**"' acceptance-evidence.json
            echo
            echo "A disconnected PC bridge is recorded but does not block deployment acceptance."
          } >>"$GITHUB_STEP_SUMMARY"
          if ! jq -e '[.entries[] | select(.id != "pc_bridge" and .id != "chat_identity" and .id != "chat_no_timestamp" and .status != "ok")] | length == 0' acceptance-evidence.json >/dev/null; then
            echo "::error::A required backend smoke check is not ok."
            exit 1
          fi
      - name: Retain bounded acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-evidence-${{ github.run_attempt }}
          path: acceptance-evidence.json
          if-no-files-found: warn
          retention-days: 30

  result:
    name: Release result and failure evidence
    if: always() && github.ref == 'refs/heads/main'
    needs: [plan, infra, backend, web, agent, smoke, acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Read the immutable plan
        if: needs.plan.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-plan-${{ needs.plan.outputs.attempt }}
      - name: Read sanitized conversation evidence
        if: needs.acceptance.result == 'success' || needs.acceptance.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: acceptance-evidence-${{ github.run_attempt }}
      - name: Record applied versions separately from acceptance
        if: always()
        env:
          RESULTS: ${{ toJSON(needs) }}
          VERSIONS: >-
            {"infra":{"deployment":"jarvis-infra"},
            "backend":{"image":"${{ needs.backend.outputs.image }}","revision":"${{ needs.agent.outputs.backend-revision || needs.backend.outputs.revision }}"},
            "agent":{"image":"${{ needs.agent.outputs.image }}","version":"${{ needs.agent.outputs.version }}"},
            "web":{"source":"${{ github.sha }}","bundle":"${{ needs.web.outputs.bundle }}"}}
          APPLY_ATTEMPTS: >-
            {"infra":"${{ needs.infra.outputs.attempt }}","backend":"${{ needs.backend.outputs.attempt }}",
            "web":"${{ needs.web.outputs.attempt }}","agent":"${{ needs.agent.outputs.attempt }}"}
          AGENT_BACKEND_REVISION: ${{ needs.agent.outputs.backend-revision }}
        run: python .github/scripts/release_state.py record
      - name: Retain immutable release and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-${{ github.run_attempt }}
          path: release-evidence.json
          if-no-files-found: error
          retention-days: 30
