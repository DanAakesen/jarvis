name: Jarvis agent CI

# Called by ci.yml (P4-01); it runs on PRs, main and workflow_dispatch.
# Agent lint and tests run in ci.yml's Python job (.github/scripts/python-ci.sh).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  image:
    name: Jarvis agent image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: docker build --tag jarvis-agent:local agents/jarvis
      - name: Check non-root user and fail-fast configuration
        run: |
          docker run --rm jarvis-agent:local sh -ec 'test "$(id -u)" != 0'
          if docker run --rm --env FOUNDRY_PROJECT_ENDPOINT=https://fixture.services.ai.azure.com/api/projects/fixture \
            --env AZURE_AI_MODEL_DEPLOYMENT_NAME=fixture jarvis-agent:local; then
            echo 'The agent started without JARVIS_BACKEND_URL'; exit 1
          fi
      - name: Answer a model-free voice turn over the WebSocket
        run: |
          python -m pip install --require-hashes -r agents/jarvis/requirements-dev.txt
          docker run --detach --name agent-smoke --publish 8088:8088 \
            --env FOUNDRY_PROJECT_ENDPOINT=https://fixture.services.ai.azure.com/api/projects/fixture \
            --env AZURE_AI_MODEL_DEPLOYMENT_NAME=fixture \
            --env JARVIS_BACKEND_URL=https://backend.example jarvis-agent:local
          trap 'docker logs agent-smoke; docker rm --force agent-smoke' EXIT
          for attempt in {1..30}; do
            if python agents/jarvis/scripts/smoke_test.py --uri ws://127.0.0.1:8088/invocations_ws; then
              exit 0
            fi
            sleep 2
          done
          exit 1
