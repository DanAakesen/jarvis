# Keeps the Status column of open issues on the "Project Jarvis" board in step
# with GitHub (Backlog, Ready, In progress, In review). Rules live in
# .github/scripts/project_board.py; the project's built-in "Item closed"
# workflow moves closed issues to Done. Part of P0-13.
#
# Needs the PROJECT_TOKEN secret: GITHUB_TOKEN can't edit a user-owned project.
# pull_request_target (not pull_request) so PRs with merge conflicts still sync
# (L38); this workflow never checks out PR code.
name: Project board

on:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  pull_request_target:
    types: [opened, closed, reopened, ready_for_review, converted_to_draft, edited]
  workflow_run:
    # Plan status creates issues and Blocked-by links for new tasks.
    workflows: ["Plan status"]
    types: [completed]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: project-board
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN != '' }}
    steps:
      - name: Missing PROJECT_TOKEN
        if: env.HAS_PROJECT_TOKEN != 'true'
        run: echo "::warning::PROJECT_TOKEN secret is not set; the board was not synced. See docs/agent-context.md#task-board."
      - uses: actions/checkout@v4
        if: env.HAS_PROJECT_TOKEN == 'true'
        with:
          ref: main
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v5
        if: env.HAS_PROJECT_TOKEN == 'true'
        with:
          python-version-file: .python-version
      - name: Sync board
        if: env.HAS_PROJECT_TOKEN == 'true'
        env:
          REPOSITORY: ${{ github.repository }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: "2"
          REPO_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: python .github/scripts/project_board.py