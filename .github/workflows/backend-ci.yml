name: Backend CI

# Called by ci.yml (P0-10); it runs on PRs, main and workflow_dispatch.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm
        run: npm install --global npm@10.9.9
      - run: npm ci
      - run: npm run lint --workspace @jarvis/backend
      - run: npm test --workspace @jarvis/backend
      - run: npm run build --workspace @jarvis/backend

  container:
    name: Backend container build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag jarvis-backend:ci --file apps/backend/Dockerfile .
      - name: Smoke production image without Azure credentials
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name backend --publish 127.0.0.1:3000:3000 \
            --env STATIC_WEB_APP_ORIGIN=https://fixture.azurestaticapps.net jarvis-backend:ci
          trap 'docker logs backend; docker rm --force backend' EXIT
          # Docker can reset an early connection while Node is still starting.
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 --max-time 2 \
            http://127.0.0.1:3000/health --output /tmp/health.json
          python -c 'import json; assert json.load(open("/tmp/health.json")) == {"status": "ok"}'
          test "$(docker exec backend id -u)" != 0
          docker exec backend node -e "if (process.version !== 'v22.23.3') process.exit(1); for (const p of ['node_modules/typescript', 'node_modules/vitest', 'node_modules/@jarvis/web', 'docs', 'infra', 'apps/web']) { if (require('node:fs').existsSync(p)) process.exit(1); }"
          curl --fail --silent --dump-header /tmp/headers --output /dev/null \
            --header 'Origin: https://fixture.azurestaticapps.net' http://127.0.0.1:3000/health
          grep -qi '^access-control-allow-origin: https://fixture.azurestaticapps.net' /tmp/headers
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Origin: https://unexpected.example' http://127.0.0.1:3000/health)" = 403
          curl --fail --silent --output /dev/null --header 'Authorization: Bearer ci-header-secret' \
            'http://127.0.0.1:3000/health?token=ci-query-secret'
          docker stop --time 10 backend
          test "$(docker inspect --format '{{.State.ExitCode}}' backend)" = 0
          if docker logs backend 2>&1 | grep -qE 'ci-header-secret|ci-query-secret'; then exit 1; fi
