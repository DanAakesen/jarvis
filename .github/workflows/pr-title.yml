# Keeps PR titles in the format the merge rules rely on: "<task ID>: <summary>"
# (a leading "[WIP] " is kept), "fix-main: ...", or "docs: ...". Reads current
# same-PR/head metadata, suggesting canonical titles without racing title edits.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review, synchronize]

permissions:
  pull-requests: write
  issues: read
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - name: Validate the current title
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/validate-pr-title.sh