# Keeps PR titles in the format the merge rules rely on: "<task ID>: <summary>"
# (a leading "[WIP] " is kept), "fix-main: ...", or "docs: ...". Fixes small
# deviations such as "[P0-05] ..." and takes a missing task ID from the linked
# issue; fails when no task ID can be found. Part of P0-12.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review]

permissions:
  pull-requests: write
  issues: read
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Normalize the title
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          linked_id=""
          issue=$(grep -oiE '(fixes|closes|resolves|refs) #[0-9]+' <<<"${PR_BODY:-}" | head -n1 | grep -oE '[0-9]+' || true)
          if [[ -n "$issue" ]]; then
            linked_id=$(gh issue view "$issue" --repo "$REPO" --json title --jq '.title' | grep -oE '^P[0-9]{1,2}-[0-9]{2}' || true)
          fi
          if ! new_title=$(bash .github/scripts/normalize-pr-title.sh "$PR_TITLE" "$linked_id"); then
            echo "::error::PR title must be '<task ID>: <summary>' (for example 'P0-05: Foundry account'), 'fix-main: ...', or 'docs: ...'. No task ID found in the title or a linked issue."
            exit 1
          fi
          if [[ "$new_title" != "$PR_TITLE" ]]; then
            gh pr edit "$PR_URL" --title "$new_title"
            echo "Title changed to: $new_title"
          fi