name: Request 800 Factory sandbox cores
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-factory-sandbox-quota
  cancel-in-progress: false
jobs:
  request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: .python-version
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Request quota without allocating any workers
        env:
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: python .github/scripts/request_sandbox_quota.py --subscription "$SUBSCRIPTION_ID" --state "$RUNNER_TEMP/sandbox-quota.json"
      - name: Retain sanitized quota outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sandbox-quota
          path: ${{ runner.temp }}/sandbox-quota.json
          if-no-files-found: warn
          retention-days: 14
