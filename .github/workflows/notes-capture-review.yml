# Temporary diagnostic runner. Never merge.
name: Read Notes compilation diagnostics
on:
  push:
    branches: [codex/notes-capture-review]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: DanAakesen/jarvis
    steps:
      - name: Read only the existing failed compilation
        run: |
          gh run view 42509865676 --job 128820367454 --log-failed > "$RUNNER_TEMP/notes-core.log"
          python3 - <<'PY'
          import os, pathlib
          lines = pathlib.Path(os.environ["RUNNER_TEMP"], "notes-core.log").read_text().splitlines()
          selected = [line for line in lines if "error:" in line or "failed" in line or "Test Case" in line]
          print("\n".join(selected[:60]))
          PY
