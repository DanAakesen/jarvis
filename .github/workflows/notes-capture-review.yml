# Temporary exact-source validation cleanup. Never merge.
name: Stop duplicate Notes native sweep
on:
  push:
    branches: [codex/notes-capture-review]
permissions:
  contents: read
  actions: write
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: DanAakesen/jarvis
    steps:
      - name: Preserve passed focused evidence and stop only the redundant sweep
        run: |
          test "$(gh api repos/DanAakesen/jarvis/actions/runs/42510119801 --jq .conclusion)" = "success"
          test "$(gh api repos/DanAakesen/jarvis/actions/runs/42511384290 --jq .head_sha)" = "2f0fd280d6f999dd01459e97e0f43e9e12882c3e"
          test "$(gh api repos/DanAakesen/jarvis/actions/runs/42511384290 --jq .name)" = "iOS Simulator"
          if test "$(gh api repos/DanAakesen/jarvis/actions/runs/42511384290 --jq .status)" != "completed"; then
            gh api --method POST repos/DanAakesen/jarvis/actions/runs/42511384290/force-cancel
          fi
