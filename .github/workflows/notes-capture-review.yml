# Temporary validation-only operation. Never merge.
name: Cancel duplicate Notes simulator run
on:
  push:
    branches: [codex/notes-capture-review]
permissions:
  contents: read
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: DanAakesen/jarvis
    steps:
      - name: Keep focused exact-source native qualification; cancel only the duplicate
        run: |
          test "$(gh api repos/DanAakesen/jarvis/actions/runs/42509929012 --jq .head_sha)" = "ca107a8b897bdf2eab181ab504cb43bcf1344525"
          test "$(gh api repos/DanAakesen/jarvis/actions/runs/42509929012 --jq .name)" = "iOS Simulator"
          if test "$(gh api repos/DanAakesen/jarvis/actions/runs/42509929012 --jq .status)" != "completed"; then
            gh run cancel 42509929012
          fi
