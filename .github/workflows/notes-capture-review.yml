# Temporary validation cleanup; never merge.
name: Keep qualified Notes native evidence
on:
  push:
    branches: [codex/notes-capture-review]
permissions:
  contents: read
  actions: write
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: DanAakesen/jarvis
    steps:
      - name: Stop only the duplicate post-merge simulator sweep
        run: |
          test "$(gh api repos/DanAakesen/jarvis/actions/runs/42510119801 --jq .conclusion)" = "success"
          test "$(gh api repos/DanAakesen/jarvis/actions/runs/42511593064 --jq .head_sha)" = "df813f348eae27961259c691b526eeadced9ea18"
          test "$(gh api repos/DanAakesen/jarvis/actions/runs/42511593064 --jq .name)" = "iOS Simulator"
          if test "$(gh api repos/DanAakesen/jarvis/actions/runs/42511593064 --jq .status)" != "completed"; then
            gh api --method POST repos/DanAakesen/jarvis/actions/runs/42511593064/force-cancel
          fi
