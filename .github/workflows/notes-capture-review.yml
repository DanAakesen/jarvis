# Temporary diagnostic reader; never merge.
name: Inspect Notes navigation timing
on:
  push:
    branches: [codex/notes-capture-review]
permissions:
  contents: read
  actions: read
jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: DanAakesen/jarvis
    steps:
      - name: Read the passed large-library interaction timing
        run: |
          gh run view 42510119801 --job 128821154254 --log > "$RUNNER_TEMP/native.log"
          python3 - <<'PY'
          import os, pathlib
          lines = pathlib.Path(os.environ["RUNNER_TEMP"], "native.log").read_text().splitlines()
          inside = False
          for line in lines:
              if "Test Case" in line and "testLargeLibrarySidebarOpensAfterScrollingAndReturnsToChat" in line and "started" in line:
                  inside = True
              if inside:
                  print(line[:1600])
              if inside and "Test Case" in line and "passed" in line:
                  break
          PY
