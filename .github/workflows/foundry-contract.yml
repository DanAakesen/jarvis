name: Foundry contract CI

# Called by ci.yml (P0-10); it runs on PRs, main and workflow_dispatch.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  foundry:
    name: Foundry offline contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm
        run: npm install --global npm@10.9.9
      - run: npm ci
      - name: Lint Foundry client
        run: npx --no-install eslint --config apps/backend/src/foundry/lint.config.mjs apps/backend/src/foundry --max-warnings 0
      - name: Build backend client
        run: npm run build --workspace @jarvis/backend
      - name: Offline Foundry contracts
        run: npx --no-install vitest run --config apps/backend/src/foundry/vitest.config.mts
