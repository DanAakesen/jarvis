name: Retained iOS evidence extraction
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ios-screenshots-pr-1621-1
          run-id: 42243718420
          github-token: ${{ github.token }}
          path: retained
      - name: Index retained evidence (no build or simulator)
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib,json,shutil
          root=Path('retained'); out=Path('review'); out.mkdir()
          index=[]
          for p in root.rglob('*'):
              if not p.is_file(): continue
              index.append({'path':str(p.relative_to(root)),'bytes':p.stat().st_size,'sha256':hashlib.file_digest(p.open('rb'),'sha256').hexdigest()})
              if p.suffix.lower() in {'.png','.json','.txt','.log','.html'}:
                  dst=out/p.relative_to(root);dst.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,dst)
          (out/'source-index.json').write_text(json.dumps(index))
          print('Retained source run 42243718420; copied',sum(p.stat().st_size for p in out.rglob('*') if p.is_file()),'bytes')
          PYCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: retained-7acb-images-and-index
          path: review
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: retained-7acb-loading-motion
          path: retained/*loading*.mp4
          if-no-files-found: warn
          retention-days: 14
