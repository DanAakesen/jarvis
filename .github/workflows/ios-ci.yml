# Validation-only branch: never merge this focused workflow.
name: P15 focused widget and activity verification
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  TASK_SOURCE_SHA: e9aa204ba54df16c848cb715ee977ab8f8d227ce
  TASK_IOS_TREE: e7c7bc87ef3696d228236aafde0f80e8366a29b6
jobs:
  gallery:
    name: Verify widgets, Tasks navigation and activity visibility
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TASK_SOURCE_SHA }}
          fetch-depth: 0
      - name: Verify exact source and bounded widget changes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TASK_SOURCE_SHA"
          test "$(git rev-parse HEAD:apps/ios)" = "$TASK_IOS_TREE"
          mkdir -p "$RUNNER_TEMP/gallery-evidence"
          python3 - <<'PYCODE'
          import json, os, pathlib, subprocess
          git = lambda value: subprocess.check_output(["git", "rev-parse", value], text=True).strip()
          allowed = ['apps/ios/Jarvis/ContentView.swift', 'apps/ios/Jarvis/JarvisActivitySheet.swift', 'apps/ios/Jarvis/JarvisApp.swift', 'apps/ios/Jarvis/JarvisChatModel.swift', 'apps/ios/Jarvis/JarvisChatScreen.swift', 'apps/ios/Jarvis/JarvisFixtureScenario.swift', 'apps/ios/Jarvis/JarvisNotesArea.swift', 'apps/ios/Jarvis/JarvisNotesPreview.swift', 'apps/ios/Jarvis/JarvisWidgetLayoutGallery.swift', 'apps/ios/Jarvis/JarvisWidgetSnapshotPublisher.swift', 'apps/ios/JarvisUITests/ChatPresentationUITests.swift', 'apps/ios/JarvisUITests/ComponentGalleryUITests.swift', 'apps/ios/JarvisUITests/SidebarNavigationTests.swift', 'apps/ios/Packages/JarvisCore/Sources/JarvisCore/Now/NowFeedModels.swift', 'apps/ios/Packages/JarvisCore/Sources/JarvisCore/Widgets/JarvisWidgetCopy.swift', 'apps/ios/Packages/JarvisCore/Tests/JarvisCoreTests/BackgroundTaskPresentationTests.swift', 'apps/ios/Widgets/JarvisFactoryWidgetViews.swift', 'apps/ios/Widgets/JarvisGymWidgetViews.swift', 'apps/ios/Widgets/JarvisHomeWidgetViews.swift', 'apps/ios/Widgets/JarvisHomeWidgets.swift', 'apps/ios/Widgets/JarvisNotesWidgetViews.swift', 'apps/ios/Widgets/JarvisWidgetComponents.swift']
          changed = subprocess.check_output(["git", "diff", "--name-only", "b01f5f0306a1b134d4cf633796217a1928fb2b78", "HEAD", "--", "apps/ios"], text=True).splitlines()
          assert sorted(changed) == sorted(allowed), changed
          evidence = {"source":git("HEAD"), "tree":git("HEAD^{tree}"), "ios_tree":git("HEAD:apps/ios"), "run":os.environ["GITHUB_RUN_ID"], "prior_native_runs":[42292434058,42302707513], "selected_tests":['ComponentGalleryUITests/testMediumWidgetsDarkEnglish', 'ComponentGalleryUITests/testMediumWidgetsLightDanish', 'ComponentGalleryUITests/testMediumWidgetsLightEnglish', 'SidebarNavigationTests/testWidgetLinksOpenTheirSectionsOnColdLaunch', 'SidebarNavigationTests/testWidgetLinksNavigateAnAlreadyRunningApp', 'SidebarNavigationTests/testNotesShowsItsScreenInDanish', 'SidebarNavigationTests/testNotesShowsItsScreenInEnglish', 'ChatPresentationUITests/testCompletedJobsHideNowBarAndAwayModeInBothLanguages', 'ChatPresentationUITests/testCalendarChangeNowBarUsesLocalizedControls', 'ComponentGalleryUITests/testNotificationsHasHeroAndKeepsApprovalActionsInBothLanguages'], "changed_ios_paths":changed, "other_app_source_unchanged":True}
          pathlib.Path(os.environ["RUNNER_TEMP"], "gallery-evidence", "provenance.json").write_text(json.dumps(evidence, indent=2))
          PYCODE
      - name: Select pinned Xcode 26.6
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: Install pinned XcodeGen 2.46.0
        run: |
          curl --fail --location --silent --show-error https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip --output "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/SourcePackages
          key: ios-spm-${{ runner.os }}-${{ hashFiles('apps/ios/project.yml', 'apps/ios/Packages/JarvisCore/Package.swift') }}
      - name: Build the exact candidate for Simulator
        working-directory: apps/ios
        run: |
          xcodegen generate
          xcodebuild -project Jarvis.xcodeproj -scheme Jarvis -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO build
      - name: Run the gallery with unchanged per-test limits
        id: gallery
        continue-on-error: true
        run: |
          set -euo pipefail
          TASK_DEVICE_ID="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty')"
          test -n "$TASK_DEVICE_ID"
          xcrun simctl boot "$TASK_DEVICE_ID"
          xcrun simctl bootstatus "$TASK_DEVICE_ID" -b
          xcrun simctl status_bar "$TASK_DEVICE_ID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl install "$TASK_DEVICE_ID" "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/Jarvis.app"
          xcodebuild test -project apps/ios/Jarvis.xcodeproj -scheme Jarvis -destination "id=$TASK_DEVICE_ID" -derivedDataPath "$RUNNER_TEMP/DerivedData" -resultBundlePath "$RUNNER_TEMP/gallery-evidence/gallery.xcresult" -only-testing:JarvisUITests/ComponentGalleryUITests/testMediumWidgetsDarkEnglish -only-testing:JarvisUITests/ComponentGalleryUITests/testMediumWidgetsLightDanish -only-testing:JarvisUITests/ComponentGalleryUITests/testMediumWidgetsLightEnglish -only-testing:JarvisUITests/SidebarNavigationTests/testWidgetLinksOpenTheirSectionsOnColdLaunch -only-testing:JarvisUITests/SidebarNavigationTests/testWidgetLinksNavigateAnAlreadyRunningApp -only-testing:JarvisUITests/SidebarNavigationTests/testNotesShowsItsScreenInDanish -only-testing:JarvisUITests/SidebarNavigationTests/testNotesShowsItsScreenInEnglish -only-testing:JarvisUITests/ChatPresentationUITests/testCompletedJobsHideNowBarAndAwayModeInBothLanguages -only-testing:JarvisUITests/ChatPresentationUITests/testCalendarChangeNowBarUsesLocalizedControls -only-testing:JarvisUITests/ComponentGalleryUITests/testNotificationsHasHeroAndKeepsApprovalActionsInBothLanguages -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 150 CODE_SIGNING_ALLOWED=NO
      - name: Export actual native attachments
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/gallery-evidence/gallery.xcresult" ]]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/gallery-evidence/gallery.xcresult" --output-path "$RUNNER_TEMP/gallery-evidence/attachments"
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/gallery-evidence/gallery.xcresult" > "$RUNNER_TEMP/gallery-evidence/summary.json"
          fi
      - name: Retain focused results and source proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: p15-widget-contrast-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gallery-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Require the selected test to pass
        if: always() && steps.gallery.outcome != 'success'
        run: exit 1
