name: iOS CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: JarvisCore build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.2"
      - name: Build and test JarvisCore
        working-directory: apps/ios/Packages/JarvisCore
        run: |
          swift build
          swift test
      - name: Check iOS project and platform metadata
        run: |
          ruby -ryaml -e '
            project = YAML.safe_load_file("apps/ios/project.yml")
            abort "unexpected iOS target" unless project.dig("targets", "Jarvis", "platform") == "iOS"
            abort "unexpected iOS targets" unless project["targets"].keys == ["Jarvis", "JarvisBroadcast", "JarvisVoiceActivity", "JarvisWidgets"]
            abort "exactly one application target is required" unless project.dig("targets", "Jarvis", "type") == "application"
            abort "broadcast extension target is required" unless project.dig("targets", "JarvisBroadcast", "type") == "app-extension"
            abort "WidgetKit extension target is required" unless project.dig("targets", "JarvisWidgets", "type") == "app-extension"
            dependencies = project.dig("targets", "Jarvis", "dependencies") || []
            abort "broadcast extension must be embedded in the app" unless dependencies.any? { |dependency| dependency["target"] == "JarvisBroadcast" && dependency["embed"] == true }
            abort "voice activity extension must be embedded in the app" unless dependencies.any? { |dependency| dependency["target"] == "JarvisVoiceActivity" && dependency["embed"] == true }
            abort "voice activity extension target is required" unless project.dig("targets", "JarvisVoiceActivity", "type") == "app-extension"
            abort "voice activity must share attributes and intents" unless project.dig("targets", "JarvisVoiceActivity", "sources").any? { |source| source["path"] == "Shared" }
            abort "Danish must be the development language" unless project.dig("options", "developmentLanguage") == "da"
            abort "WidgetKit extension must be embedded in the app" unless dependencies.any? { |dependency| dependency["target"] == "JarvisWidgets" && dependency["embed"] == true }
            bridge_header = project.dig("targets", "JarvisBroadcast", "settings", "base", "SWIFT_OBJC_BRIDGING_HEADER")
            abort "ReplayKit stop bridge is missing" unless bridge_header && File.file?(File.join("apps/ios", bridge_header))
            abort "unexpected deployment target" unless project.dig("targets", "Jarvis", "deploymentTarget") == "26.0"
            abort "unexpected bundle identifier" unless project.dig("targets", "Jarvis", "settings", "base", "PRODUCT_BUNDLE_IDENTIFIER") == "com.danaakesen.jarvis"
            abort "iPhone-only device family is required" unless project.dig("targets", "Jarvis", "settings", "base", "TARGETED_DEVICE_FAMILY") == "1"
            abort "Swift 5 language mode is required" unless project.dig("targets", "Jarvis", "settings", "base", "SWIFT_VERSION") == "5.0"
            abort "local JarvisCore dependency is required" unless project.dig("packages", "JarvisCore", "path") == "Packages/JarvisCore"
          '
          python3 - <<'PY'
          import json
          import plistlib
          from pathlib import Path

          icon = json.loads(Path("apps/ios/Jarvis/Assets.xcassets/AppIcon.appiconset/Contents.json").read_text())
          assert icon["images"][0]["filename"] == "JarvisAppIcon.png"
          assert Path("apps/ios/Jarvis/Assets.xcassets/AppIcon.appiconset/JarvisAppIcon.png").is_file()
          info = plistlib.loads(Path("apps/ios/Jarvis/Info.plist").read_bytes())
          assert info["ITSAppUsesNonExemptEncryption"] is False
          assert info["NSSupportsLiveActivities"] is True
          assert info["CFBundleDevelopmentRegion"] == "da"
          assert "audio" in info["UIBackgroundModes"]
          activity_info = plistlib.loads(Path("apps/ios/VoiceActivity/Info.plist").read_bytes())
          assert activity_info["NSExtension"]["NSExtensionPointIdentifier"] == "com.apple.widgetkit-extension"
          assert activity_info["CFBundleDevelopmentRegion"] == "da"
          widget_info = plistlib.loads(Path("apps/ios/Widgets/Info.plist").read_bytes())
          assert widget_info["CFBundlePackageType"] == "XPC!"
          assert widget_info["CFBundleIdentifier"] == "$(PRODUCT_BUNDLE_IDENTIFIER)"
          assert widget_info["NSExtension"]["NSExtensionPointIdentifier"] == "com.apple.widgetkit-extension"
          app_group = ["group.com.danaakesen.jarvis"]
          entitlements = plistlib.loads(Path("apps/ios/Jarvis/Jarvis.entitlements").read_bytes())
          assert entitlements["com.apple.security.application-groups"] == app_group
          assert entitlements["keychain-access-groups"] == ["$(AppIdentifierPrefix)com.microsoft.adalcache"]
          assert info["LSApplicationQueriesSchemes"] == ["msauthv2", "msauthv3"]
          extension_entitlements = plistlib.loads(Path("apps/ios/Jarvis/Broadcast/JarvisBroadcast.entitlements").read_bytes())
          assert extension_entitlements["com.apple.security.application-groups"] == app_group
          extension_info = plistlib.loads(Path("apps/ios/Jarvis/Broadcast/Info.plist").read_bytes())
          extension = extension_info["NSExtension"]
          assert extension_info["CFBundlePackageType"] == "XPC!"
          assert extension_info["CFBundleIdentifier"] == "$(PRODUCT_BUNDLE_IDENTIFIER)"
          assert extension["NSExtensionPointIdentifier"] == "com.apple.broadcast-services-upload"
          assert extension["RPBroadcastProcessMode"] == "RPBroadcastProcessModeSampleBuffer"
          PY

  macos:
    name: iOS Simulator build
    needs: linux
    if: needs.linux.result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      group: ios-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned Xcode 26.6
        run: |
          ls -1 /Applications
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: Install pinned XcodeGen 2.46.0
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" \
            | shasum --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/SourcePackages
          key: ios-spm-${{ runner.os }}-${{ hashFiles('apps/ios/project.yml', 'apps/ios/Packages/JarvisCore/Package.swift') }}
      - name: Generate project and build for Simulator
        working-directory: apps/ios
        run: |
          xcodegen generate
          xcodebuild \
            -project Jarvis.xcodeproj \
            -scheme Jarvis \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Boot iPhone Simulator and capture screenshots
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty')"
          DEVICE_NAME="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].name // empty')"
          if [[ -z "$DEVICE_ID" ]]; then
            echo "::error::No available iPhone Simulator device was found."
            exit 1
          fi
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/Jarvis.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error::The unsigned Simulator app was not produced."
            exit 1
          fi
          SCREENSHOT_DIR="$RUNNER_TEMP/ios-screenshots"
          mkdir -p "$SCREENSHOT_DIR"
          echo "IOS_SIMULATOR_UDID=$DEVICE_ID" >> "$GITHUB_ENV"
          echo "IOS_SIMULATOR_NAME=$DEVICE_NAME" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl ui "$DEVICE_ID" appearance light
          xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.danaakesen.jarvis --screenshot-chat-fixture
          sleep 2
          xcrun simctl io "$DEVICE_ID" screenshot "$SCREENSHOT_DIR/main-light.png"
          xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.danaakesen.jarvis \
            --screenshot-chat-fixture --screenshot-chat-plus-menu
          sleep 2
          xcrun simctl io "$DEVICE_ID" screenshot "$SCREENSHOT_DIR/chat-plus-menu-light.png"
          xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.danaakesen.jarvis --screenshot-sidebar-open --screenshot-chat-fixture
          sleep 2
          xcrun simctl io "$DEVICE_ID" screenshot "$SCREENSHOT_DIR/sidebar-open-light.png"
          xcrun simctl ui "$DEVICE_ID" appearance dark
          xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.danaakesen.jarvis --screenshot-chat-fixture
          sleep 2
          xcrun simctl io "$DEVICE_ID" screenshot "$SCREENSHOT_DIR/main-dark.png"
          for language in da en; do
            xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.danaakesen.jarvis \
              --screenshot-voice-connection-lost \
              "--screenshot-voice-language=$language"
            sleep 2
            xcrun simctl io "$DEVICE_ID" screenshot \
              "$SCREENSHOT_DIR/voice-connection-lost-${language}-dark.png"
          done
          xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.danaakesen.jarvis --screenshot-sidebar-open --screenshot-chat-fixture
          sleep 2
          xcrun simctl io "$DEVICE_ID" screenshot "$SCREENSHOT_DIR/sidebar-open-dark.png"
          for appearance in light dark; do
            xcrun simctl ui "$DEVICE_ID" appearance "$appearance"
            for state in listening thinking speaking; do
              xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.danaakesen.jarvis \
                --screenshot-chat-fixture --screenshot-voice-fixture \
                "--screenshot-voice-state=$state"
              sleep 2
              xcrun simctl io "$DEVICE_ID" screenshot \
                "$SCREENSHOT_DIR/voice-${state}-${appearance}.png"
            done
            for screen in chat voice notifications settings notes health sidebar; do
              extra_args=("--screenshot-screen=$screen")
              if [[ "$screen" == sidebar ]]; then
                extra_args=("--screenshot-sidebar-open")
              fi
              xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.danaakesen.jarvis \
                --screenshot-chat-fixture "${extra_args[@]}"
              sleep 2
              xcrun simctl io "$DEVICE_ID" screenshot "$SCREENSHOT_DIR/ambient-${screen}-${appearance}.png"
            done
            xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.danaakesen.jarvis \
              --screenshot-chat-fixture --screenshot-notifications-open
            sleep 2
            xcrun simctl io "$DEVICE_ID" screenshot "$SCREENSHOT_DIR/notifications-${appearance}.png"
            for language in da en; do
              for state in track newlift empty; do
                xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.danaakesen.jarvis \
                  --screenshot-health-fixture \
                  "--screenshot-health-state=$state" \
                  "--screenshot-health-language=$language"
                sleep 2
                xcrun simctl io "$DEVICE_ID" screenshot \
                  "$SCREENSHOT_DIR/health-${state}-${appearance}-${language}.png"
              done
              for state in board needs releases detail release steer newtask empty loading error offline stale reconnecting search; do
                xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.danaakesen.jarvis \
                  --screenshot-chat-fixture \
                  --screenshot-factory-fixture \
                  "--screenshot-factory-state=$state" \
                  "--screenshot-factory-language=$language"
                sleep 2
                xcrun simctl io "$DEVICE_ID" screenshot \
                  "$SCREENSHOT_DIR/factory-${state}-${appearance}-${language}.png"
              done
            done
          done
          open -a Simulator
          xcrun simctl ui "$DEVICE_ID" appearance dark
          for language in da en; do
            for state in listening speaking muted; do
              xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.danaakesen.jarvis \
                --screenshot-voice-activity-fixture \
                "--voice-activity-language=$language" "--voice-activity-state=$state"
              sleep 3
              osascript -e 'tell application "Simulator" to activate' \
                -e 'tell application "System Events" to keystroke "l" using command down'
              sleep 2
              xcrun simctl io "$DEVICE_ID" screenshot "$SCREENSHOT_DIR/voice-lock-${state}-${language}.png"
              osascript -e 'tell application "Simulator" to activate' \
                -e 'tell application "System Events" to keystroke "h" using {command down, shift down}'
            done
          done
          cp docs/ios/design/hands-free-board.png "$SCREENSHOT_DIR/voice-approved-board.png"
          for appearance in light dark; do
            xcrun simctl ui "$DEVICE_ID" appearance "$appearance"
            for language in da en; do
              xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.danaakesen.jarvis \
                --screenshot-lockscreen-task-fixture \
                "--screenshot-lockscreen-language=$language"
              sleep 2
              xcrun simctl io "$DEVICE_ID" screenshot \
                "$SCREENSHOT_DIR/lockscreen-tasks-${appearance}-${language}.png"
            done
          done
      - name: Pair simulator captures with approved board renders
        run: |
          cp -R docs/ios/design "$RUNNER_TEMP/ios-screenshots/board"
          python3 - <<'PY'
          import html
          import os
          from pathlib import Path
          from urllib.parse import urlencode

          root = Path(os.environ["RUNNER_TEMP"]) / "ios-screenshots"
          sections = []
          for appearance in ("light", "dark"):
              for screen in ("chat", "voice", "notifications", "factory", "settings", "notes", "health", "sidebar"):
                  image = (f"factory-board-{appearance}-da.png" if screen == "factory"
                           else f"ambient-{screen}-{appearance}.png")
                  if not (root / image).is_file():
                      raise SystemExit(f"Missing simulator capture: {image}")
                  query = {"screen": screen, "theme": appearance, "bare": "screen", "zoom": "fit"}
                  if screen in ("notifications", "sidebar"):
                      query["screen"] = "chat"
                      query["sheet" if screen == "notifications" else "sidebar"] = "activity" if screen == "notifications" else "open"
                  board = html.escape("board/board.html?" + urlencode(query), quote=True)
                  title = f"{screen.title()} · {appearance}"
                  sections.append(f'''<section><h2>{title}</h2><div class="pair">
                    <figure><figcaption>iPhone simulator · synthetic fixture</figcaption>
                      <img src="{image}" alt="{title} simulator screenshot"></figure>
                    <figure><figcaption>Approved concept board · not the running app</figcaption>
                      <iframe src="{board}" title="{title} board render" loading="lazy"></iframe></figure>
                    </div></section>''')
              for state in ("listening", "thinking", "speaking"):
                  image = f"voice-{state}-{appearance}.png"
                  if not (root / image).is_file():
                      raise SystemExit(f"Missing simulator capture: {image}")
                  board = html.escape("board/board.html?" + urlencode({
                      "screen": "voice", "voice": state, "theme": appearance,
                      "bare": "screen", "zoom": "fit",
                  }), quote=True)
                  title = f"Voice {state} · {appearance}"
                  sections.append(f'''<section><h2>{title}</h2><div class="pair">
                    <figure><figcaption>iPhone simulator · synthetic fixture</figcaption>
                      <img src="{image}" alt="{title} simulator screenshot"></figure>
                    <figure><figcaption>Approved concept board · not the running app</figcaption>
                      <iframe src="{board}" title="{title} board render" loading="lazy"></iframe></figure>
                    </div></section>''')
          (root / "comparisons.html").write_text('''<!doctype html><html lang="en">
          <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Shared iPhone background comparisons</title>
          <style>body{font:16px system-ui;margin:24px;background:#161c24;color:#f3fff9}
          h1,h2{font-weight:600}.pair{display:flex;flex-wrap:wrap;gap:24px}
          figure{margin:0}figcaption{margin:8px 0}img,iframe{width:440px;height:956px;
          border:0;object-fit:contain;background:#07090f}section{margin-bottom:40px}
          @media(max-width:480px){body{margin:12px}img,iframe{width:100%;max-width:440px}
          figure{width:100%}}</style><h1>Shared iPhone background comparisons</h1>
          <p>Simulator captures are on the left; the checked-in board renders on the right.
          Open this file after extracting the complete artifact. The board is interactive;
          its optional web orb renderer needs network access.</p>''' + "".join(sections) + "</html>")
          PY
      - name: Upload iOS screenshots
        id: screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-screenshots-pr-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-screenshots/
          if-no-files-found: error
          retention-days: 14
      - name: Post or update screenshot comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ARTIFACT_URL: ${{ steps.screenshots.outputs.artifact-url }}
          BOARD_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/docs/ios/design/surfaces.html
        run: |
          set -euo pipefail
          marker='<!-- ios-screenshot-review -->'
          comment_file="$RUNNER_TEMP/ios-screenshot-comment.md"
          payload_file="$RUNNER_TEMP/ios-screenshot-comment.json"
          cat > "$comment_file" <<EOF
          $marker
          ### iOS simulator screenshots

          [Download light/dark screenshots, Chat plus menu, open-sidebar, notifications, Factory, Health, Voice states, voice Lock Screen screenshots, Lock Screen task/approval previews, and board comparisons]($ARTIFACT_URL)

          Voice screenshots use Simulator-only synthetic sessions (no microphone, sign-in, or network).
          Compare \`voice-lock-listening-en.png\` beside \`voice-approved-board.png\`.
          Danish/English Listening, Speaking and Muted states are included. Screenshot capture
          does not verify Lock Screen button dispatch or real background audio.

          Compare Health Track workout, New lift, and empty states (Danish/English, light/dark)
          with the [approved Health board](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_HEAD_REF/docs/ios/design/board.html).
          Voice uses explicitly synthetic listening, thinking, and speaking states
          (six PNGs: light and dark), not a live microphone or transport session.
          Compare beside the [approved Voice board](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/ios/design/board.html)
          and [approved surfaces](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/ios/design/surfaces.html).
          Extract the artifact and open \`comparisons.html\` for Chat, Voice, Notifications
          (Needs you sheet), Factory, Settings, Notes, Health, and sidebar in both appearances.
          The artifact also includes Danish/English Voice connection-loss captures;
          compare them with the approved Connection lost surface on the board:
          [$BOARD_URL]($BOARD_URL). Each simulator capture sits next to its checked-in board render.

          Captured on $IOS_SIMULATOR_NAME. Screenshots are retained for 14 days.
          EOF
          jq -n --rawfile body "$comment_file" '{body: $body}' > "$payload_file"
          comment_id="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            | jq -r --arg marker "$marker" '[.[][] | select(.user.login == "github-actions[bot]" and ((.body // "") | contains($marker))) | .id] | last // empty')"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH --input "$payload_file" \
              "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id"
          else
            gh api --method POST --input "$payload_file" \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
          fi
      - name: Shut down iPhone Simulator
        if: always()
        run: |
          if [[ -n "${IOS_SIMULATOR_UDID:-}" ]]; then
            xcrun simctl shutdown "$IOS_SIMULATOR_UDID"
          fi
