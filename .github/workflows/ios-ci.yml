name: iOS CI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  proof:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app
      - name: Install pinned XcodeGen
        run: |
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Exercise the drawer with native finger drags
        working-directory: apps/ios
        run: |
          set -euo pipefail
          xcodegen generate
          phone=$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone") and contains("Pro"))][0].udid')
          xcrun simctl boot "$phone" || true
          xcodebuild -quiet -project Jarvis.xcodeproj -scheme Jarvis -destination "platform=iOS Simulator,id=$phone" -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/Swipe.xcresult" CODE_SIGNING_ALLOWED=NO test
      - name: Native test evidence
        if: always()
        run: xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/Swipe.xcresult"
