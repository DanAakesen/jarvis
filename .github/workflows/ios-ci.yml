name: Retained iOS evidence extraction
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ios-screenshots-pr-1621-1
          run-id: 42243718420
          github-token: ${{ github.token }}
          path: retained
      - name: Index retained evidence (no build or simulator)
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib,json,shutil
          root=Path('retained'); out=Path('review'); out.mkdir()
          manifest=next(root.rglob('ui-test-attachments/manifest.json'))
          chosen=[]
          for test in json.loads(manifest.read_text()):
              if not any(key in test['testIdentifier'] for key in ['GalleryShowsEveryShared','HealthPeriods','SharedPagesAtAccessibility']):continue
              chosen.append(test)
              for item in test['attachments']:
                  p=manifest.parent/item['exportedFileName'];dst=out/p.relative_to(root)
                  dst.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,dst)
          (out/'selected-manifest.json').write_text(json.dumps(chosen))
          print('Retained source run 42243718420; copied',sum(p.stat().st_size for p in out.rglob('*') if p.is_file()),'bytes')
          PYCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: retained-7acb-failed-test-evidence
          path: review
          retention-days: 14
