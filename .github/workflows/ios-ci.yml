# Validation-only branch: never merge this focused workflow.
name: P15 focused widget and activity verification
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  TASK_SOURCE_SHA: 872f35031cc5551dcb9e9637854bd800218433d8
  TASK_IOS_TREE: e73d789af3046dbdcde2af714223a8f28f1dc34a
jobs:
  gallery:
    name: Verify Settings and Chat owner feedback
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TASK_SOURCE_SHA }}
          fetch-depth: 0
      - name: Verify exact source and affected Settings/Chat paths
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TASK_SOURCE_SHA"
          test "$(git rev-parse HEAD:apps/ios)" = "$TASK_IOS_TREE"
          mkdir -p "$RUNNER_TEMP/gallery-evidence"
          python3 - <<'PYCODE'
          import json, os, pathlib, subprocess
          git = lambda value: subprocess.check_output(["git", "rev-parse", value], text=True).strip()
          allowed = ['apps/ios/Jarvis/ChatDictation.swift', 'apps/ios/Jarvis/ChatMarkdownBlock.swift', 'apps/ios/Jarvis/JarvisChatFeedbackFixtureTransport.swift', 'apps/ios/Jarvis/JarvisChatModel.swift', 'apps/ios/Jarvis/JarvisChatScreen.swift', 'apps/ios/Jarvis/JarvisFixtureScenario.swift', 'apps/ios/Jarvis/JarvisHealthGoalsSettingsView.swift', 'apps/ios/Jarvis/JarvisRuntimeTestSheet.swift', 'apps/ios/Jarvis/JarvisSelectableReply.swift', 'apps/ios/Jarvis/JarvisSettingsDeploymentViews.swift', 'apps/ios/Jarvis/JarvisSettingsEditorView.swift', 'apps/ios/Jarvis/JarvisSettingsFixtureTransport.swift', 'apps/ios/Jarvis/JarvisSettingsResourceViews.swift', 'apps/ios/Jarvis/JarvisSettingsTextField.swift', 'apps/ios/Jarvis/JarvisTodayScreen.swift', 'apps/ios/Jarvis/WorkspaceRuntime.swift', 'apps/ios/JarvisUITests/ChatComposerUITests.swift', 'apps/ios/JarvisUITests/ChatPresentationUITests.swift', 'apps/ios/JarvisUITests/ChatTurnFeedbackUITests.swift', 'apps/ios/JarvisUITests/SettingsFieldUITests.swift', 'apps/ios/JarvisUITests/TodayUITests.swift', 'apps/ios/Packages/JarvisCore/Sources/JarvisCore/Chat/ChatModels.swift', 'apps/ios/Packages/JarvisCore/Sources/JarvisCore/Chat/ChatToolActivity.swift', 'apps/ios/Packages/JarvisCore/Sources/JarvisCore/Chat/ChatToolPlacement.swift', 'apps/ios/Packages/JarvisCore/Sources/JarvisCore/Chat/DictationSession.swift', 'apps/ios/Packages/JarvisCore/Sources/JarvisCore/Chat/JarvisChatClient.swift', 'apps/ios/Packages/JarvisCore/Sources/JarvisCore/Chat/JarvisChatLocalization.swift', 'apps/ios/Packages/JarvisCore/Sources/JarvisCore/Resources/da.lproj/JarvisChat.strings', 'apps/ios/Packages/JarvisCore/Sources/JarvisCore/Resources/en.lproj/JarvisChat.strings', 'apps/ios/Packages/JarvisCore/Sources/JarvisCore/Workspace/JarvisWorkspaceClient.swift', 'apps/ios/Packages/JarvisCore/Sources/JarvisCore/Workspace/WorkspaceModels.swift', 'apps/ios/Packages/JarvisCore/Tests/JarvisCoreTests/ChatToolPlacementTests.swift', 'apps/ios/Packages/JarvisCore/Tests/JarvisCoreTests/DictationSessionTests.swift', 'apps/ios/Packages/JarvisCore/Tests/JarvisCoreTests/JarvisChatClientTests.swift', 'apps/ios/Packages/JarvisCore/Tests/JarvisCoreTests/JarvisWorkspaceClientTests.swift']
          changed = subprocess.check_output(["git", "diff", "--name-only", "e9aa204ba54df16c848cb715ee977ab8f8d227ce", "HEAD", "--", "apps/ios"], text=True).splitlines()
          assert sorted(changed) == sorted(allowed), changed
          evidence = {"source":git("HEAD"), "tree":git("HEAD^{tree}"), "ios_tree":git("HEAD:apps/ios"), "run":os.environ["GITHUB_RUN_ID"], "prior_native_runs":[42292434058,42302707513,42370022661], "selected_tests":['ChatComposerUITests', 'ChatPresentationUITests', 'ChatTurnFeedbackUITests', 'SettingsFieldUITests', 'TodayUITests/testTypingShowsSendAndSendOpensChatThenHomeReturns', 'TodayUITests/testHomeCameraChoiceOpensCaptureAfterNavigation', 'ComponentGalleryUITests/testSettingsSectionsSearchAndDetailsDarkEnglish', 'ComponentGalleryUITests/testSettingsSectionsSearchAndDetailsLightDanish', 'ComponentGalleryUITests/testSettingsAccessibilityTextKeepsSectionsAndRowsReachable'], "changed_ios_paths":changed, "unchanged_widget_sources":True, "empty_activity_capture_requires_recheck":True}
          pathlib.Path(os.environ["RUNNER_TEMP"], "gallery-evidence", "provenance.json").write_text(json.dumps(evidence, indent=2))
          PYCODE
      - name: Select pinned Xcode 26.6
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: Install pinned XcodeGen 2.46.0
        run: |
          curl --fail --location --silent --show-error https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip --output "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/SourcePackages
          key: ios-spm-${{ runner.os }}-${{ hashFiles('apps/ios/project.yml', 'apps/ios/Packages/JarvisCore/Package.swift') }}
      - name: Build the exact candidate for Simulator
        working-directory: apps/ios
        run: |
          xcodegen generate
          xcodebuild -project Jarvis.xcodeproj -scheme Jarvis -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO build
      - name: Run the gallery with unchanged per-test limits
        id: gallery
        continue-on-error: true
        run: |
          set -euo pipefail
          TASK_DEVICE_ID="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty')"
          test -n "$TASK_DEVICE_ID"
          xcrun simctl boot "$TASK_DEVICE_ID"
          xcrun simctl bootstatus "$TASK_DEVICE_ID" -b
          xcrun simctl status_bar "$TASK_DEVICE_ID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl install "$TASK_DEVICE_ID" "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/Jarvis.app"
          xcodebuild test -project apps/ios/Jarvis.xcodeproj -scheme Jarvis -destination "id=$TASK_DEVICE_ID" -derivedDataPath "$RUNNER_TEMP/DerivedData" -resultBundlePath "$RUNNER_TEMP/gallery-evidence/gallery.xcresult" -only-testing:JarvisUITests/ChatComposerUITests -only-testing:JarvisUITests/ChatPresentationUITests -only-testing:JarvisUITests/ChatTurnFeedbackUITests -only-testing:JarvisUITests/SettingsFieldUITests -only-testing:JarvisUITests/TodayUITests/testTypingShowsSendAndSendOpensChatThenHomeReturns -only-testing:JarvisUITests/TodayUITests/testHomeCameraChoiceOpensCaptureAfterNavigation -only-testing:JarvisUITests/ComponentGalleryUITests/testSettingsSectionsSearchAndDetailsDarkEnglish -only-testing:JarvisUITests/ComponentGalleryUITests/testSettingsSectionsSearchAndDetailsLightDanish -only-testing:JarvisUITests/ComponentGalleryUITests/testSettingsAccessibilityTextKeepsSectionsAndRowsReachable -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 150 CODE_SIGNING_ALLOWED=NO
      - name: Export actual native attachments
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/gallery-evidence/gallery.xcresult" ]]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/gallery-evidence/gallery.xcresult" --output-path "$RUNNER_TEMP/gallery-evidence/attachments"
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/gallery-evidence/gallery.xcresult" > "$RUNNER_TEMP/gallery-evidence/summary.json"
          fi
      - name: Retain focused results and source proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: p15-widget-contrast-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gallery-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Require the selected test to pass
        if: always() && steps.gallery.outcome != 'success'
        run: exit 1
