# Validation-only branch: never merge this focused workflow.
name: P15 focused Home qualification
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  TASK_SOURCE_SHA: c4e141551c35c2d6c4c6895112cf1b6ade54f8f7
  TASK_IOS_TREE: 169764ccd98da54bbe309ef0766cba9da65df004
jobs:
  gallery:
    name: Verify Home and widget navigation
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TASK_SOURCE_SHA }}
          fetch-depth: 0
      - name: Verify exact source and unaffected page coverage
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TASK_SOURCE_SHA"
          test "$(git rev-parse HEAD:apps/ios)" = "$TASK_IOS_TREE"
          git diff --exit-code 223f966aaa22e4df75932b0e9776d07583844782 HEAD -- apps/ios ':!apps/ios/Jarvis/JarvisTodayScreen.swift' ':!apps/ios/Jarvis/JarvisTodayActivityCard.swift' ':!apps/ios/Jarvis/JarvisControls.swift' ':!apps/ios/JarvisUITests/TodayUITests.swift'
          mkdir -p "$RUNNER_TEMP/home-evidence"
          python3 - <<'PYCODE'
          import json, os, pathlib, subprocess, re
          git = lambda value: subprocess.check_output(["git", "rev-parse", value], text=True).strip()
          old = subprocess.check_output(["git", "show", "223f966aaa22e4df75932b0e9776d07583844782:apps/ios/Jarvis/JarvisControls.swift"], text=True)
          new = pathlib.Path("apps/ios/Jarvis/JarvisControls.swift").read_text()
          pattern = r"struct JarvisTileButton: View \{.*?\n\}\n(?=\n/// One entry)"
          assert re.search(pattern, old, re.S) and re.search(pattern, new, re.S)
          assert re.sub(pattern, "", old, flags=re.S) == re.sub(pattern, "", new, flags=re.S)
          uses = [str(p) for p in pathlib.Path("apps/ios/Jarvis").glob("*.swift") if "JarvisTileButton(" in p.read_text()]
          assert uses == ["apps/ios/Jarvis/JarvisTodayScreen.swift"], uses
          evidence = {"source":git("HEAD"), "tree":git("HEAD^{tree}"), "ios_tree":git("HEAD:apps/ios"), "run":os.environ["GITHUB_RUN_ID"], "reused_native_run":42292434058, "reused_passed_cases":55, "selected_tests":["TodayUITests", "SidebarNavigationTests/testWidgetLinksOpenTheirSectionsOnColdLaunch", "SidebarNavigationTests/testWidgetLinksNavigateAnAlreadyRunningApp"], "unchanged_source_proof":"All iOS source outside Home views and Home-only JarvisTileButton matches 223f966a"}
          pathlib.Path(os.environ["RUNNER_TEMP"], "home-evidence", "provenance.json").write_text(json.dumps(evidence, indent=2))
          PYCODE
      - name: Select pinned Xcode 26.6
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: Install pinned XcodeGen 2.46.0
        run: |
          curl --fail --location --silent --show-error https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip --output "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/SourcePackages
          key: ios-spm-${{ runner.os }}-${{ hashFiles('apps/ios/project.yml', 'apps/ios/Packages/JarvisCore/Package.swift') }}
      - name: Build the exact candidate for Simulator
        working-directory: apps/ios
        run: |
          xcodegen generate
          xcodebuild -project Jarvis.xcodeproj -scheme Jarvis -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO build
      - name: Run Home and widget links with unchanged per-test limits
        id: gallery
        continue-on-error: true
        run: |
          set -euo pipefail
          TASK_DEVICE_ID="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty')"
          test -n "$TASK_DEVICE_ID"
          xcrun simctl boot "$TASK_DEVICE_ID"
          xcrun simctl bootstatus "$TASK_DEVICE_ID" -b
          xcrun simctl status_bar "$TASK_DEVICE_ID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl install "$TASK_DEVICE_ID" "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/Jarvis.app"
          xcodebuild test -project apps/ios/Jarvis.xcodeproj -scheme Jarvis -destination "id=$TASK_DEVICE_ID" -derivedDataPath "$RUNNER_TEMP/DerivedData" -resultBundlePath "$RUNNER_TEMP/home-evidence/home.xcresult" -only-testing:JarvisUITests/TodayUITests -only-testing:JarvisUITests/SidebarNavigationTests/testWidgetLinksOpenTheirSectionsOnColdLaunch -only-testing:JarvisUITests/SidebarNavigationTests/testWidgetLinksNavigateAnAlreadyRunningApp -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 150 CODE_SIGNING_ALLOWED=NO
      - name: Export actual native attachments
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/home-evidence/home.xcresult" ]]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/home-evidence/home.xcresult" --output-path "$RUNNER_TEMP/home-evidence/attachments"
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/home-evidence/home.xcresult" > "$RUNNER_TEMP/home-evidence/summary.json"
          fi
      - name: Retain focused results and source proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: p15-home-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/home-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Require the selected test to pass
        if: always() && steps.gallery.outcome != 'success'
        run: exit 1
