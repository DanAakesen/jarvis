# Prepares the Copilot cloud agent's environment before it starts work (P0-14):
# pinned Node.js, npm and Python, then dependencies from the committed lockfiles
# through the shared scripts/setup-dependencies.sh. Lint and tests stay with the
# agent and CI. Runs as a normal workflow when its inputs change, and manually.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - scripts/setup-dependencies.sh
      - .nvmrc
      - .python-version
      - package.json
      - package-lock.json
      - runner/requirements*.txt
      - agents/jarvis/requirements*.txt
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - scripts/setup-dependencies.sh
      - .nvmrc
      - .python-version
      - package.json
      - package-lock.json
      - runner/requirements*.txt
      - agents/jarvis/requirements*.txt

jobs:
  # The job must be called copilot-setup-steps for Copilot to use it.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    # Copilot uses this as the limit for its whole session, not only setup (maximum 59).
    # 20 cancelled P5-01 (#114) during GitHub's post-session checks.
    timeout-minutes: 59
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Install pinned npm and dependencies
        run: bash scripts/setup-dependencies.sh
