# Prepares the Copilot cloud agent's environment before it starts work (P0-14):
# pinned Node.js, npm and Python, then dependencies from the committed lockfiles
# through the shared scripts/setup-dependencies.sh. Lint and tests stay with the
# agent and CI. Runs as a normal workflow when its inputs change, and manually.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - scripts/setup-dependencies.sh
      - .nvmrc
      - .python-version
      - package.json
      - package-lock.json
      - runner/requirements*.txt
      - agents/jarvis/requirements*.txt
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - scripts/setup-dependencies.sh
      - .nvmrc
      - .python-version
      - package.json
      - package-lock.json
      - runner/requirements*.txt
      - agents/jarvis/requirements*.txt

jobs:
  # The job must be called copilot-setup-steps for Copilot to use it.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    # Copilot uses this as the limit for its whole session, not only setup (maximum 59).
    # 20 cancelled P5-01 (#114) during GitHub's post-session checks.
    timeout-minutes: 59
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.2"
      - name: Install pinned npm and dependencies
        run: bash scripts/setup-dependencies.sh
