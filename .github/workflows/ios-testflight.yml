name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build; must match the selected workflow branch
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload to TestFlight
    environment: ios-testflight
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Validate dispatch branch
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          if [[ ! "$INPUT_BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] \
            || ! git check-ref-format --branch "$INPUT_BRANCH" >/dev/null 2>&1; then
            echo "::error::The branch input is invalid."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/$INPUT_BRANCH" ]]; then
            echo "::error::Select the same branch in the workflow ref picker and branch input."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
      - name: Check signing configuration
        env:
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          JARVIS_API_BASE_URL: ${{ secrets.JARVIS_API_BASE_URL }}
          JARVIS_ENTRA_CLIENT_ID: ${{ secrets.JARVIS_ENTRA_CLIENT_ID }}
          JARVIS_ENTRA_AUTHORITY_URL: ${{ secrets.JARVIS_ENTRA_AUTHORITY_URL }}
          JARVIS_ENTRA_API_SCOPE: ${{ secrets.JARVIS_ENTRA_API_SCOPE }}
        run: |
          for name in \
            APP_STORE_CONNECT_KEY_P8 \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APPLE_TEAM_ID \
            JARVIS_API_BASE_URL \
            JARVIS_ENTRA_CLIENT_ID \
            JARVIS_ENTRA_AUTHORITY_URL \
            JARVIS_ENTRA_API_SCOPE; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required environment value: $name"
              exit 1
            fi
          done
      - name: Select pinned Xcode 26.6
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: Install pinned XcodeGen 2.46.0
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" \
            | shasum --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version
      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Write App Store Connect key
        env:
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          umask 077
          printf '%s' "$APP_STORE_CONNECT_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
      - name: Prepare run-owned development signing
        timeout-minutes: 5
        env:
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          umask 077
          signing_passphrase="$(openssl rand -hex 32)"
          TESTFLIGHT_SIGNING_PASSPHRASE="$signing_passphrase" \
            ruby .github/scripts/testflight_certificate_cleanup.rb prepare "$RUNNER_TEMP/testflight-signing"
          if ! (
            KEYCHAIN="$RUNNER_TEMP/testflight-signing/signing.keychain-db"
            security create-keychain -p "$signing_passphrase" "$KEYCHAIN" &&
            security set-keychain-settings -lut 21600 "$KEYCHAIN" &&
            security unlock-keychain -p "$signing_passphrase" "$KEYCHAIN" &&
            security import "$RUNNER_TEMP/testflight-signing/identity.p12" \
              -k "$KEYCHAIN" -P "$signing_passphrase" -T /usr/bin/codesign -T /usr/bin/security &&
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$signing_passphrase" "$KEYCHAIN" &&
            security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          ) > "$RUNNER_TEMP/signing.log" 2>&1; then
            echo "::error::Temporary signing keychain setup failed; private diagnostics withheld."
            exit 1
          fi
      - name: Archive with automatic signing
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          JARVIS_API_BASE_URL: ${{ secrets.JARVIS_API_BASE_URL }}
          JARVIS_ENTRA_CLIENT_ID: ${{ secrets.JARVIS_ENTRA_CLIENT_ID }}
          JARVIS_ENTRA_AUTHORITY_URL: ${{ secrets.JARVIS_ENTRA_AUTHORITY_URL }}
          JARVIS_ENTRA_API_SCOPE: ${{ secrets.JARVIS_ENTRA_API_SCOPE }}
        run: |
          umask 077
          if ! xcodebuild \
            -project apps/ios/Jarvis.xcodeproj \
            -scheme Jarvis \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Jarvis.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="$(cat "$RUNNER_TEMP/testflight-signing/identity")" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            JARVIS_API_BASE_URL="$JARVIS_API_BASE_URL" \
            JARVIS_ENTRA_CLIENT_ID="$JARVIS_ENTRA_CLIENT_ID" \
            JARVIS_ENTRA_AUTHORITY_URL="$JARVIS_ENTRA_AUTHORITY_URL" \
            JARVIS_ENTRA_API_SCOPE="$JARVIS_ENTRA_API_SCOPE" \
            archive > "$RUNNER_TEMP/archive.log" 2>&1; then
            echo "::error::Archive failed. Check source qualification, signing quota, and iPhone/Watch capabilities. Private Xcode diagnostics withheld."
            exit 1
          fi
      - name: Prepare export options
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import plistlib

          options = plistlib.loads(Path("apps/ios/ExportOptions.plist").read_bytes())
          if options.get("teamID") != "__APPLE_TEAM_ID__":
              raise SystemExit("Export options team placeholder is missing.")
          options["teamID"] = os.environ["APPLE_TEAM_ID"]
          path = Path(os.environ["RUNNER_TEMP"]) / "ExportOptions.plist"
          descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(descriptor, "wb") as stream:
              plistlib.dump(options, stream, fmt=plistlib.FMT_XML)
          PY
      - name: Export and upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          umask 077
          if ! xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Jarvis.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            > "$RUNNER_TEMP/export.log" 2>&1; then
            echo "::error::Export or upload failed. Check App Store Connect permissions, distribution signing, and iPhone/Watch profiles. Private Xcode diagnostics withheld."
            exit 1
          fi
      - name: Add preview build notes
        if: github.ref != 'refs/heads/main'
        run: |
          {
            echo "## Preview build"
            echo
            echo "Branch: \`$GITHUB_REF_NAME\`"
            echo "Commit: \`$GITHUB_SHA\`"
            echo
            echo "This TestFlight build is a preview; it does not create a release tag."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Revoke only run-owned development certificates
        if: always()
        timeout-minutes: 5
        env:
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: ruby .github/scripts/testflight_certificate_cleanup.rb cleanup "$RUNNER_TEMP/testflight-signing"
      - name: Delete App Store Connect key
        if: always()
        run: |
          status=0
          KEYCHAIN="$RUNNER_TEMP/testflight-signing/signing.keychain-db"
          if [[ -f "$KEYCHAIN" ]]; then
            security delete-keychain "$KEYCHAIN" > /dev/null 2>&1 || status=1
          fi
          rm -rf "$RUNNER_TEMP/testflight-signing"
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/signing.log" \
            "$RUNNER_TEMP/archive.log" "$RUNNER_TEMP/export.log" "$RUNNER_TEMP/ExportOptions.plist"
          if [[ "$status" != 0 ]]; then
            echo "::error::Temporary signing keychain deletion failed."
            exit 1
          fi
