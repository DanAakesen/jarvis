name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build; must match the selected workflow branch
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload to TestFlight
    environment: ios-testflight
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Validate dispatch branch
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          if [[ ! "$INPUT_BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] \
            || ! git check-ref-format --branch "$INPUT_BRANCH" >/dev/null 2>&1; then
            echo "::error::The branch input is invalid."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/$INPUT_BRANCH" ]]; then
            echo "::error::Select the same branch in the workflow ref picker and branch input."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
      - name: Check signing configuration
        env:
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          JARVIS_API_BASE_URL: ${{ secrets.JARVIS_API_BASE_URL }}
          JARVIS_ENTRA_CLIENT_ID: ${{ secrets.JARVIS_ENTRA_CLIENT_ID }}
          JARVIS_ENTRA_AUTHORITY_URL: ${{ secrets.JARVIS_ENTRA_AUTHORITY_URL }}
          JARVIS_ENTRA_API_SCOPE: ${{ secrets.JARVIS_ENTRA_API_SCOPE }}
        run: |
          for name in \
            APP_STORE_CONNECT_KEY_P8 \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APPLE_TEAM_ID \
            JARVIS_API_BASE_URL \
            JARVIS_ENTRA_CLIENT_ID \
            JARVIS_ENTRA_AUTHORITY_URL \
            JARVIS_ENTRA_API_SCOPE; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required environment value: $name"
              exit 1
            fi
          done
      - name: Select pinned Xcode 26.6
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: Install pinned XcodeGen 2.46.0
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" \
            | shasum --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version
      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Write App Store Connect key
        env:
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          umask 077
          printf '%s' "$APP_STORE_CONNECT_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive with automatic signing
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          JARVIS_API_BASE_URL: ${{ secrets.JARVIS_API_BASE_URL }}
          JARVIS_ENTRA_CLIENT_ID: ${{ secrets.JARVIS_ENTRA_CLIENT_ID }}
          JARVIS_ENTRA_AUTHORITY_URL: ${{ secrets.JARVIS_ENTRA_AUTHORITY_URL }}
          JARVIS_ENTRA_API_SCOPE: ${{ secrets.JARVIS_ENTRA_API_SCOPE }}
        run: |
          if ! xcodebuild \
            -project apps/ios/Jarvis.xcodeproj \
            -scheme Jarvis \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Jarvis.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            JARVIS_API_BASE_URL="$JARVIS_API_BASE_URL" \
            JARVIS_ENTRA_CLIENT_ID="$JARVIS_ENTRA_CLIENT_ID" \
            JARVIS_ENTRA_AUTHORITY_URL="$JARVIS_ENTRA_AUTHORITY_URL" \
            JARVIS_ENTRA_API_SCOPE="$JARVIS_ENTRA_API_SCOPE" \
            archive > "$RUNNER_TEMP/archive.log" 2>&1; then
            echo "::error::Archive failed. A sanitised excerpt of the log follows; identifiers are masked."
            grep -E -i -e 'error:' -e 'Provisioning profile' -e 'No profile' \
              -e 'requires a development team' -e 'Communication with Apple' \
              -e 'No Accounts' -e 'not registered' -e 'No signing certificate' \
              -e 'Automatic signing' -e 'entitlement' -e 'capabilit' \
              -e 'App Store Connect' -e 'authentication' -e 'not authorized' \
              -e 'bundle identifier' -e 'App ID' -e 'cloud signing' \
              "$RUNNER_TEMP/archive.log" \
              | sed -E \
                -e "s|${RUNNER_TEMP}[^[:space:]]*|<runner-temp>|g" \
                -e 's/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}/<guid>/g' \
                -e 's/[[:<:]][A-Z0-9]{10}[[:>:]]/<id>/g' \
                -e 's/%/%25/g' \
                -e 's/^[[:space:]]+//' \
              | awk '!seen[$0]++' \
              | head -n 40 \
              | while IFS= read -r line; do
                  echo "::error::${line}"
                done || true
            exit 1
          fi
      - name: Prepare export options
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import plistlib

          options = plistlib.loads(Path("apps/ios/ExportOptions.plist").read_bytes())
          if options.get("teamID") != "__APPLE_TEAM_ID__":
              raise SystemExit("Export options team placeholder is missing.")
          options["teamID"] = os.environ["APPLE_TEAM_ID"]
          path = Path(os.environ["RUNNER_TEMP"]) / "ExportOptions.plist"
          descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(descriptor, "wb") as stream:
              plistlib.dump(options, stream, fmt=plistlib.FMT_XML)
          PY
      - name: Export and upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if ! xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Jarvis.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            > "$RUNNER_TEMP/export.log" 2>&1; then
            echo "::error::Export or upload failed. A sanitised excerpt of the log follows; identifiers are masked."
            grep -E -i -e 'error' -e 'Provisioning profile' -e 'No profile' \
              -e 'Communication with Apple' -e 'No Accounts' -e 'No signing certificate' \
              -e 'distribution' -e 'entitlement' -e 'capabilit' -e 'App Store Connect' \
              -e 'authentication' -e 'not authorized' -e 'bundle identifier' \
              -e 'App ID' -e 'cloud signing' -e 'upload' -e 'validat' -e 'version' \
              "$RUNNER_TEMP/export.log" \
              | sed -E \
                -e "s|${RUNNER_TEMP}[^[:space:]]*|<runner-temp>|g" \
                -e 's/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}/<guid>/g' \
                -e 's/[[:<:]][A-Z0-9]{10}[[:>:]]/<id>/g' \
                -e 's/%/%25/g' \
                -e 's/^[[:space:]]+//' \
              | awk '!seen[$0]++' \
              | head -n 40 \
              | while IFS= read -r line; do
                  echo "::error::${line}"
                done || true
            exit 1
          fi
      - name: Add preview build notes
        if: github.ref != 'refs/heads/main'
        run: |
          {
            echo "## Preview build"
            echo
            echo "Branch: \`$GITHUB_REF_NAME\`"
            echo "Commit: \`$GITHUB_SHA\`"
            echo
            echo "This TestFlight build is a preview; it does not create a release tag."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Revoke development certificates
        if: always() && github.ref == 'refs/heads/main'
        timeout-minutes: 5
        env:
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: ruby .github/scripts/testflight_certificate_cleanup.rb
      - name: Delete App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
