name: iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload to TestFlight
    environment: ios-testflight
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::This workflow can only run from the main branch."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check signing configuration
        env:
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_BROADCAST_PROFILE_BASE64: ${{ secrets.IOS_BROADCAST_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          JARVIS_API_BASE_URL: ${{ secrets.JARVIS_API_BASE_URL }}
          JARVIS_ENTRA_CLIENT_ID: ${{ secrets.JARVIS_ENTRA_CLIENT_ID }}
          JARVIS_ENTRA_AUTHORITY_URL: ${{ secrets.JARVIS_ENTRA_AUTHORITY_URL }}
          JARVIS_ENTRA_API_SCOPE: ${{ secrets.JARVIS_ENTRA_API_SCOPE }}
        run: |
          for name in \
            APP_STORE_CONNECT_KEY_P8 \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            IOS_DISTRIBUTION_P12_BASE64 \
            IOS_DISTRIBUTION_P12_PASSWORD \
            IOS_APP_PROFILE_BASE64 \
            IOS_BROADCAST_PROFILE_BASE64 \
            APPLE_TEAM_ID \
            JARVIS_API_BASE_URL \
            JARVIS_ENTRA_CLIENT_ID \
            JARVIS_ENTRA_AUTHORITY_URL \
            JARVIS_ENTRA_API_SCOPE; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required environment value: $name"
              exit 1
            fi
          done
      - name: Select pinned Xcode 26.6
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: Install pinned XcodeGen 2.46.0
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" \
            | shasum --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version
      - name: Install reusable signing assets
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_BROADCAST_PROFILE_BASE64: ${{ secrets.IOS_BROADCAST_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          umask 077
          python3 - <<'PY'
          import base64
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          import plistlib
          import re
          import secrets
          import subprocess

          temp = Path(os.environ["RUNNER_TEMP"])
          keychain = temp / "testflight-signing.keychain-db"
          password = secrets.token_hex(32)

          def security(*args):
              return subprocess.run(
                  ["security", *args], check=True, capture_output=True
              ).stdout

          try:
              p12 = temp / "distribution.p12"
              p12.write_bytes(base64.b64decode(
                  os.environ["IOS_DISTRIBUTION_P12_BASE64"], validate=True
              ))
              security("create-keychain", "-p", password, str(keychain))
              security("set-keychain-settings", "-lut", "21600", str(keychain))
              security("unlock-keychain", "-p", password, str(keychain))
              security("import", str(p12), "-P",
                       os.environ["IOS_DISTRIBUTION_P12_PASSWORD"],
                       "-k", str(keychain), "-T", "/usr/bin/codesign",
                       "-T", "/usr/bin/security")
              security("set-key-partition-list", "-S", "apple-tool:,apple:",
                       "-s", "-k", password, str(keychain))
              security("list-keychains", "-d", "user", "-s", str(keychain),
                       str(Path.home() / "Library/Keychains/login.keychain-db"))
              profile_dir = (
                  Path.home() / "Library/Developer/Xcode/UserData/Provisioning Profiles"
              )
              profile_dir.mkdir(parents=True, exist_ok=True)
              profiles = {}
              targets = {}
              for target, variable, bundle in (
                  ("Jarvis", "IOS_APP_PROFILE_BASE64", "com.danaakesen.jarvis"),
                  ("JarvisBroadcast", "IOS_BROADCAST_PROFILE_BASE64",
                   "com.danaakesen.jarvis.broadcast"),
              ):
                  path = profile_dir / f"{target}-TestFlight.mobileprovision"
                  path.write_bytes(base64.b64decode(os.environ[variable], validate=True))
                  profile = plistlib.loads(security("cms", "-D", "-i", str(path)))
                  uuid = profile["UUID"]
                  team = os.environ["APPLE_TEAM_ID"]
                  if (
                      not re.fullmatch(
                          r"[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}", uuid
                      )
                      or profile["TeamIdentifier"] != [team]
                      or profile["Entitlements"]["application-identifier"]
                      != f"{team}.{bundle}"
                      or profile["ExpirationDate"].replace(tzinfo=timezone.utc)
                      <= datetime.now(timezone.utc)
                      or "ProvisionedDevices" in profile
                      or profile.get("ProvisionsAllDevices", False)
                      or profile["Entitlements"].get("get-task-allow", False)
                  ):
                      raise ValueError("Invalid App Store profile")
                  profiles[bundle] = uuid
                  targets[target] = {"settings": {"base": {
                      "CODE_SIGN_STYLE": "Manual",
                      "CODE_SIGN_IDENTITY": "Apple Distribution",
                      "PROVISIONING_PROFILE_SPECIFIER": uuid,
                      "DEVELOPMENT_TEAM": team,
                  }}}
              (temp / "signing-profiles.json").write_text(json.dumps(profiles))
              (temp / "signing-project.json").write_text(json.dumps({
                  "include": [str(Path("apps/ios/project.yml").resolve())],
                  "targets": targets,
              }))
          except Exception:
              raise SystemExit("::error::Signing setup failed. Check the stored distribution certificate, password and App Store profiles.") from None
          finally:
              (temp / "distribution.p12").unlink(missing_ok=True)
          PY
      - name: Generate Xcode project
        run: |
          xcodegen generate --spec "$RUNNER_TEMP/signing-project.json" --project apps/ios
      - name: Write App Store Connect key
        env:
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          umask 077
          printf '%s' "$APP_STORE_CONNECT_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive with manual signing
        env:
          JARVIS_API_BASE_URL: ${{ secrets.JARVIS_API_BASE_URL }}
          JARVIS_ENTRA_CLIENT_ID: ${{ secrets.JARVIS_ENTRA_CLIENT_ID }}
          JARVIS_ENTRA_AUTHORITY_URL: ${{ secrets.JARVIS_ENTRA_AUTHORITY_URL }}
          JARVIS_ENTRA_API_SCOPE: ${{ secrets.JARVIS_ENTRA_API_SCOPE }}
        run: |
          umask 077
          if ! xcodebuild \
            -project apps/ios/Jarvis.xcodeproj \
            -scheme Jarvis \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Jarvis.xcarchive" \
            -configuration Release \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            JARVIS_API_BASE_URL="$JARVIS_API_BASE_URL" \
            JARVIS_ENTRA_CLIENT_ID="$JARVIS_ENTRA_CLIENT_ID" \
            JARVIS_ENTRA_AUTHORITY_URL="$JARVIS_ENTRA_AUTHORITY_URL" \
            JARVIS_ENTRA_API_SCOPE="$JARVIS_ENTRA_API_SCOPE" \
            archive > "$RUNNER_TEMP/archive.log" 2>&1; then
            echo "::error::Archive failed. Check certificate/profile validity, entitlements and the iOS compile check. Raw signing logs are withheld."
            exit 1
          fi
      - name: Prepare export options
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import plistlib

          options = plistlib.loads(Path("apps/ios/ExportOptions.plist").read_bytes())
          if options.get("teamID") != "__APPLE_TEAM_ID__":
              raise SystemExit("Export options team placeholder is missing.")
          options["teamID"] = os.environ["APPLE_TEAM_ID"]
          options["provisioningProfiles"] = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "signing-profiles.json").read_text()
          )
          path = Path(os.environ["RUNNER_TEMP"]) / "ExportOptions.plist"
          descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(descriptor, "wb") as stream:
              plistlib.dump(options, stream, fmt=plistlib.FMT_XML)
          PY
      - name: Export and upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          umask 077
          if ! xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Jarvis.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            > "$RUNNER_TEMP/export.log" 2>&1; then
            echo "::error::Export or upload failed. Check signing assets, upload-key permissions and App Store Connect build/version status. Raw signing logs are withheld."
            exit 1
          fi
      - name: Delete temporary signing assets
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/testflight-signing.keychain-db" ]]; then
            if ! security delete-keychain "$RUNNER_TEMP/testflight-signing.keychain-db" >/dev/null 2>&1; then
              echo "::error::Temporary signing keychain cleanup failed."
              cleanup_failed=1
            fi
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/distribution.p12" \
            "$RUNNER_TEMP/signing-profiles.json" "$RUNNER_TEMP/signing-project.json" \
            "$RUNNER_TEMP/ExportOptions.plist" "$RUNNER_TEMP/archive.log" "$RUNNER_TEMP/export.log" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/Jarvis-TestFlight.mobileprovision" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/JarvisBroadcast-TestFlight.mobileprovision"
          exit "${cleanup_failed:-0}"
