name: Factory worker quota
on:
  workflow_dispatch:
    inputs:
      submit:
        description: Request only enough quota for the approved worker (otherwise inspect)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: jarvis-worker-quota
  cancel-in-progress: false
jobs:
  quota:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: .python-version
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Inspect or submit the approved quota request
        env:
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          args=()
          if [[ "$SUBMIT" == true ]]; then args+=(--submit); fi
          python .github/scripts/request_worker_quota.py --subscription "$SUBSCRIPTION_ID" --state "$RUNNER_TEMP/worker-quota.json" "${args[@]}"
      - name: Retain quota status without credentials
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: factory-worker-quota
          path: ${{ runner.temp }}/worker-quota.json
          if-no-files-found: warn
          retention-days: 14
