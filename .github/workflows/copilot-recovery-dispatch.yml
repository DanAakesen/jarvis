# Temporary primary-thread release dispatcher. Never merge.
name: Dispatch qualified Notes TestFlight
on:
  push:
    branches: [codex/copilot-recovery-dispatch]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: DanAakesen/jarvis
    steps:
      - name: Require the reviewed merge and passing qualification
        run: |
          test "$(gh api repos/DanAakesen/jarvis/git/ref/heads/main --jq .object.sha)" = "df813f348eae27961259c691b526eeadced9ea18"
          test "$(gh api repos/DanAakesen/jarvis/git/commits/df813f348eae27961259c691b526eeadced9ea18 --jq .tree.sha)" = "9cd04755573ea3d0e25c90d7f4157715ebcbe014"
          test "$(gh api repos/DanAakesen/jarvis/actions/runs/42511384320 --jq .head_sha)" = "2f0fd280d6f999dd01459e97e0f43e9e12882c3e"
          test "$(gh api repos/DanAakesen/jarvis/actions/runs/42511384320 --jq .conclusion)" = "success"
          test "$(gh api repos/DanAakesen/jarvis/actions/runs/42510119801 --jq .conclusion)" = "success"
      - name: Use the existing signed TestFlight workflow
        run: gh workflow run ios-testflight.yml --repo DanAakesen/jarvis --ref main -f branch=main
