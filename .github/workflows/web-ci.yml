name: Web CI

# Called by ci.yml (P0-10); it runs on PRs, main and workflow_dispatch.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: Web lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm
        run: npm install --global npm@10.9.9
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
