name: Web CI

# Called by ci.yml (P0-10); it runs on PRs, main and workflow_dispatch.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: Web lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm
        run: npm install --global npm@10.9.9
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
