name: Web CI

# Called by ci.yml (P0-10); it runs on PRs, main and workflow_dispatch.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: Web lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm
        run: npm install --global npm@10.9.9
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
