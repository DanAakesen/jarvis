name: Apple Watch build
on:
  pull_request:
    paths:
      - 'apps/ios/**'
      - '.github/workflows/watch-build.yml'
permissions:
  contents: read
concurrency:
  group: watch-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  watch:
    runs-on: macos-26
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app
      - name: Install pinned XcodeGen
        run: |
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Build watch app and complications without signing
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project Jarvis.xcodeproj -scheme JarvisWatch -destination 'generic/platform=watchOS Simulator' -derivedDataPath "$RUNNER_TEMP/WatchBuild" CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/watch-build.log"
          PHONE_ID="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | select(.name | contains("Pro")) | select(.name | contains("Max") | not)][0].udid // empty')"
          if [[ -n "$PHONE_ID" ]]; then xcrun simctl boot "$PHONE_ID" || true; fi
      - name: Compile release for physical Watch architectures
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild -project Jarvis.xcodeproj -scheme JarvisWatch -destination 'generic/platform=watchOS' -configuration Release -derivedDataPath "$RUNNER_TEMP/WatchDeviceBuild" CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/watch-device-build.log"
      - name: Capture isolated Watch previews
        # Screenshots are evidence, not a gate: a flaky simulator launch must not turn the build red.
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set -euo pipefail
          WATCH_ID="$(xcrun simctl list devices available --json | jq -r '[.devices | to_entries[] | select(.key | contains("watchOS-26-")) | .value[] | select(.name | contains("Apple Watch"))] | sort_by(.name | (capture("(?<mm>[0-9]+)mm").mm | tonumber) // 99) | .[0].udid // empty')"
          if [[ -z "$WATCH_ID" ]]; then
            echo "::warning::No Watch simulator is available; Watch screenshots were not captured."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/watch-screenshots"
          xcrun simctl boot "$WATCH_ID" || true
          xcrun simctl bootstatus "$WATCH_ID" -b
          xcrun simctl install "$WATCH_ID" "$RUNNER_TEMP/WatchBuild/Build/Products/Debug-watchsimulator/JarvisWatch.app"
          xcrun simctl launch "$WATCH_ID" com.danaakesen.jarvis.watchkitapp --watch-fixture
          sleep 3
          xcrun simctl io "$WATCH_ID" screenshot "$RUNNER_TEMP/watch-screenshots/home.png"
          xcrun simctl launch --terminate-running-process "$WATCH_ID" com.danaakesen.jarvis.watchkitapp --watch-fixture --watch-screen=chat
          sleep 2
          xcrun simctl io "$WATCH_ID" screenshot "$RUNNER_TEMP/watch-screenshots/chat.png"
          xcrun simctl launch --terminate-running-process "$WATCH_ID" com.danaakesen.jarvis.watchkitapp --watch-fixture --watch-screen=actions
          sleep 2
          xcrun simctl io "$WATCH_ID" screenshot "$RUNNER_TEMP/watch-screenshots/menu.png"
          xcrun simctl launch --terminate-running-process "$WATCH_ID" com.danaakesen.jarvis.watchkitapp --watch-fixture --watch-screen=chat --watch-chat-long
          sleep 2
          xcrun simctl io "$WATCH_ID" screenshot "$RUNNER_TEMP/watch-screenshots/chat-ready.png"
          xcrun simctl launch --terminate-running-process "$WATCH_ID" com.danaakesen.jarvis.watchkitapp --watch-fixture --watch-screen=chat --watch-chat-draft
          sleep 2
          xcrun simctl io "$WATCH_ID" screenshot "$RUNNER_TEMP/watch-screenshots/chat-draft.png"
          xcrun simctl launch --terminate-running-process "$WATCH_ID" com.danaakesen.jarvis.watchkitapp --watch-fixture --watch-screen=chat --watch-chat-long --watch-chat-reading
          sleep 3
          xcrun simctl io "$WATCH_ID" screenshot "$RUNNER_TEMP/watch-screenshots/chat-reading.png"
          for state in listening speaking muted; do
            xcrun simctl launch --terminate-running-process "$WATCH_ID" com.danaakesen.jarvis.watchkitapp --watch-fixture --watch-screen=chat --watch-voice-fixture=$state
            sleep 3
            xcrun simctl io "$WATCH_ID" screenshot "$RUNNER_TEMP/watch-screenshots/voice-$state.png"
          done
          xcrun simctl launch --terminate-running-process "$WATCH_ID" com.danaakesen.jarvis.watchkitapp --watch-fixture --watch-screen=health
          sleep 2
          xcrun simctl io "$WATCH_ID" screenshot "$RUNNER_TEMP/watch-screenshots/health.png"
          xcrun simctl launch --terminate-running-process "$WATCH_ID" com.danaakesen.jarvis.watchkitapp --watch-fixture --watch-screen=lifts
          sleep 2
          xcrun simctl io "$WATCH_ID" screenshot "$RUNNER_TEMP/watch-screenshots/lifts.png"
          xcrun simctl launch --terminate-running-process "$WATCH_ID" com.danaakesen.jarvis.watchkitapp --watch-fixture --watch-screen=new-lift
          sleep 2
          xcrun simctl io "$WATCH_ID" screenshot "$RUNNER_TEMP/watch-screenshots/new-lift.png"
          xcrun simctl launch --terminate-running-process "$WATCH_ID" com.danaakesen.jarvis.watchkitapp --watch-fixture --watch-screen=new-lift --watch-picker=reps
          sleep 2
          xcrun simctl io "$WATCH_ID" screenshot "$RUNNER_TEMP/watch-screenshots/reps-picker.png"
          xcrun simctl launch --terminate-running-process "$WATCH_ID" com.danaakesen.jarvis.watchkitapp --watch-fixture --watch-screen=new-task
          sleep 2
          xcrun simctl io "$WATCH_ID" screenshot "$RUNNER_TEMP/watch-screenshots/new-task.png"
          xcrun simctl launch --terminate-running-process "$WATCH_ID" com.danaakesen.jarvis.watchkitapp --watch-fixture --watch-screen=project
          sleep 2
          xcrun simctl io "$WATCH_ID" screenshot "$RUNNER_TEMP/watch-screenshots/project-tasks.png"
      - name: Build paired iPhone bridge without signing
        if: ${{ !cancelled() }}
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild -project Jarvis.xcodeproj -scheme Jarvis -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/PhoneBuild" CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/phone-build.log"
      - name: Capture iPhone opening screen
        if: ${{ !cancelled() }}
        # Screenshots are evidence, not a gate: a slow simulator must not turn the build red (the compile steps stay strict).
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set -euo pipefail
          PHONE_ID="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | select(.name | contains("Pro")) | select(.name | contains("Max") | not)][0].udid // empty')"
          if [[ -z "$PHONE_ID" ]]; then
            echo "::warning::No iPhone Pro simulator is available; iPhone screenshots were not captured."
            exit 0
          fi
          APP="$RUNNER_TEMP/PhoneBuild/Build/Products/Debug-iphonesimulator/Jarvis.app"
          OUT="$RUNNER_TEMP/iphone-screenshots"
          mkdir -p "$OUT"
          xcrun simctl boot "$PHONE_ID" || true
          xcrun simctl bootstatus "$PHONE_ID" -b
          xcrun simctl ui "$PHONE_ID" appearance dark
          xcrun simctl install "$PHONE_ID" "$APP"
          shot() { xcrun simctl io "$PHONE_ID" screenshot "$OUT/$1.png"; }
          # Opening screen, held on screen by the debug preview flag: several instants show the network moving.
          xcrun simctl launch --terminate-running-process "$PHONE_ID" com.danaakesen.jarvis --opening-preview
          xcrun simctl io "$PHONE_ID" recordVideo --codec=h264 "$OUT/opening.mp4" & RECORDING=$!
          sleep 3; shot opening-3s
          sleep 1.6; shot opening-5s
          sleep 1; kill -INT "$RECORDING"; wait "$RECORDING" || true

      - name: Capture measured opening progress
        if: ${{ !cancelled() }}
        # Screenshots are evidence, not a gate: a slow simulator must not turn the build red (the compile steps stay strict).
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set -euo pipefail
          PHONE_ID="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | select(.name | contains("Pro")) | select(.name | contains("Max") | not)][0].udid // empty')"
          if [[ -z "$PHONE_ID" ]]; then
            echo "::warning::No iPhone Pro simulator; skipping the measured screenshot."
            exit 0
          fi
          OUT="$RUNNER_TEMP/iphone-screenshots"
          mkdir -p "$OUT"
          shot() { xcrun simctl io "$PHONE_ID" screenshot "$OUT/$1.png"; }
          xcrun simctl launch --terminate-running-process "$PHONE_ID" \
            com.danaakesen.jarvis --opening-preview --opening-progress=0.4
          sleep 10; shot opening-measured

      - name: Capture iPhone orb gallery
        if: ${{ !cancelled() }}
        # Screenshots are evidence, not a gate: a slow simulator must not turn the build red (the compile steps stay strict).
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set -euo pipefail
          PHONE_ID="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | select(.name | contains("Pro")) | select(.name | contains("Max") | not)][0].udid // empty')"
          if [[ -z "$PHONE_ID" ]]; then
            echo "::warning::No iPhone Pro simulator; skipping orb-gallery screenshots."
            exit 0
          fi
          OUT="$RUNNER_TEMP/iphone-screenshots"
          mkdir -p "$OUT"
          shot() { xcrun simctl io "$PHONE_ID" screenshot "$OUT/$1.png"; }
          xcrun simctl launch --terminate-running-process "$PHONE_ID" \
            com.danaakesen.jarvis --component-gallery
          sleep 3; shot orb-gallery-3s
          sleep 2.7; shot orb-gallery-5s

      - name: Capture Home widget layouts
        if: ${{ !cancelled() }}
        # Screenshots are evidence, not a gate: a slow simulator must not turn the build red (the compile steps stay strict).
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set -euo pipefail
          PHONE_ID="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | select(.name | contains("Pro")) | select(.name | contains("Max") | not)][0].udid // empty')"
          if [[ -z "$PHONE_ID" ]]; then
            echo "::warning::No iPhone Pro simulator; skipping Home widget layouts."
            exit 0
          fi
          OUT="$RUNNER_TEMP/iphone-screenshots"
          mkdir -p "$OUT"
          shot() { xcrun simctl io "$PHONE_ID" screenshot "$OUT/$1.png"; }
          xcrun simctl launch --terminate-running-process "$PHONE_ID" \
            com.danaakesen.jarvis --widget-layout-gallery
          sleep 3; shot widget-gallery
          xcrun simctl terminate "$PHONE_ID" com.danaakesen.jarvis || true
      - name: Capture Notes redesign states
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 14
        run: |
          set -uo pipefail
          PHONE_ID="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | select(.name | contains("Pro")) | select(.name | contains("Max") | not)][0].udid // empty')"
          if [[ -z "$PHONE_ID" ]]; then
            echo "::warning::No iPhone Pro simulator; skipping Notes captures."
            exit 0
          fi
          OUT="$RUNNER_TEMP/iphone-screenshots"
          mkdir -p "$OUT"
          APP=com.danaakesen.jarvis
          xcrun simctl boot "$PHONE_ID" || true
          xcrun simctl bootstatus "$PHONE_ID" -b || true
          # Synthetic fixture data only: the navigation fixture, no network and no owner data.
          capture() {
            local name="$1"; shift
            xcrun simctl launch --terminate-running-process "$PHONE_ID" "$APP" \
              --ui-test-navigation --screenshot-screen=notes --ui-test-task-list-board "$@" || return 0
            sleep 9
            xcrun simctl io "$PHONE_ID" screenshot "$OUT/notes-$name.png" || true
          }
          xcrun simctl ui "$PHONE_ID" appearance dark
          xcrun simctl ui "$PHONE_ID" content_size large || true
          for state in notes folder tasks graph search reader new-note new-task new-folder folder-scope graph-list pins folders-manual folders-reorder task-detail; do
            capture "$state" --screenshot-notes-state="$state"
          done
          # Recovery states: a save that finds a newer version, and a save that fails.
          capture conflict --screenshot-notes-state=reader --screenshot-notes-open-editor --screenshot-notes-edit-save --ui-test-notes-save-conflict
          capture save-failed --screenshot-notes-state=reader --screenshot-notes-open-editor --screenshot-notes-edit-save --ui-test-notes-save-failure
          # Large text and light appearance on the busiest pages.
          xcrun simctl ui "$PHONE_ID" content_size accessibility-extra-large || true
          capture tasks-large-text --screenshot-notes-state=tasks
          capture notes-large-text --screenshot-notes-state=notes
          xcrun simctl ui "$PHONE_ID" content_size large || true
          xcrun simctl ui "$PHONE_ID" appearance light
          capture tasks-light --screenshot-notes-state=tasks
          xcrun simctl ui "$PHONE_ID" appearance dark
          xcrun simctl terminate "$PHONE_ID" "$APP" || true
      - name: Capture app polish states
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 14
        run: |
          set -uo pipefail
          PHONE_ID="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | select(.name | contains("Pro")) | select(.name | contains("Max") | not)][0].udid // empty')"
          if [[ -z "$PHONE_ID" ]]; then
            echo "::warning::No iPhone Pro simulator; skipping app polish captures."
            exit 0
          fi
          OUT="$RUNNER_TEMP/iphone-screenshots"
          mkdir -p "$OUT"
          APP=com.danaakesen.jarvis
          xcrun simctl boot "$PHONE_ID" || true
          xcrun simctl bootstatus "$PHONE_ID" -b || true
          # Synthetic fixture data only. Each page now carries the orb and glass list rows.
          polish() {
            local name="$1"; shift
            xcrun simctl launch --terminate-running-process "$PHONE_ID" "$APP" "$@" || return 0
            sleep 9
            xcrun simctl io "$PHONE_ID" screenshot "$OUT/polish-$name.png" || true
          }
          xcrun simctl ui "$PHONE_ID" appearance dark
          xcrun simctl ui "$PHONE_ID" content_size large || true
          NOTES=(--ui-test-navigation --screenshot-screen=notes --ui-test-task-list-board)
          polish graph-search "${NOTES[@]}" --screenshot-notes-state=graph-search
          polish notes-pinned "${NOTES[@]}" --screenshot-notes-state=pinned
          polish calendar-day --ui-test-navigation --screenshot-screen=calendar
          polish calendar-week --ui-test-navigation --screenshot-screen=calendar --screenshot-calendar-week
          polish today --ui-test-navigation --ui-test-today
          polish settings --screenshot-settings-fixture
          polish appearance --screenshot-settings-fixture --screenshot-surface-appearance
          polish health --screenshot-health-fixture
          polish sleep --screenshot-health-fixture --screenshot-health-card=sleep
          polish nutrition --screenshot-health-fixture --screenshot-health-card=nutrition
          polish chat-keyboard --screenshot-chat-fixture --screenshot-chat-keyboard
          polish chat-blocks --screenshot-chat-fixture --ui-test-chat-blocks
          VOICE=(--screenshot-chat-fixture --screenshot-voice-fixture --screenshot-voice-state=listening --screenshot-voice-panel)
          polish voice-panel "${VOICE[@]}"
          polish voice-panel-chart "${VOICE[@]}" --screenshot-voice-chart
          xcrun simctl ui "$PHONE_ID" appearance light
          polish voice-panel-fullscreen-light "${VOICE[@]}" --screenshot-voice-fullscreen
          polish notes-pinned-light "${NOTES[@]}" --screenshot-notes-state=pinned
          polish today-light --ui-test-navigation --ui-test-today
          xcrun simctl ui "$PHONE_ID" appearance dark
          xcrun simctl terminate "$PHONE_ID" "$APP" || true
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: watch-build-logs
          path: |
            ${{ runner.temp }}/watch-build.log
            ${{ runner.temp }}/watch-device-build.log
            ${{ runner.temp }}/phone-build.log
            ${{ runner.temp }}/watch-screenshots
            ${{ runner.temp }}/iphone-screenshots
