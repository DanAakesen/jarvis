name: Apple Watch build
on:
  pull_request:
    paths:
      - 'apps/ios/**'
      - '.github/workflows/watch-build.yml'
permissions:
  contents: read
concurrency:
  group: watch-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  watch:
    runs-on: macos-26
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app
      - name: Install pinned XcodeGen
        run: |
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Build watch app and complications without signing
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project Jarvis.xcodeproj -scheme JarvisWatch -destination 'generic/platform=watchOS Simulator' -derivedDataPath "$RUNNER_TEMP/WatchBuild" CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/watch-build.log"
          PHONE_ID="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | select(.name | contains("Pro")) | select(.name | contains("Max") | not)][0].udid // empty')"
          if [[ -n "$PHONE_ID" ]]; then xcrun simctl boot "$PHONE_ID" || true; fi
      - name: Compile release for physical Watch architectures
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild -project Jarvis.xcodeproj -scheme JarvisWatch -destination 'generic/platform=watchOS' -configuration Release -derivedDataPath "$RUNNER_TEMP/WatchDeviceBuild" CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/watch-device-build.log"
      - name: Capture isolated Watch previews
        timeout-minutes: 5
        run: |
          set -euo pipefail
          WATCH_ID="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | contains("Apple Watch")) | select(.name | contains("Ultra"))][0].udid // empty')"
          if [[ -z "$WATCH_ID" ]]; then
            echo "::warning::No Ultra simulator is available; Watch screenshots were not captured."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/watch-screenshots"
          xcrun simctl boot "$WATCH_ID" || true
          xcrun simctl bootstatus "$WATCH_ID" -b
          xcrun simctl install "$WATCH_ID" "$RUNNER_TEMP/WatchBuild/Build/Products/Debug-watchsimulator/JarvisWatch.app"
          xcrun simctl launch "$WATCH_ID" com.danaakesen.jarvis.watchkitapp --watch-fixture
          sleep 3
          xcrun simctl io "$WATCH_ID" screenshot "$RUNNER_TEMP/watch-screenshots/home.png"
          xcrun simctl launch --terminate-running-process "$WATCH_ID" com.danaakesen.jarvis.watchkitapp --watch-fixture --watch-screen=chat
          sleep 2
          xcrun simctl io "$WATCH_ID" screenshot "$RUNNER_TEMP/watch-screenshots/chat.png"
          xcrun simctl launch --terminate-running-process "$WATCH_ID" com.danaakesen.jarvis.watchkitapp --watch-fixture --watch-screen=health
          sleep 2
          xcrun simctl io "$WATCH_ID" screenshot "$RUNNER_TEMP/watch-screenshots/health.png"
          xcrun simctl launch --terminate-running-process "$WATCH_ID" com.danaakesen.jarvis.watchkitapp --watch-fixture --watch-screen=lifts
          sleep 2
          xcrun simctl io "$WATCH_ID" screenshot "$RUNNER_TEMP/watch-screenshots/lifts.png"
          xcrun simctl launch --terminate-running-process "$WATCH_ID" com.danaakesen.jarvis.watchkitapp --watch-fixture --watch-screen=new-lift
          sleep 2
          xcrun simctl io "$WATCH_ID" screenshot "$RUNNER_TEMP/watch-screenshots/new-lift.png"
          xcrun simctl launch --terminate-running-process "$WATCH_ID" com.danaakesen.jarvis.watchkitapp --watch-fixture --watch-screen=new-lift --watch-picker=reps
          sleep 2
          xcrun simctl io "$WATCH_ID" screenshot "$RUNNER_TEMP/watch-screenshots/reps-picker.png"
          xcrun simctl launch --terminate-running-process "$WATCH_ID" com.danaakesen.jarvis.watchkitapp --watch-fixture --watch-screen=new-task
          sleep 2
          xcrun simctl io "$WATCH_ID" screenshot "$RUNNER_TEMP/watch-screenshots/new-task.png"
          xcrun simctl launch --terminate-running-process "$WATCH_ID" com.danaakesen.jarvis.watchkitapp --watch-fixture --watch-screen=project
          sleep 2
          xcrun simctl io "$WATCH_ID" screenshot "$RUNNER_TEMP/watch-screenshots/project-tasks.png"
      - name: Build paired iPhone bridge without signing
        if: ${{ !cancelled() }}
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild -project Jarvis.xcodeproj -scheme Jarvis -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/PhoneBuild" CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/phone-build.log"
      - name: Capture iPhone opening screen
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: |
          set -euo pipefail
          PHONE_ID="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | select(.name | contains("Pro")) | select(.name | contains("Max") | not)][0].udid // empty')"
          if [[ -z "$PHONE_ID" ]]; then
            echo "::warning::No iPhone Pro simulator is available; iPhone screenshots were not captured."
            exit 0
          fi
          APP="$RUNNER_TEMP/PhoneBuild/Build/Products/Debug-iphonesimulator/Jarvis.app"
          OUT="$RUNNER_TEMP/iphone-screenshots"
          mkdir -p "$OUT"
          xcrun simctl boot "$PHONE_ID" || true
          xcrun simctl bootstatus "$PHONE_ID" -b
          xcrun simctl ui "$PHONE_ID" appearance dark
          xcrun simctl install "$PHONE_ID" "$APP"
          shot() { xcrun simctl io "$PHONE_ID" screenshot "$OUT/$1.png"; }
          # Opening screen, held on screen by the debug preview flag: several instants show the network moving.
          xcrun simctl launch --terminate-running-process "$PHONE_ID" com.danaakesen.jarvis --opening-preview
          xcrun simctl io "$PHONE_ID" recordVideo --codec=h264 "$OUT/opening.mp4" & RECORDING=$!
          sleep 3; shot opening-3s
          sleep 1.6; shot opening-5s
          sleep 1; kill -INT "$RECORDING"; wait "$RECORDING" || true

      - name: Capture measured opening progress
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: |
          set -euo pipefail
          PHONE_ID="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | select(.name | contains("Pro")) | select(.name | contains("Max") | not)][0].udid // empty')"
          if [[ -z "$PHONE_ID" ]]; then
            echo "::warning::No iPhone Pro simulator; skipping the measured screenshot."
            exit 0
          fi
          OUT="$RUNNER_TEMP/iphone-screenshots"
          mkdir -p "$OUT"
          shot() { xcrun simctl io "$PHONE_ID" screenshot "$OUT/$1.png"; }
          xcrun simctl launch --terminate-running-process "$PHONE_ID" \
            com.danaakesen.jarvis --opening-preview --opening-progress=0.4
          sleep 10; shot opening-measured

      - name: Capture iPhone orb gallery
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: |
          set -euo pipefail
          PHONE_ID="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | select(.name | contains("Pro")) | select(.name | contains("Max") | not)][0].udid // empty')"
          if [[ -z "$PHONE_ID" ]]; then
            echo "::warning::No iPhone Pro simulator; skipping orb-gallery screenshots."
            exit 0
          fi
          OUT="$RUNNER_TEMP/iphone-screenshots"
          mkdir -p "$OUT"
          shot() { xcrun simctl io "$PHONE_ID" screenshot "$OUT/$1.png"; }
          xcrun simctl launch --terminate-running-process "$PHONE_ID" \
            com.danaakesen.jarvis --component-gallery
          sleep 3; shot orb-gallery-3s
          sleep 2.7; shot orb-gallery-5s

      - name: Capture Home widget layouts
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: |
          set -euo pipefail
          PHONE_ID="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | select(.name | contains("Pro")) | select(.name | contains("Max") | not)][0].udid // empty')"
          if [[ -z "$PHONE_ID" ]]; then
            echo "::warning::No iPhone Pro simulator; skipping Home widget layouts."
            exit 0
          fi
          OUT="$RUNNER_TEMP/iphone-screenshots"
          mkdir -p "$OUT"
          shot() { xcrun simctl io "$PHONE_ID" screenshot "$OUT/$1.png"; }
          xcrun simctl launch --terminate-running-process "$PHONE_ID" \
            com.danaakesen.jarvis --widget-layout-gallery
          sleep 3; shot widget-gallery
          xcrun simctl terminate "$PHONE_ID" com.danaakesen.jarvis || true
      - name: Capture living neural background
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          PHONE_ID="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | select(.name | contains("Pro")) | select(.name | contains("Max") | not)][0].udid // empty')"
          if [[ -z "$PHONE_ID" ]]; then
            echo "::warning::No iPhone Pro simulator; skipping neural background screenshots."
            exit 0
          fi
          OUT="$RUNNER_TEMP/iphone-screenshots/neural"
          mkdir -p "$OUT"
          APP=com.danaakesen.jarvis
          shot() { xcrun simctl io "$PHONE_ID" screenshot "$OUT/$1.png"; }
          run() { xcrun simctl launch --terminate-running-process "$PHONE_ID" "$APP" "$@"; }
          # Voice: the three states, each at three instants so the signals are seen moving out and back.
          for state in listening thinking speaking; do
            run --screenshot-chat-fixture --screenshot-voice-fixture --screenshot-voice-state=$state
            sleep 3; shot voice-$state-a; sleep 0.7; shot voice-$state-b; sleep 0.7; shot voice-$state-c
          done
          # Chat: idle, then the working states over the message window.
          run --screenshot-chat-fixture
          sleep 3; shot chat-idle
          for state in thinking tool speaking listening; do
            run --screenshot-chat-fixture --screenshot-chat-state=$state
            sleep 3; shot chat-$state-a; sleep 0.7; shot chat-$state-b
          done
          # Calm screens (Settings, Health), dark and light, and a light chat.
          run --screenshot-settings-fixture
          sleep 3; shot calm-settings-dark
          run --screenshot-health-fixture
          sleep 3; shot calm-health-dark
          xcrun simctl ui "$PHONE_ID" appearance light
          run --screenshot-settings-fixture
          sleep 3; shot calm-settings-light
          run --screenshot-chat-fixture --screenshot-chat-state=thinking
          sleep 3; shot chat-thinking-light
          xcrun simctl ui "$PHONE_ID" appearance dark
          # The gate: Face ID failed, waiting, and sign-in. The background must stay in all of them.
          for gate in lock-failed lock-waiting sign-in; do
            run --screenshot-gate=$gate
            sleep 3; shot gate-$gate-a; sleep 0.7; shot gate-$gate-b
          done
          # The opening, held on screen, at three instants, with a short recording.
          run --opening-preview
          xcrun simctl io "$PHONE_ID" recordVideo --codec=h264 "$OUT/opening-neural.mp4" & RECORDING=$!
          sleep 3; shot opening-a; sleep 0.7; shot opening-b; sleep 0.7; shot opening-c; sleep 4
          kill -INT "$RECORDING"; wait "$RECORDING" || true
          # Voice thinking in motion.
          run --screenshot-chat-fixture --screenshot-voice-fixture --screenshot-voice-state=thinking
          xcrun simctl io "$PHONE_ID" recordVideo --codec=h264 "$OUT/voice-thinking.mp4" & RECORDING=$!
          sleep 8; kill -INT "$RECORDING"; wait "$RECORDING" || true
          xcrun simctl terminate "$PHONE_ID" "$APP" || true
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: watch-build-logs
          path: |
            ${{ runner.temp }}/watch-build.log
            ${{ runner.temp }}/watch-device-build.log
            ${{ runner.temp }}/phone-build.log
            ${{ runner.temp }}/watch-screenshots
            ${{ runner.temp }}/iphone-screenshots
