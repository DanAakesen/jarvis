name: Apple Watch build
on:
  pull_request:
    paths:
      - 'apps/ios/**'
      - '.github/workflows/watch-build.yml'
permissions:
  contents: read
concurrency:
  group: watch-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  watch:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Record exact integration head
        run: git rev-parse HEAD | tee "$RUNNER_TEMP/watch-head.txt"
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app
      - name: Install pinned XcodeGen
        run: |
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Build watch app and complications without signing
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project Jarvis.xcodeproj -scheme JarvisWatch -destination 'generic/platform=watchOS Simulator' -derivedDataPath "$RUNNER_TEMP/WatchBuild" CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/watch-build.log"
      - name: Compile release for physical Watch architectures
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild -project Jarvis.xcodeproj -scheme JarvisWatch -destination 'generic/platform=watchOS' -configuration Release -derivedDataPath "$RUNNER_TEMP/WatchDeviceBuild" CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/watch-device-build.log"
      - name: Boot and inspect isolated Watch simulator
        timeout-minutes: 4
        run: |
          set -euo pipefail
          WATCH_ID="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | contains("Apple Watch")) | select(.name | contains("Ultra"))][0].udid // empty')"
          test -n "$WATCH_ID" || { echo "::error::Ultra simulator required for capture"; exit 1; }
          echo "WATCH_ID=$WATCH_ID" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/watch-screenshots"
          xcrun simctl list devices available --json > "$RUNNER_TEMP/watch-screenshots/devices.json"
          if ! jq -e --arg id "$WATCH_ID" '.devices[][] | select(.udid == $id and .state == "Booted")' "$RUNNER_TEMP/watch-screenshots/devices.json" >/dev/null; then
            xcrun simctl boot "$WATCH_ID"
          fi
          xcrun simctl bootstatus "$WATCH_ID" -b
          APP="$RUNNER_TEMP/WatchBuild/Build/Products/Debug-watchsimulator/JarvisWatch.app"
          plutil -convert json -o "$RUNNER_TEMP/watch-screenshots/built-info.json" "$APP/Info.plist"
          jq -e '.WKApplication == true and any(.CFBundleURLTypes[].CFBundleURLSchemes[]; . == "jarvis-watch")' "$RUNNER_TEMP/watch-screenshots/built-info.json"
          xcrun simctl install "$WATCH_ID" "$APP"
          INSTALLED="$(xcrun simctl get_app_container "$WATCH_ID" com.danaakesen.jarvis.watchkitapp app)"
          plutil -convert json -o "$RUNNER_TEMP/watch-screenshots/installed-info.json" "$INSTALLED/Info.plist"
          cmp "$RUNNER_TEMP/watch-screenshots/built-info.json" "$RUNNER_TEMP/watch-screenshots/installed-info.json"
      - name: Capture intended Watch screens with fresh-process receipts
        timeout-minutes: 8
        run: |
          set -euo pipefail
          BUNDLE=com.danaakesen.jarvis.watchkitapp
          PREVIOUS_PID=""
          capture() {
            local device="$1" screen="$2" name="$3"; shift 3
            local container nonce output pid
            container="$(xcrun simctl get_app_container "$device" "$BUNDLE" data)"
            nonce="$(uuidgen)"
            if [[ -n "$PREVIOUS_PID" ]]; then
              xcrun simctl terminate "$device" "$BUNDLE"
              for attempt in {1..30}; do
                kill -0 "$PREVIOUS_PID" 2>/dev/null || break
                sleep 1
              done
              if kill -0 "$PREVIOUS_PID" 2>/dev/null; then
                echo "::error::Previous Watch process did not exit"
                return 1
              fi
            fi
            rm -f "$container/Documents/watch-capture.json"
            echo "Launching $name ($nonce)"
            output="$(xcrun simctl launch "$device" "$BUNDLE" --watch-fixture "--watch-screen=$screen" "--watch-capture-id=$nonce" "$@")"
            echo "$output"
            pid="${output##*: }"
            [[ "$pid" =~ ^[0-9]+$ ]] || { echo "::error::Missing launch PID"; return 1; }
            test "$pid" != "$PREVIOUS_PID" || { echo "::error::Simulator reused a stale process"; return 1; }
            PREVIOUS_PID="$pid"
            for attempt in {1..30}; do
              if [[ -f "$container/Documents/watch-capture.json" ]] &&
                jq -e --arg id "$nonce" --arg screen "$screen" --arg pid "$pid" '.captureID == $id and .screen == $screen and .pid == $pid' "$container/Documents/watch-capture.json" >/dev/null; then
                cp "$container/Documents/watch-capture.json" "$RUNNER_TEMP/watch-screenshots/$name.json"
                sleep 2 # Let the system launch transition settle after the destination appeared.
                xcrun simctl io "$device" screenshot "$RUNNER_TEMP/watch-screenshots/$name.png"
                return
              fi
              sleep 1
            done
            echo "::error::No fresh destination receipt for $name; refusing a launch-spinner capture"
            return 1
          }
          for SCREEN in dashboard actions chat health lifts new-lift new-task project tasks task-detail task-edit personal-new-task agenda body-fat notes home nutrition complications log-lift log-lift-complication; do
            capture "$WATCH_ID" "$SCREEN" "$SCREEN"
          done
          capture "$WATCH_ID" dashboard dashboard-workouts --watch-dashboard-section=workouts
          capture "$WATCH_ID" new-lift reps-picker --watch-picker=reps
          capture "$WATCH_ID" personal-new-task personal-new-task-manual --watch-task-mode=manual
          for STATE in saved missing uncertain deleted; do
            capture "$WATCH_ID" log-lift "log-lift-$STATE" "--watch-lift-state=$STATE"
          done
          xcrun simctl terminate "$WATCH_ID" "$BUNDLE"
          PREVIOUS_PID=""
          SMALL_WATCH_ID="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | contains("Apple Watch")) | select(.name | test("4[012]mm"))][0].udid // empty')"
          if [[ -n "$SMALL_WATCH_ID" ]]; then
            if ! xcrun simctl list devices available --json | jq -e --arg id "$SMALL_WATCH_ID" '.devices[][] | select(.udid == $id and .state == "Booted")' >/dev/null; then
              xcrun simctl boot "$SMALL_WATCH_ID"
            fi
            xcrun simctl bootstatus "$SMALL_WATCH_ID" -b
            xcrun simctl install "$SMALL_WATCH_ID" "$RUNNER_TEMP/WatchBuild/Build/Products/Debug-watchsimulator/JarvisWatch.app"
            for SCREEN in dashboard tasks personal-new-task log-lift; do
              capture "$SMALL_WATCH_ID" "$SCREEN" "small-$SCREEN"
            done
            xcrun simctl terminate "$SMALL_WATCH_ID" "$BUNDLE"
          else
            echo "::error::No 40–42 mm simulator; smaller-size capture remains unverified."
            exit 1
          fi
      - name: Verify external URL delivery separately from fixture navigation
        timeout-minutes: 4
        run: |
          set -euo pipefail
          BUNDLE=com.danaakesen.jarvis.watchkitapp
          CONTAINER="$(xcrun simctl get_app_container "$WATCH_ID" "$BUNDLE" data)"
          for ROUTE in tasks log-lift; do
            NONCE="$(uuidgen)"
            rm -f "$CONTAINER/Documents/watch-open-url.json" "$CONTAINER/Documents/watch-capture.json"
            OUTPUT="$(xcrun simctl launch "$WATCH_ID" "$BUNDLE" --watch-fixture "--watch-capture-id=$NONCE" "--watch-expect-url=jarvis-watch://$ROUTE")"
            echo "$OUTPUT"
            PID="${OUTPUT##*: }"
            [[ "$PID" =~ ^[0-9]+$ ]] || { echo "::error::Missing launch PID"; exit 1; }
            READY=false
            for ATTEMPT in {1..30}; do
              if [[ -f "$CONTAINER/Documents/watch-capture.json" ]] &&
                jq -e --arg id "$NONCE" --arg pid "$PID" '.captureID == $id and .screen == "dashboard" and .pid == $pid' "$CONTAINER/Documents/watch-capture.json" >/dev/null; then
                READY=true; break
              fi
              sleep 1
            done
            test "$READY" = true || { echo "::error::App startup not ready for external URL test"; exit 1; }
            rm "$CONTAINER/Documents/watch-capture.json"
            xcrun simctl openurl "$WATCH_ID" "jarvis-watch://$ROUTE"
            DELIVERED=false
            for ATTEMPT in {1..30}; do
              if [[ -f "$CONTAINER/Documents/watch-open-url.json" ]] &&
                jq -e --arg id "$NONCE" --arg url "jarvis-watch://$ROUTE" '.captureID == $id and .url == $url' "$CONTAINER/Documents/watch-open-url.json" >/dev/null &&
                [[ -f "$CONTAINER/Documents/watch-capture.json" ]] &&
                jq -e --arg id "$NONCE" --arg screen "$ROUTE" '.captureID == $id and .screen == $screen' "$CONTAINER/Documents/watch-capture.json" >/dev/null; then
                DELIVERED=true; break
              fi
              sleep 1
            done
            test "$DELIVERED" = true || { echo "::error::URL did not reach its destination"; exit 1; }
            cp "$CONTAINER/Documents/watch-open-url.json" "$RUNNER_TEMP/watch-screenshots/$ROUTE-open-url.json"
            sleep 2
            xcrun simctl io "$WATCH_ID" screenshot "$RUNNER_TEMP/watch-screenshots/$ROUTE-deep-link.png"
            xcrun simctl terminate "$WATCH_ID" "$BUNDLE"
            for ATTEMPT in {1..30}; do
              kill -0 "$PID" 2>/dev/null || break
              sleep 1
            done
            if kill -0 "$PID" 2>/dev/null; then
              echo "::error::Watch URL-test process did not exit"
              exit 1
            fi
          done
      - name: Preserve simulator failure diagnostics
        if: ${{ failure() && env.WATCH_ID != '' }}
        run: |
          xcrun simctl spawn "$WATCH_ID" log show --last 3m --style compact --predicate 'eventMessage CONTAINS "com.danaakesen.jarvis.watchkitapp"' > "$RUNNER_TEMP/watch-screenshots/simulator.log"
      - name: Build paired iPhone bridge without signing
        if: ${{ !cancelled() }}
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild -project Jarvis.xcodeproj -scheme Jarvis -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/PhoneBuild" CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/phone-build.log"
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: watch-build-logs
          path: |
            ${{ runner.temp }}/watch-build.log
            ${{ runner.temp }}/watch-head.txt
            ${{ runner.temp }}/watch-device-build.log
            ${{ runner.temp }}/phone-build.log
            ${{ runner.temp }}/watch-screenshots
