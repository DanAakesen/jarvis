name: Runner CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Runner lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: runner/requirements-dev.txt
      - run: python -m pip install --require-hashes -r runner/requirements-dev.txt
      - run: python -m ruff check runner
      - run: python -m pytest -q
        working-directory: runner
  images:
    name: Runner base and .NET images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag jarvis-runner:local runner
      - run: docker build --file runner/Dockerfile.dotnet --tag jarvis-runner-dotnet:local runner
      - name: Check packaged runtimes and non-root user
        run: |
          docker run --rm jarvis-runner:local sh -ec 'test "$(id -u)" != 0; python --version; node --version; npm --version; gh version; copilot --version; codex --version; codex-acp --version'
          docker run --rm jarvis-runner-dotnet:local dotnet --version
      - name: Serve the invocation API from the image
        run: |
          docker run --detach --name runner-smoke --publish 8088:8088 jarvis-runner:local
          trap 'docker logs runner-smoke; docker rm --force runner-smoke' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8088/invocations/docs/openapi.json > /tmp/runner-openapi.json; then
              python -c 'import json; assert json.load(open("/tmp/runner-openapi.json"))["info"]["title"] == "Jarvis Foundry runner"'
              exit 0
            fi
            sleep 2
          done
          exit 1
