name: Danish voice agent

on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: jarvis-production-deploy
  cancel-in-progress: false
  queue: max

jobs:
  changes:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      provision: ${{ steps.check.outputs.provision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [[ "$EVENT" == workflow_dispatch ]]; then
            echo "provision=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$TARGET_SHA^" "$TARGET_SHA" |
            grep -Eq '^(\.github/workflows/danish-voice-agent\.yml|agents/jarvis/scripts/provision_danish_voice\.py|agents/jarvis/requirements-voice-provisioner\.(in|txt)|infra/main\.bicep)$'; then
            echo "provision=true" >>"$GITHUB_OUTPUT"
          else
            echo "provision=false" >>"$GITHUB_OUTPUT"
          fi
  provision:
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.provision == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Load the Foundry project endpoint
        env:
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          az deployment group show --name jarvis-infra --resource-group rg-jarvis --subscription "$SUBSCRIPTION_ID" --query properties.outputs --output json --only-show-errors >"$RUNNER_TEMP/infra-outputs.json"
          endpoint=$(jq -er '.foundryAdminEndpoint.value' "$RUNNER_TEMP/infra-outputs.json")
          echo "FOUNDRY_PROJECT_ENDPOINT=$endpoint" >>"$GITHUB_ENV"
          az rest --method get --url "$endpoint/agents/jarvis?api-version=v1" --resource https://ai.azure.com/ --output none --only-show-errors
      - name: Install the hash-locked provisioning SDK
        run: python -m pip install --require-hashes -r agents/jarvis/requirements-voice-provisioner.txt
      - name: Provision the Danish voice agent
        run: python agents/jarvis/scripts/provision_danish_voice.py
      - name: Record remaining live verification
        if: always()
        run: |
          {
            echo '### Danish voice agent'
            echo
            echo 'Provisioning ran with MAI Transcribe (`da`), the Danish phrase list, and Harper locked to `da-DK`.'
            echo 'The authenticated browser round-trip still requires post-merge live verification.'
          } >>"$GITHUB_STEP_SUMMARY"
