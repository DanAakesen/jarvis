name: Vault mirror CI

# Qualification only; vault mirror has no production deployment yet.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  vault-mirror:
    name: Vault mirror lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm
        run: npm install --global npm@10.9.9
      - run: npm ci
      - run: npm run lint:vault-mirror
      - run: npm run typecheck:vault-mirror
      - run: npm test --workspace @jarvis/contracts
      - run: npm run test:vault-mirror
      - run: npm run build:vault-mirror
      - name: Build vault mirror image
        run: docker build --file apps/vault-mirror/Dockerfile --tag jarvis-vault-mirror:ci .
      - name: Smoke-test Obsidian CLI
        run: docker run --rm --entrypoint ob jarvis-vault-mirror:ci --version
      - name: Smoke-test runner with in-memory services
        run: >-
          docker run --rm
          --mount "type=bind,source=${{ github.workspace }}/apps/vault-mirror/test/container-smoke.mjs,target=/tmp/container-smoke.mjs,readonly"
          --entrypoint node jarvis-vault-mirror:ci /tmp/container-smoke.mjs
