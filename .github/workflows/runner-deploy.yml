name: Runner deploy

on:
  push:
    branches: [main]
    paths:
      - 'runner/**'
      - '.github/workflows/runner-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-production-deploy
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    # Set this after #11's infrastructure deployment. A skipped job makes the
    # missing prerequisite visible without pretending Azure acceptance passed.
    if: github.ref == 'refs/heads/main' && vars.JARVIS_INFRA_DEPLOYMENT_NAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    env:
      SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      INFRA_DEPLOYMENT: ${{ vars.JARVIS_INFRA_DEPLOYMENT_NAME }}
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      JARVIS_DISK_LOW_THRESHOLD_BYTES: ${{ vars.JARVIS_DISK_LOW_THRESHOLD_BYTES || '1073741824' }}
      GITHUB_APP_ID: ${{ vars.JARVIS_GITHUB_APP_ID }}
      JARVIS_GITHUB_APP_TOKEN_ENABLED: ${{ vars.JARVIS_GITHUB_APP_TOKEN_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Load infrastructure outputs
        run: |
          az deployment group show --resource-group rg-jarvis --name "$INFRA_DEPLOYMENT" --subscription "$SUBSCRIPTION_ID" --query properties.outputs --output json --only-show-errors > /tmp/runner-infra.json
          python -c 'import json, os; o=json.load(open("/tmp/runner-infra.json")); f=open(os.environ["GITHUB_ENV"], "a"); f.write("REGISTRY=" + o["containerRegistryName"]["value"] + "\nREGISTRY_HOST=" + o["containerRegistryLoginServer"]["value"] + "\n")'
      - name: Build small technology images in ACR
        run: |
          az acr build --registry "$REGISTRY" --image "jarvis-runner-base:$IMAGE_TAG" --file runner/Dockerfile --platform linux/amd64 --no-logs --subscription "$SUBSCRIPTION_ID" runner
          az acr build --registry "$REGISTRY" --image "jarvis-runner-dotnet:$IMAGE_TAG" --file runner/Dockerfile.dotnet --build-arg "RUNNER_BASE_IMAGE=$REGISTRY_HOST/jarvis-runner-base:$IMAGE_TAG" --platform linux/amd64 --no-logs --subscription "$SUBSCRIPTION_ID" runner
      - run: python -m pip install --require-hashes -r runner/requirements.txt
      - name: Deploy both capacity tiers and prove Key Vault access
        run: python runner/scripts/deploy.py --subscription "$SUBSCRIPTION_ID" --outputs /tmp/runner-infra.json --registry "$REGISTRY" --tag "$IMAGE_TAG" --state /tmp/runner-deployment.json
      - name: Save deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runner-deployment-${{ github.sha }}
          path: /tmp/runner-deployment.json
          if-no-files-found: warn
  prerequisite:
    if: github.ref == 'refs/heads/main' && vars.JARVIS_INFRA_DEPLOYMENT_NAME == ''
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Runner deployment and Key Vault acceptance are pending issue #11. Set JARVIS_INFRA_DEPLOYMENT_NAME to its successful infrastructure deployment, then run this workflow from main.' >> "$GITHUB_STEP_SUMMARY"
