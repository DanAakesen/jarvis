name: Voice probe

# Manual diagnostic: connects to the deployed Danish voice wrapper with the deploy identity and
# prints event types, errors and the close reason. No audio or transcript content is logged.
# It also checks that the hosted agent's chat route still reaches the container (expects its 401).
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to keep the session open
        default: "20"

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Load the Foundry project endpoint
        env:
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          endpoint=$(az deployment group show --name jarvis-infra --resource-group rg-jarvis --subscription "$SUBSCRIPTION_ID" --query properties.outputs.foundryAdminEndpoint.value --output tsv --only-show-errors)
          echo "FOUNDRY_PROJECT_ENDPOINT=$endpoint" >>"$GITHUB_ENV"
      - run: python -m pip install --quiet "websockets==15.0.1"
      - name: Probe the voice wrapper
        env:
          PROBE_SECONDS: ${{ inputs.seconds }}
        run: python agents/jarvis/scripts/voice_probe.py
      - name: Probe the hosted agent chat route
        run: |
          token=$(az account get-access-token --resource https://ai.azure.com --query accessToken --output tsv)
          status=$(curl --silent --show-error --max-time 60 --output "$RUNNER_TEMP/chat.json" --write-out '%{http_code}' \
            --request POST "$FOUNDRY_PROJECT_ENDPOINT/agents/jarvis/endpoint/protocols/invocations?api-version=v1" \
            --header "Authorization: Bearer $token" --header 'Content-Type: application/json' --data '{}')
          body=$(head -c 300 "$RUNNER_TEMP/chat.json")
          echo "chat route HTTP $status: $body"
          # Without delegated authorization the Jarvis container itself answers 401 {"error":"Unauthorized"}.
          [[ "$status" == 401 && "$body" == *Unauthorized* ]] || { echo "::error::The chat route did not reach the Jarvis container."; exit 1; }
