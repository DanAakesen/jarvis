# Keeps the "Copilot" worker label on open task issues in step with Copilot's work.
# A worker label (Codex, Copilot, Dan, Jarvis) means that worker has taken the task.
# Codex, Dan and Jarvis set their own label; Copilot can't edit labels, so this
# workflow sets its label. Rules: .github/scripts/worker_label.py. Part of P0-13.
#
# Every run recomputes all open issues from current state, so one shared queue
# that replaces a waiting run is safe: the newest run is always correct. Event-by-
# event label edits raced when an old Copilot PR closed while the task was
# reassigned (review on #116). pull_request_target so PRs with merge conflicts
# still trigger it (L38); it never checks out PR code.
name: Worker label

on:
  issues:
    types: [assigned, unassigned, reopened]
  pull_request_target:
    types: [opened, reopened, closed, edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: worker-label
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Reconcile the Copilot label
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/worker_label.py